# Déploiement de SECURA sur Netlify.
#
# SECURA est faite de fichiers statiques : il n'y a rien à compiler.
# Sans ce fichier, Netlify repère le package.json du dépôt, en déduit qu'il
# s'agit d'un projet à compiler, cherche une commande de compilation qui
# n'existe pas, et le déploiement échoue.
#
# Les deux en-têtes reprennent à l'identique ce que faisait la configuration
# Vercel pour le service worker et le manifeste de l'application.

[build]
  command = ""
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
