<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>SECURA — Rapport de site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', 'Segoe UI', sans-serif;
      background: #07090F;
      color: #E8EAF0;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .header {
      background: linear-gradient(135deg, #001828, #003344);
      padding: 24px 20px 20px;
      border-bottom: 1px solid #00E5FF22;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #00E5FF, #005577);
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .header-title { font-size: 20px; font-weight: 900; color: #00E5FF; }
    .header-sub { font-size: 12px; color: #8892A4; margin-top: 2px; }
    .container { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
    .card {
      background: #0E1420;
      border: 1px solid #1E2535;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .score-circle {
      width: 90px; height: 90px;
      border-radius: 50%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 4px solid;
      margin: 0 auto 16px;
    }
    .score-num { font-size: 28px; font-weight: 900; }
    .score-label { font-size: 10px; opacity: 0.7; }
    .site-name { font-size: 22px; font-weight: 900; text-align: center; margin-bottom: 4px; }
    .meta-row {
      display: flex; justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #1E2535;
      font-size: 13px;
    }
    .meta-row:last-child { border-bottom: none; }
    .meta-key { color: #8892A4; }
    .meta-val { font-weight: 700; }
    .section-title {
      font-size: 11px; font-weight: 800;
      color: #8892A4; letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .nc-item {
      display: flex; align-items: flex-start;
      gap: 10px; padding: 8px 0;
      border-bottom: 1px solid #1E253522;
      font-size: 12px; line-height: 1.4;
    }
    .nc-item:last-child { border-bottom: none; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0; margin-top: 4px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px; border-radius: 99px;
      font-size: 10px; font-weight: 800;
      border: 1px solid;
    }
    .green { color: #00C853; border-color: #00C85344; background: #00C85312; }
    .amber { color: #FFB300; border-color: #FFB30044; background: #FFB30012; }
    .red { color: #FF3D00; border-color: #FF3D0044; background: #FF3D0012; }
    .cyan { color: #00E5FF; }
    .loading {
      text-align: center; padding: 60px 20px;
      color: #8892A4; font-size: 14px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #00E5FF22;
      border-top: 3px solid #00E5FF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { text-align: center; padding: 40px 20px; color: #FF3D00; }
    .footer {
      text-align: center; margin-top: 24px;
      font-size: 11px; color: #8892A433;
    }
    .sig-area {
      display: flex; gap: 12px; margin-top: 10px;
    }
    .sig-box {
      flex: 1; background: #07090F;
      border: 1px solid #1E2535; border-radius: 10px;
      padding: 10px; text-align: center;
    }
    .sig-box img { max-width: 100%; max-height: 60px; }
    .sig-label { font-size: 9px; color: #8892A4; margin-bottom: 6px; }
    .no-sig { font-size: 11px; color: #8892A433; }
    .ok-item {
      display: flex; align-items: center;
      gap: 8px; padding: 6px 0;
      font-size: 12px; color: #8892A4;
      border-bottom: 1px solid #1E253511;
    }
    .ok-item:last-child { border-bottom: none; }
    .progress-bar {
      height: 6px; background: #1E2535;
      border-radius: 99px; overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      height: 100%; border-radius: 99px;
      transition: width 0.8s ease;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">🛡️</div>
  <div>
    <div class="header-title">SECURA</div>
    <div class="header-sub">Rapport de prévention & sécurité</div>
  </div>
</div>

<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    Chargement du rapport...
  </div>
</div>

<script>
const SUPA_URL = "https://pozdjdwjuwfwawjjiceb.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvemRqZHdqdXdmd2F3amppY2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MzUxMDMsImV4cCI6MjA5MTUxMTEwM30.zLntj6aSDffYbflLUPlgiRa21zLspZleNlGUgtkVPGs";

function scoreColor(s) {
  if (s >= 80) return '#00C853';
  if (s >= 55) return '#FFB300';
  return '#FF3D00';
}

function scoreLabel(s) {
  if (s >= 80) return 'BON';
  if (s >= 55) return 'MODÉRÉ';
  return 'CRITIQUE';
}

function fmt(d) {
  if (!d) return '';
  var p = d.split('-');
  return p[2] + '/' + p[1] + '/' + p[0];
}

function poidsColor(p) {
  if (p === 'critique') return '#FF3D00';
  if (p === 'eleve') return '#FF6D00';
  return '#FFB300';
}

function poidsLabel(p) {
  if (p === 'critique') return 'CRITIQUE';
  if (p === 'eleve') return 'ÉLEVÉ';
  return 'MODÉRÉ';
}

async function loadRapport() {
  var params = new URLSearchParams(window.location.search);
  var site = params.get('site');
  var app = document.getElementById('app');

  if (!site) {
    app.innerHTML = '<div class="error">❌ Aucun site spécifié.<br><br>Scannez le QR code d\'un site pour accéder à son rapport.</div>';
    return;
  }

  document.title = 'SECURA — ' + decodeURIComponent(site);

  try {
    var url = SUPA_URL + '/rest/v1/inspections?site=eq.' + encodeURIComponent(site) + '&order=date.desc&limit=1&select=*';
    var r = await fetch(url, {
      headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
    });
    var data = await r.json();

    if (!data || data.length === 0) {
      app.innerHTML = '<div class="error">📋 Aucun audit trouvé pour ce site.<br><br><span style="color:#8892A4;font-size:12px">' + decodeURIComponent(site) + '</span></div>';
      return;
    }

    var ins = data[0];
    var items = ins.items || [];
    var ncItems = items.filter(function(i) { return !i.ok; });
    var okItems = items.filter(function(i) { return i.ok; });
    var col = scoreColor(ins.score);
    var sigInsp = ins.sig_inspecteur || ins.sigInspecteur;
    var sigResp = ins.sig_responsable || ins.sigResponsable;

    // Group NC by section
    var ncBySec = {};
    ncItems.forEach(function(nc) {
      var sec = nc.s || 'Général';
      if (!ncBySec[sec]) ncBySec[sec] = [];
      ncBySec[sec].push(nc);
    });

    var html = '';

    // Site + score
    html += '<div class="card">';
    html += '<div class="score-circle" style="border-color:' + col + ';color:' + col + '">';
    html += '<span class="score-num">' + ins.score + '</span>';
    html += '<span class="score-label">/100</span>';
    html += '</div>';
    html += '<div class="site-name">' + ins.site + '</div>';
    html += '<div style="text-align:center;margin-bottom:14px"><span class="badge ' + (ins.score>=80?'green':ins.score>=55?'amber':'red') + '">' + scoreLabel(ins.score) + '</span></div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + ins.score + '%;background:' + col + '"></div></div>';
    html += '</div>';

    // Infos audit
    html += '<div class="card">';
    html += '<div class="section-title">Informations audit</div>';
    html += '<div class="meta-row"><span class="meta-key">Titre</span><span class="meta-val">' + ins.titre + '</span></div>';
    html += '<div class="meta-row"><span class="meta-key">Catégorie</span><span class="meta-val">' + ins.categorie + '</span></div>';
    html += '<div class="meta-row"><span class="meta-key">Date</span><span class="meta-val">' + fmt(ins.date) + '</span></div>';
    html += '<div class="meta-row"><span class="meta-key">Inspecteur</span><span class="meta-val">' + ins.inspecteur + '</span></div>';
    html += '<div class="meta-row"><span class="meta-key">Statut</span><span class="meta-val" style="color:' + (ins.statut==="Validée"?"#00C853":"#FFB300") + '">' + ins.statut + '</span></div>';
    html += '<div class="meta-row"><span class="meta-key">NC détectées</span><span class="meta-val" style="color:#FF3D00">' + ncItems.length + ' non-conformité' + (ncItems.length>1?'s':'') + '</span></div>';
    html += '</div>';

    // NC
    if (ncItems.length > 0) {
      html += '<div class="card">';
      html += '<div class="section-title">🚨 Non-conformités (' + ncItems.length + ')</div>';
      Object.keys(ncBySec).forEach(function(sec) {
        html += '<div style="font-size:11px;font-weight:800;color:#8892A4;margin:10px 0 6px;padding-top:8px;border-top:1px solid #1E2535">' + sec + '</div>';
        ncBySec[sec].forEach(function(nc) {
          var c = poidsColor(nc.poids || nc.p);
          html += '<div class="nc-item">';
          html += '<div class="dot" style="background:' + c + '"></div>';
          html += '<div style="flex:1">';
          html += '<div>' + nc.l + '</div>';
          html += '<div style="margin-top:4px"><span class="badge" style="color:' + c + ';border-color:' + c + '44;background:' + c + '12">' + poidsLabel(nc.poids||nc.p) + '</span>';
          if (nc.resp) html += ' <span style="font-size:10px;color:#8892A4">→ ' + nc.resp + '</span>';
          html += '</div></div></div>';
        });
      });
      html += '</div>';
    } else {
      html += '<div class="card" style="border-color:#00C85333;background:#00C85308">';
      html += '<div style="text-align:center;padding:10px 0;color:#00C853;font-weight:800">✅ Aucune non-conformité détectée</div>';
      html += '</div>';
    }

    // Signatures
    html += '<div class="card">';
    html += '<div class="section-title">Signatures</div>';
    html += '<div class="sig-area">';
    html += '<div class="sig-box">';
    html += '<div class="sig-label">INSPECTEUR</div>';
    if (sigInsp) html += '<img src="' + sigInsp + '" alt="Signature inspecteur"/>';
    else html += '<div class="no-sig">Non signé</div>';
    html += '</div>';
    html += '<div class="sig-box">';
    html += '<div class="sig-label">RESPONSABLE SITE</div>';
    if (sigResp) html += '<img src="' + sigResp + '" alt="Signature responsable"/>';
    else html += '<div class="no-sig">Non signé</div>';
    html += '</div>';
    html += '</div></div>';

    html += '<div class="footer">Généré par SECURA · ' + new Date().toLocaleDateString('fr-BE') + '</div>';

    app.innerHTML = html;

  } catch(e) {
    app.innerHTML = '<div class="error">❌ Erreur de chargement.<br><br><span style="font-size:12px;color:#8892A4">' + e.message + '</span></div>';
  }
}

loadRapport();
</script>
</body>
</html>
