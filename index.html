function mapAction(a){
  return {
    id:a.id,
    label:a.label||"",
    site:a.site||"",
    prio:a.prio||"MODÉRÉE",
    statut:a.statut||"En cours",
    echeance:a.echeance||null,
    resp:a.resp||"",
    retard:a.retard||false
  };
}

function mapInspection(ins){
  var m={
    id:ins.id, titre:ins.titre, site:ins.site, categorie:ins.categorie,
    inspecteur:ins.inspecteur, date:ins.date, statut:ins.statut,
    score:ins.score, nc:ins.nc, notes:ins.notes||"", items:ins.items||[]
  };
  if(ins.sigInspecteur) m["sig_inspecteur"]=ins.sigInspecteur;
  if(ins.sigResponsable) m["sig_responsable"]=ins.sigResponsable;
  return m;
}

const supa = {
  async get(table, opts){
    let url = SUPA_URL+"/rest/v1/"+table+"?select=*";
    if(opts&&opts.eq) url += "&"+opts.eq.col+"=eq."+opts.eq.val;
    if(opts&&opts.order) url += "&order="+opts.order;
    if(opts&&opts.limit) url += "&limit="+opts.limit;
    const r = await fetch(url,{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}});
    if(!r.ok){console.error("Supabase GET error:",table,r.status);return null;}
    return r.json();
  },
  async upsert(table, data){
    const r = await fetch(SUPA_URL+"/rest/v1/"+table,{
      method:"POST",
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify(data)
    });
    return r.ok;
  },
  async del(table, id){
    const r = await fetch(SUPA_URL+"/rest/v1/"+table+"?id=eq."+String(id),{
      method:"DELETE",
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"}
    });
    if(!r.ok){ console.error("DEL failed",table,id,r.status); }
    return r.ok;
  },
  async patch(table, id, data){
    const r = await fetch(SUPA_URL+"/rest/v1/"+table+"?id=eq."+id,{
      method:"PATCH",
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify(data)
    });
    return r.ok;
  }
};

// ═══════════════════════════════════════════════════════════════
const LS = {
  save: function(key, data){
    try{ localStorage.setItem("secura_"+key, JSON.stringify(data)); }catch(e){}
  },
  load: function(key){
    try{ var d=localStorage.getItem("secura_"+key); return d?JSON.parse(d):null; }catch(e){ return null; }
  },
  addPending: function(type, data){
    try{
      var pending=LS.load("pending")||[];
      pending.push({type:type,data:data,ts:Date.now()});
      LS.save("pending", pending);
    }catch(e){}
  },
  getPending: function(){ return LS.load("pending")||[]; },
  clearPending: function(){ try{ localStorage.removeItem("secura_pending"); }catch(e){} }
};

const ANIM_CSS = [
  "@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}",
  "@keyframes scaleIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}",
  "@keyframes ringExpand{0%{opacity:0.7;transform:scale(0.5)}100%{opacity:0;transform:scale(1.9)}}",
  "@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}",
  "@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}",
  ".card-hover{transition:transform .2s,box-shadow .2s}",
  ".card-hover:hover{transform:translateY(-2px)}",
  ".tech-bg{background:linear-gradient(145deg,#0D0508 0%,#1A0A10 25%,#2A0F1A 50%,#1A0A10 75%,#0D0508 100%);background-size:400% 400%;animation:techShift 20s ease infinite;}",
  "@keyframes techShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}",
  ".tech-grid{position:fixed;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(128,0,32,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(128,0,32,.06) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;z-index:0;}",
].join("\n");

function InjectCSS(){
  React.useEffect(()=>{
    if(!document.getElementById("sa-css")){
      const el=document.createElement("style");
      el.id="sa-css"; el.textContent=ANIM_CSS;
      document.head.appendChild(el);
    }
  },[]);
  return null;
}

function SplashScreen({onDone, appName, accent}){
  const [phase,setPhase]=useState(0);
  const [prog,setProg]=useState(0);
  // Inject animation CSS immediately so rings work before InjectCSS runs
  React.useEffect(function(){
    if(!document.getElementById("splash-css")){
      var el=document.createElement("style");
      el.id="splash-css";
      el.textContent=ANIM_CSS;
      document.head.appendChild(el);
    }
  },[]);
  React.useEffect(()=>{
    const t1=setTimeout(()=>setPhase(1),600);
    const t2=setTimeout(()=>setPhase(2),2200);
    const t3=setTimeout(()=>onDone(),2400);
    let p=0;
    const iv=setInterval(()=>{p+=2;setProg(Math.min(p,100));if(p>=100)clearInterval(iv);},40);
    return ()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);clearInterval(iv);};
  },[]);
  const ac=accent||"#00E5FF";
  return (
    <div style={{position:"fixed",inset:0,zIndex:9999,background:"linear-gradient(160deg,#07090F,#0D1825)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",transition:"opacity .5s",opacity:phase===2?0:1}}>
      {[0,1,2].map(function(i){
        return (
          <div key={i} style={{position:"absolute",width:160+i*70,height:160+i*70,borderRadius:"50%",border:"1px solid "+ac,opacity:0,animation:"ringExpand "+(1.8+i*.4)+"s ease-out "+(i*.25)+"s infinite"}}/>
        );
      })}
      <div style={{width:110,height:110,borderRadius:26,overflow:"hidden",boxShadow:"0 0 60px "+ac+"55",marginBottom:28,border:"2px solid "+ac+"44",animation:"scaleIn .6s both"}}>
        <img src={SHIELD_SRC} alt="SECURA" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
      </div>
      <div style={{fontSize:24,fontWeight:700,letterSpacing:10,color:"#fff",opacity:phase>=1?1:0,transform:phase>=1?"none":"translateY(12px)",transition:"all .5s",marginBottom:6,textAlign:"center",width:"100%"}}>{appName||"SECURA"}</div>
      <div style={{fontSize:12,color:"rgba(255,255,255,.35)",letterSpacing:3,opacity:phase>=1?1:0,transition:"all .5s .15s",marginBottom:48}}>Audits · Sécurité</div>
      <div style={{width:160,height:3,background:"rgba(255,255,255,.08)",borderRadius:99,overflow:"hidden",opacity:phase>=1?1:0,transition:"opacity .4s .2s"}}>
        <div style={{height:"100%",background:"linear-gradient(90deg,"+ac+","+ac+"99)",width:prog+"%",borderRadius:99,transition:"width .04s linear"}}/>
      </div>
    </div>
  );
}

// SCORING SYSTEM — Pénalités
// Départ : 100 pts
// NC Critique  → −10 pts
// NC Élevé     → −5  pts
// NC Mineur    → −1  pt
// Score final = max(0, 100 − Σ pénalités NC)
// ═══════════════════════════════════════════════════════════════════════
let PENALITE = { critique:5, eleve:3, mineur:1 };
let DELAIS    = { critique:0, eleve:60, mineur:120 };
function deadlineFromNow(poids){
  const days=DELAIS[poids]||120;
  if(days===0) return new Date().toISOString().split("T")[0]; // immédiat
  const d=new Date(); d.setDate(d.getDate()+days);
  return d.toISOString().split("T")[0];
}
function delaiLabel(poids){
  return poids==="critique"?"Sans délai (immédiat)":poids==="eleve"?"≤ 2 mois":"≤ 4 mois";
}

function calcScore(items){
  if(!items||!items.length) return 100;
  const pen = items.filter(i=>!i.ok).reduce((s,i)=>s+(PENALITE[i.poids||i.p]||0),0);
  return Math.max(0, 100 - pen);
}
function scoreColor(s){ if(s===null||s===undefined||isNaN(s)) return C.muted; return s>=80?C.green:s>=55?C.amber:C.red; }
function poidsColor(p){ if(!p) return C.muted; return p==="critique"?C.red:p==="eleve"?C.orange:C.amber; }
function poidsLabel(p){ return p==="critique"?"CRITIQUE":p==="eleve"?"ÉLEVÉ":"MINEUR"; }
function poidsPen(p){ const v=PENALITE[p]||0; return `-${v}pt${v>1?"s":""}`; }
function fmt(d){ if(!d)return""; const p=d.split("-"); return `${p[2]}/${p[1]}/${p[0]}`; }

function Bar({v,col,h=5}){
  return <div style={{background:C.dim,borderRadius:99,height:h,overflow:"hidden"}}>
    <div style={{width:`${Math.max(0,Math.min(100,v))}%`,height:"100%",background:col,borderRadius:99,boxShadow:`0 0 4px ${col}55`,transition:"width .7s ease"}}/>
  </div>;
}
function Tag({label,color,small}){
  return <span style={{fontSize:small?9:10,padding:small?"2px 6px":"3px 9px",borderRadius:6,background:`${color}20`,color,fontWeight:800}}>{label}</span>;
}
function StatutBadge({s}){
  const M={"À valider":{bg:C.amber,text:"#000"},"En cours":{bg:`${C.cyan}25`,text:C.cyan,border:C.cyan},"Brouillon":{bg:`${C.muted}20`,text:C.muted,border:C.muted},"Validée":{bg:`${C.green}20`,text:C.green,border:C.green}};
  const sc=M[s]||{bg:C.dim,text:C.muted};
  return <span style={{fontSize:10,padding:"3px 9px",borderRadius:6,background:sc.bg,color:sc.text,fontWeight:800,border:`1px solid ${sc.border||"transparent"}`}}>{s}</span>;
}
function ScoreRing({score,size=64}){
  if(score===null||score===undefined||isNaN(score)) score=0;
  const col=scoreColor(score); const r=(size/2)-5; const circ=2*Math.PI*r; const dash=(score/100)*circ;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.dim} strokeWidth={6}/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={6}
      strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
      transform={`rotate(-90 ${size/2} ${size/2})`}
      style={{filter:`drop-shadow(0 0 4px ${col})`}}/>
    <text x={size/2} y={size/2+4} textAnchor="middle" fill={col} fontSize={size>50?13:10} fontWeight={900}>{score}</text>
  </svg>;
}

  const items=(CHECKLISTS[cat]||[]).map((q,i)=>({...q,poids:q.p,ok:okMap?okMap[i]:i%4!==0,comment:"",photos:[]}));
  return {id,titre,site,categorie:cat,inspecteur:insp,date,statut,items,notes:"",score:calcScore(items),nc:items.filter(i=>!i.ok).length};
}

// PERMISSIONS — contrôle d'accès par rôle
// ═══════════════════════════════════════════════════════════════════════
function hasAccess(user,config,feature){
  if(!user) return false;
  if(user.role==="Admin") return true;
  var perms=config&&config.permissions&&config.permissions[user.role];
  if(!perms) return feature==="dashboard"||feature==="actions";
  return !!perms[feature];
}

function LoginScreen({onLogin, users}){
  const [email,setEmail]=useState(""); const [pass,setPass]=useState(""); const [err,setErr]=useState(""); const [load,setLoad]=useState(false);
  // Merge static USERS with dynamic respsState users
  const allUsers=(users&&users.length&&typeof users[0]==="object"&&users[0].email
    ? users
    : USERS).filter(function(u){return u&&u.nom;});
  const handle=()=>{setLoad(true);setErr("");setTimeout(()=>{var em=email.trim().toLowerCase();var pw=pass.trim();const u=allUsers.find(function(u){return u.email&&u.email.trim().toLowerCase()===em&&u.pass&&u.pass.trim()===pw;});if(u)onLogin(u);else{setErr("Identifiants incorrects.");setLoad(false);}},700);};
  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",justifyContent:"center",padding:"32px 22px",background:`linear-gradient(165deg,${C.bg} 55%,#0D1825)`}}>
      <div style={{textAlign:"center",marginBottom:32}}>
        <div style={{width:80,height:80,borderRadius:22,overflow:"hidden",boxShadow:"0 0 40px "+C.cyan+"55",marginBottom:14,border:"2px solid "+C.cyan+"33",display:"inline-block"}}><img src={SHIELD_SRC} alt="SECURA" style={{width:"100%",height:"100%",objectFit:"cover"}}/></div>
        <div style={{fontSize:30,fontWeight:900,letterSpacing:6,color:C.text,marginBottom:4}}>SECURA</div>
        <div style={{fontSize:13,color:C.muted,marginTop:3}}>Audits & inspections sécurité professionnelle</div>
      </div>
      <div style={{...S.card(),padding:24,marginBottom:18}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:18}}>Connexion</div>
        <label style={S.label}>Email</label>
        <input style={{...S.input,marginBottom:14}} type="email" placeholder="votre@email.be" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()} autoCapitalize="off" autoCorrect="off" autoComplete="email"/>
        <label style={S.label}>Mot de passe</label>
        <input style={{...S.input,marginBottom:10}} type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}/>
        {err&&<div style={{fontSize:12,color:C.red,marginBottom:10,padding:"8px 12px",background:`${C.red}12`,borderRadius:8}}>{err}</div>}
        <button style={{...S.btn(C.cyan),marginTop:8,opacity:(load?0.65:1)}} onClick={handle} disabled={load}>{load?"Connexion...":"Se connecter →"}</button>
      </div>
    </div>
  );
}

              <button onClick={function(){toggle(i);}} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"14px 16px",background:"transparent",border:"none",cursor:"pointer",color:C.text,textAlign:"left"}}>
                <div style={{width:42,height:42,borderRadius:12,background:sec.color+"15",border:"1px solid "+sec.color+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{sec.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:14,fontWeight:800,color:isOpen?sec.color:C.text}}>{sec.title}</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:1}}>{sec.sub}</div>
                </div>
                <div style={{fontSize:16,color:C.muted,transform:isOpen?"rotate(90deg)":"rotate(0deg)",transition:"transform .2s",flexShrink:0}}>›</div>
              </button>
              {isOpen&&(
                <div style={{padding:"0 16px 16px"}}>
                  {sec.items.map(function(item,j){
                    var parts=item.split(" — ");
                    return (
                      <div key={j} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:j<sec.items.length-1?"1px solid "+C.dim:"none",alignItems:"flex-start"}}>
                        <div style={{width:6,height:6,borderRadius:99,background:sec.color,marginTop:6,flexShrink:0}}/>
                        <div style={{fontSize:12,lineHeight:1.5,color:C.text}}>
                          {parts.length>1?(
                            <span><span style={{fontWeight:700}}>{parts[0]}</span><span style={{color:C.cyan}}> — {parts[1]}</span></span>
                          ):item}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{padding:"20px 14px",textAlign:"center"}}>
        <div style={{fontSize:11,color:C.muted}}>Version {appName} · Développé avec ❤️</div>
      </div>
    </div>
  );
}

// ASSISTANT IA — Code du bien-être au travail belge
// ═══════════════════════════════════════════════════════════════════════
function AIScreen({onBack,config}){
  var appName=(config&&config.appName)||"SECURA";
  const [messages,setMessages]=useState([]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  var SYSTEM_PROMPT="Tu es un expert juridique et technique spécialisé en prévention et protection au travail en Belgique. Tu travailles au sein de l'application "+appName+", un outil d'audit HSE.\n\nDOMAINES DE COMPÉTENCE :\nTu couvres l'ensemble de la législation belge en matière de sécurité et bien-être au travail :\n- Code du bien-être au travail (Loi du 4 août 1996 et ses arrêtés d'exécution — Livres I à X)\n- RGPT (Règlement Général pour la Protection du Travail) — parties encore en vigueur\n- RGIE (Règlement Général sur les Installations Électriques)\n- CODEX sur le bien-être au travail\n- Loi sur le bien-être du 4 août 1996\n- Arrêtés royaux relatifs aux chantiers temporaires et mobiles\n- Arrêtés royaux sur les équipements de travail, EPI, agents chimiques, biologiques, cancérigènes\n- Réglementation SEVESO (risques d'accidents majeurs)\n- Normes NBN pertinentes (NBN S 21-100 détection incendie, NBN EN ISO 7010 signalisation, etc.)\n- Directives européennes transposées (89/391/CEE directive-cadre, 2009/104/CE équipements, etc.)\n- Publications du SPF Emploi, Travail et Concertation sociale\n- Guides et fiches BeSWIC (Belgian Safe Work Information Center)\n- Réglementation Fedris (accidents du travail et maladies professionnelles)\n- Règles spécifiques aux bâtiments publics, IACF, ERP\n- Réglementation environnementale liée à la sécurité (VLAREM, permis d'environnement)\n\nRÈGLES STRICTES :\n- Tu ne réponds QU'AUX questions relatives à la prévention, la sécurité au travail, l'hygiène, l'ergonomie, les risques psychosociaux, les accidents du travail, les équipements de protection, l'environnement professionnel et la législation HSE belge et européenne.\n- Si la question ne concerne PAS ces domaines, tu refuses poliment.\n- Tu cites les articles, livres, titres, arrêtés royaux et normes quand c'est pertinent.\n- Tu réponds en français, de manière claire et accessible, même si la question est posée de façon informelle.\n- Tu précises toujours que tes réponses sont informatives et ne remplacent pas un avis juridique professionnel.\n- Si tu n'es pas sûr d'une information, dis-le honnêtement.\n\nRECHERCHE WEB — RÈGLE IMPORTANTE :\n- Tu connais déjà très bien la législation belge. N'utilise la recherche web QUE dans ces cas précis :\n  1. La question porte sur une modification législative APRÈS 2025\n  2. La question mentionne explicitement une date ou un événement récent que tu ne connais pas\n  3. La question porte sur un numéro d'arrêté royal spécifique dont tu n'es pas certain\n- Pour toutes les autres questions (principes généraux, obligations, articles du Code, bonnes pratiques, normes), réponds directement SANS recherche web.\n- Si tu effectues une recherche web, signale-le avec 🌐 au début de ta réponse.";

  function scrollDown(){setTimeout(function(){endRef.current&&endRef.current.scrollIntoView({behavior:"smooth"});},100);}

  var apiKey=localStorage.getItem("secura_ai_key")||"";

  function send(){
    if(!input.trim()||loading) return;
    if(!apiKey){alert("Clé API non configurée. Allez dans Profil → Système → Clé API IA.");return;}
    var userMsg={role:"user",content:input.trim()};
    var newMsgs=[].concat(messages,[userMsg]);
    setMessages(newMsgs);
    setInput("");
    setLoading(true);
    scrollDown();
    var apiMessages=newMsgs.map(function(m){return {role:m.role,content:m.content};});
    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":localStorage.getItem("secura_ai_key")||"","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:1500,system:SYSTEM_PROMPT,messages:apiMessages,tools:[{type:"web_search_20250305",name:"web_search"}]})
    }).then(function(r){return r.json();}).then(function(data){
      var txt="";
      if(data.content&&data.content.length>0){
        txt=data.content.filter(function(c){return c.type==="text";}).map(function(c){return c.text||"";}).join("");
      } else if(data.error){
        txt="Erreur : "+(data.error.message||"Problème de connexion");
      } else {
        txt="Pas de réponse reçue. Réessayez.";
      }
      setMessages(function(prev){return [].concat(prev,[{role:"assistant",content:txt}]);});
      setLoading(false);
      scrollDown();
    }).catch(function(err){
      setMessages(function(prev){return [].concat(prev,[{role:"assistant",content:"Erreur de connexion. Vérifiez votre connexion internet et réessayez."}]);});
      setLoading(false);
      scrollDown();
    });
  }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",maxHeight:"100vh"}}>
      <div style={{padding:"16px",display:"flex",alignItems:"center",gap:10,borderBottom:"1px solid "+C.border,flexShrink:0}}>
        <button onClick={onBack} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"8px 12px",color:C.cyan,cursor:"pointer",fontSize:13,fontWeight:700}}>← Retour</button>
        <div style={{flex:1}}>
          <div style={{fontSize:16,fontWeight:900,display:"flex",alignItems:"center",gap:6}}>🤖 Assistant IA</div>
          <div style={{fontSize:10,color:C.purple}}>Prévention & législation HSE belge</div>
        </div>
        {messages.length>0&&<button onClick={function(){setMessages([]);}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:8,padding:"5px 10px",color:C.muted,cursor:"pointer",fontSize:10}}>🗑️ Effacer</button>}
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"14px",display:"flex",flexDirection:"column",gap:12}}>
        {messages.length===0&&(
          <div style={{textAlign:"center",padding:"40px 16px",color:C.muted}}>
            <div style={{fontSize:48,marginBottom:16}}>🤖</div>
            <div style={{fontSize:16,fontWeight:800,color:C.purple,marginBottom:8}}>Assistant IA</div>
            <div style={{fontSize:13,lineHeight:1.6,marginBottom:20}}>Posez vos questions sur la législation belge en prévention et sécurité au travail — Code du bien-être, RGPT, RGIE, normes NBN, directives européennes.</div>
            {!apiKey&&<div style={{padding:"12px 16px",background:C.orange+"15",border:"1px solid "+C.orange+"33",borderRadius:10,marginBottom:16,fontSize:12,color:C.orange}}>⚠️ Clé API non configurée — Allez dans Profil → Système → Clé API IA</div>}
            <div style={{display:"flex",flexDirection:"column",gap:8,maxWidth:320,margin:"0 auto"}}>
              {["Quelles sont les obligations de l'employeur en matière de premiers secours ?","Un travailleur peut-il refuser un travail dangereux ?","Quels EPI sont obligatoires sur un chantier ?","Quelle est la fréquence des contrôles des extincteurs ?","Que dit le RGIE sur les installations basse tension ?","Quelles normes NBN s'appliquent à la détection incendie ?"].map(function(q,i){
                return (
                  <button key={i} onClick={function(){setInput(q);}} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"10px 14px",color:C.text,cursor:"pointer",fontSize:12,textAlign:"left",lineHeight:1.4}}>
                    <span style={{color:C.purple,marginRight:6}}>💬</span>{q}
                  </button>
                );
              })}
            </div>
          </div>
        )}
        {messages.map(function(msg,i){
          var isUser=msg.role==="user";
          return (
            <div key={i} style={{display:"flex",justifyContent:isUser?"flex-end":"flex-start"}}>
              <div style={{maxWidth:"85%",padding:"12px 16px",borderRadius:isUser?"16px 16px 4px 16px":"16px 16px 16px 4px",background:isUser?C.cyan+"20":C.surface,border:"1px solid "+(isUser?C.cyan+"33":C.border),color:C.text}}>
                {!isUser&&<div style={{fontSize:10,color:C.purple,fontWeight:700,marginBottom:4}}>🤖 Assistant IA</div>}
                <div style={{fontSize:13,lineHeight:1.6,whiteSpace:"pre-wrap"}}>{msg.content}</div>
              </div>
            </div>
          );
        })}
        {loading&&(
          <div style={{display:"flex",justifyContent:"flex-start"}}>
            <div style={{padding:"12px 16px",borderRadius:"16px 16px 16px 4px",background:C.surface,border:"1px solid "+C.border}}>
              <div style={{fontSize:10,color:C.purple,fontWeight:700,marginBottom:4}}>🤖 Assistant IA</div>
              <div style={{fontSize:13,color:C.muted}}>Recherche en cours<span style={{animation:"blink 1s infinite"}}>...</span></div>
            </div>
          </div>
        )}
        <div ref={endRef}/>
      </div>
      <div style={{padding:"12px 14px",borderTop:"1px solid "+C.border,display:"flex",gap:8,flexShrink:0,background:C.bg}}>
        <input value={input} onChange={function(e){setInput(e.target.value);}} onKeyDown={function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
          placeholder="Posez votre question..."
          style={{...S.input,flex:1,padding:"12px 16px",fontSize:14,borderRadius:14}}/>
        <button onClick={send} disabled={!input.trim()||loading}
          style={{background:input.trim()&&!loading?"linear-gradient(135deg,"+C.purple+",#7C3AFF)":"transparent",
            border:input.trim()&&!loading?"none":"1px solid "+C.border,
            borderRadius:14,padding:"12px 18px",color:input.trim()&&!loading?"#fff":C.muted,
            cursor:input.trim()&&!loading?"pointer":"default",fontSize:14,fontWeight:900,flexShrink:0}}>
          ➤
        </button>
      </div>
    </div>
  );
}

var _chartEl=null;
function DashboardScreen({user,inspections,actions,onNav,config,sitesState,appState}){
  const [chartTab,setChartTab]=useState(CATEGORIES[0]);
  const [siteFilter,setSiteFilter]=useState("Tous");
  const [showHelp,setShowHelp]=useState(false);
  const [showAI,setShowAI]=useState(false);

  if(showHelp) return <HelpScreen onBack={function(){setShowHelp(false);}} config={config}/>;
  if(showAI) return <AIScreen onBack={function(){setShowAI(false);}} config={config}/>;

  function selectCat(c){
    var list=(sitesState&&sitesState.length>0)?sitesState:SITES;
    var idx=list.findIndex(function(s){return fInspections.some(function(x){return x.site===s&&x.categorie===c;});});
    setChartTab(c);
    function doScroll(){if(!_chartEl||idx<=0)return;var t=idx*56-10;_chartEl.scrollLeft=t;try{_chartEl.scrollTo({left:t,behavior:"instant"});}catch(e){}}
    setTimeout(doScroll,300);setTimeout(doScroll,600);
  }

  // Données filtrées par site
  var fInspections=siteFilter==="Tous"?inspections:inspections.filter(function(i){return i.site===siteFilter;});
  var fActions=siteFilter==="Tous"?actions:actions.filter(function(a){return a.site===siteFilter;});

  const avgScore=fInspections.length?Math.round(fInspections.reduce((s,i)=>s+i.score,0)/fInspections.length):100;
  const totalNC=fInspections.reduce((s,i)=>s+i.nc,0);
  const critActs=fActions.filter(a=>a.prio==="CRITIQUE"&&a.statut!=="Clôturée").length;
  const validated=fInspections.filter(i=>i.statut==="Validée").length;
  const penTotal=fInspections.reduce((s,i)=>s+(100-i.score),0);

  const siteList=(sitesState&&sitesState.length>0)?sitesState:SITES;
  const sitePens=siteList.map(function(site){
    var ins=fInspections.filter(function(i){return i.site===site;});
    var sc=ins.length?Math.round(ins.reduce(function(s,i){return s+i.score;},0)/ins.length):100;
    return {site:site,score:sc,ins:ins.length};
  }).sort(function(a,b){return a.score-b.score;});

  const catBarData=fInspections.filter(i=>i.categorie===chartTab);
  const catColor=(CAT_META[chartTab]&&CAT_META[chartTab].color)||C.cyan;

  return (
    <div style={{paddingBottom:90}}>
      {/* Header */}
      <div style={{padding:"20px 16px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:12,color:C.muted,letterSpacing:2,textTransform:"uppercase"}}>Bonjour, {user.nom.split(" ")[0]}</div>
          <div style={{fontSize:20,fontWeight:900,marginTop:3}}>{(config&&config.appName)||"SECURA"}</div>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {hasAccess(user,config,"ia")&&<button onClick={function(){setShowAI(true);}} style={{width:36,height:36,borderRadius:11,background:C.purple+"15",border:"1px solid "+C.purple+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,cursor:"pointer",color:C.purple,fontWeight:900}}>🤖</button>}
          <button onClick={function(){setShowHelp(true);}} style={{width:36,height:36,borderRadius:11,background:C.cyan+"15",border:"1px solid "+C.cyan+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,cursor:"pointer",color:C.cyan,fontWeight:900}}>?</button>
          <div style={{width:36,height:36,borderRadius:11,background:C.cyan+"18",border:"1px solid "+C.cyan+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:C.cyan}}>{user.avatar}</div>
        </div>
      </div>
      {/* Filtre par site */}
      <div style={{padding:"12px 14px 0",display:"flex",gap:6,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        {["Tous"].concat(siteList).map(function(s){
          var active=siteFilter===s;
          return (
            <button key={s} onClick={function(){setSiteFilter(s);}}
              style={{flexShrink:0,padding:"6px 14px",borderRadius:99,border:"1px solid",
                borderColor:active?C.cyan:C.border,
                background:active?C.cyan+"15":"transparent",
                color:active?C.cyan:C.muted,
                fontSize:11,fontWeight:active?800:500,cursor:"pointer",transition:"all .2s"}}>
              {s==="Tous"?"🏢 Tous les sites":s}
            </button>
          );
        })}
      </div>
      {siteFilter!=="Tous"&&(
        <div style={{margin:"10px 14px 0",padding:"8px 12px",background:C.cyan+"10",border:"1px solid "+C.cyan+"33",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <span style={{fontSize:12,color:C.cyan,fontWeight:700}}>📍 Filtré : {siteFilter}</span>
          <button onClick={function(){setSiteFilter("Tous");}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:8,padding:"3px 10px",color:C.muted,fontSize:10,cursor:"pointer"}}>✕ Réinitialiser</button>
        </div>
      )}
      {critActs>0&&<div style={{margin:"14px 14px 0",background:`${C.red}10`,border:`1px solid ${C.red}33`,borderRadius:14,padding:"11px 14px",display:"flex",gap:10,alignItems:"center"}}><span style={{fontSize:18}}>🚨</span><div><div style={{fontSize:13,fontWeight:700,color:C.red}}>{critActs} action(s) critique(s) — pénalité active</div><div style={{fontSize:11,color:C.muted}}>Chaque NC critique retire {(appState&&appState.penalites?appState.penalites.critique:5)} pts du score</div></div></div>}

      {/* Sites critiques */}
      {siteFilter==="Tous"&&(
      <div style={{margin:"14px 14px 0",...S.card(`${C.red}25`),background:`linear-gradient(140deg,#0F1420,#180A0A)`}}>
        <div style={{fontSize:12,fontWeight:800,color:C.red,letterSpacing:1,marginBottom:12}}>⚠ SITES LES PLUS CRITIQUES</div>
        {sitePens.slice(0,5).map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:i===0?`${C.red}08`:"transparent",borderRadius:10,marginBottom:4,border:i===0?`1px solid ${C.red}22`:"none"}}>
            <ScoreRing score={s.score} size={42}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700}}>{s.site}</div>
              <div style={{fontSize:10,color:C.muted}}>{s.ins} inspection(s) · pénalité {100-s.score}pts</div>
            </div>
            <Tag label={s.score>=80?"BON":s.score>=55?"MODÉRÉ":"CRITIQUE"} color={scoreColor(s.score)}/>
          </div>
        ))}
      </div>
      )}

      {/* 4 KPIs */}
      <div style={{padding:"14px 14px 0",display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {[
          {label:"Score moyen",val:`${avgScore}/100`,sub:`−${100-avgScore}pts de pénalité moy.`,col:scoreColor(avgScore),prog:avgScore},
          {label:"Total pénalités",val:`−${penTotal}`,sub:`${totalNC} NC au total`,col:C.red,prog:null},
          {label:"Actions critiques",val:critActs,sub:"Chacune = −"+(appState&&appState.penalites?appState.penalites.critique:5)+"pts",col:C.orange,prog:null},
          {label:"Inspections",val:`${validated}/${fInspections.length}`,sub:"validées",col:C.cyan,prog:fInspections.length?Math.round(validated/fInspections.length*100):0},
        ].map((k,i)=>(
          <div key={i} style={{...S.card(`${k.col}22`)}}>
            <div style={{fontSize:10,color:C.muted,letterSpacing:1,textTransform:"uppercase",marginBottom:6}}>{k.label}</div>
            <div style={{fontSize:30,fontWeight:900,color:k.col,lineHeight:1}}>{k.val}</div>
            {k.prog!==null&&<div style={{marginTop:8}}><Bar v={k.prog} col={k.col}/></div>}
            <div style={{fontSize:11,color:k.col,marginTop:6,opacity:.8}}>{k.sub}</div>
          </div>
        ))}
      </div>

      {/* CTA */}
      <div style={{margin:"14px 14px 0"}}>
        <button onClick={()=>onNav("new-inspection")} style={{width:"100%",border:"none",borderRadius:18,padding:"17px",background:`linear-gradient(135deg,${C.cyan},#007799)`,cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:44,height:44,borderRadius:12,background:"rgba(0,0,0,.18)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>📋</div>
          <div style={{textAlign:"left"}}><div style={{fontSize:17,fontWeight:900,color:"#000"}}>Nouvelle inspection</div><div style={{fontSize:12,color:"rgba(0,0,0,.55)"}}>{(CHECKLISTS[chartTab]&&CHECKLISTS[chartTab].length)||40}+ questions · score pénalité 100→0</div></div>
          <div style={{marginLeft:"auto",fontSize:20,color:"rgba(0,0,0,.35)"}}>→</div>
        </button>
      </div>

      {/* Graphique */}
      <div style={{margin:"14px 14px 0",...S.card()}}>
        <div style={{fontSize:15,fontWeight:800,marginBottom:2}}>{siteFilter==="Tous"?"Score par catégorie & site":"Score par catégorie — "+siteFilter}</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Système pénalité : 100 − Σ déductions NC</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:14}}>
          {CATEGORIES.map(c=>{const m=CAT_META[c]; return (
            <button key={c} onClick={()=>selectCat(c)} style={{flexShrink:0,padding:"4px 9px",borderRadius:99,border:"1px solid",borderColor:chartTab===c?m.color:C.border,background:chartTab===c?`${m.color}15`:"transparent",color:chartTab===c?m.color:C.muted,fontSize:10,fontWeight:700,cursor:"pointer"}}>{m.icon} {c}</button>
          );})}
        </div>
        <div ref={function(el){_chartEl=el;}} style={{overflowX:"scroll",marginBottom:4}}>
          <div style={{display:"flex",alignItems:"flex-end",gap:6,height:130,minWidth:Math.max((siteFilter==="Tous"?siteList.length:1)*54,280)+"px"}}>
            {(siteFilter==="Tous"?siteList:siteList.filter(function(s){return s===siteFilter;})).map(function(site,i){
              var ins=fInspections.find(function(x){return x.site===site&&x.categorie===chartTab;});
              var v=ins?ins.score:0; var col=scoreColor(v);
              return (
                <div key={i} style={{width:50,flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center",gap:3,height:"100%",justifyContent:"flex-end"}}>
                  <div style={{fontSize:9,fontWeight:800,color:v>0?col:C.muted}}>{v>0?v:"-"}</div>
                  <div style={{width:"100%",height:Math.max(v,6)+"%",borderRadius:"4px 4px 0 0",background:v>0?"linear-gradient(180deg,"+col+"BB,"+col+"22)":C.dim,transition:"height .6s"}}>{v>0&&<div style={{height:2,background:col}}/>}</div>
                  <div style={{fontSize:7,color:C.muted,textAlign:"center",lineHeight:1.1,width:50,wordBreak:"break-word"}}>{site}</div>
                </div>
              );
            })}
          </div>
        </div>
        <div style={{display:"flex",gap:12,fontSize:9,color:C.muted,marginTop:6}}>
          <span style={{color:C.green}}>● ≥80 Bon</span><span style={{color:C.amber}}>● 55-79 Modéré</span><span style={{color:C.red}}>● &lt;55 Critique</span>
        </div>

          );
        })}
      </div>
    </div>
  );
}

// ── N vs N-1 helpers ─────────────────────────────────────────────────
function getPairs(inspections){
  var groups={};
  (inspections||[]).forEach(function(ins){
    var key=ins.site+"||"+ins.categorie;
    if(!groups[key]) groups[key]=[];
    groups[key].push(ins);
  });
  var pairs=[];
  Object.values(groups).forEach(function(g){
    var sorted=g.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    if(sorted.length>=2) pairs.push({current:sorted[0],previous:sorted[1]});
  });
  return pairs.sort(function(a,b){
    return Math.abs(b.current.score-b.previous.score)-Math.abs(a.current.score-a.previous.score);
  });
}

function DeltaBadge({delta}){
  var col=delta>0?C.green:delta<0?C.red:C.amber;
  var icon=delta>0?"▲":delta<0?"▼":"→";
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:3,padding:"3px 8px",borderRadius:99,background:col+"18",border:"1px solid "+col+"33",color:col,fontWeight:800,fontSize:12}}>
      {icon} {delta>0?"+":""}{delta} pts
    </span>
  );
}

function ComparisonScreen({inspections,onBack}){
  const pairs=getPairs(inspections);

  const sites=[...new Set((inspections||[]).map(function(i){return i.site;}))];
  const filtered=filter==="Tout"?pairs:pairs.filter(function(p){return p.current.site===filter;});

  const improving=pairs.filter(function(p){return p.current.score>p.previous.score;}).length;
  const degrading=pairs.filter(function(p){return p.current.score<p.previous.score;}).length;
  const stable=pairs.filter(function(p){return p.current.score===p.previous.score;}).length;

  if(selected){
    const c=selected.current; const p=selected.previous;
    const delta=c.score-p.score;
    const col=delta>0?C.green:delta<0?C.red:C.amber;

      var pi=(p.items||[]).find(function(x){return x.id===ci.id;});
      return !ci.ok&&pi&&pi.ok;
    });
    const fixed=(c.items||[]).filter(function(ci){
      var pi=(p.items||[]).find(function(x){return x.id===ci.id;});
      return ci.ok&&pi&&!pi.ok;
    });

      <div style={{paddingBottom:88}}>
        <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>

            <div style={{fontSize:11,color:C.muted}}>📍 {c.site} · {catIcon(c.categorie)} {c.categorie}</div>
          </div>
        </div>
        <div style={{margin:"14px 14px 0",...S.card(col+"22")}}>
          <div style={{display:"flex",justifyContent:"space-around",alignItems:"center",marginBottom:14}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:4}}>PRÉCÉDENT · {fmt(p.date)}</div>
              <div style={{fontSize:38,fontWeight:900,color:scoreColor(p.score)}}>{p.score}<span style={{fontSize:14,color:C.muted}}>/100</span></div>
            </div>
            <div style={{textAlign:"center"}}>
              <DeltaBadge delta={delta}/>
              <div style={{fontSize:9,color:C.muted,marginTop:4}}>ÉVOLUTION</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:11,color:C.muted,marginBottom:4}}>ACTUEL · {fmt(c.date)}</div>
              <div style={{fontSize:38,fontWeight:900,color:scoreColor(c.score)}}>{c.score}<span style={{fontSize:14,color:C.muted}}>/100</span></div>
            </div>
          </div>
          <div style={{marginBottom:6}}>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>N-1</div>
            <div style={{background:C.dim,borderRadius:99,height:7,overflow:"hidden",marginBottom:6}}>
              <div style={{width:p.score+"%",height:"100%",background:scoreColor(p.score),borderRadius:99,opacity:.6}}/>
            </div>
            <div style={{fontSize:10,color:C.muted,marginBottom:3}}>Actuel</div>
            <div style={{background:C.dim,borderRadius:99,height:7,overflow:"hidden"}}>
              <div style={{width:c.score+"%",height:"100%",background:scoreColor(c.score),borderRadius:99}}/>
            </div>
          </div>
        </div>
        <div style={{margin:"12px 14px 0",display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div style={{...S.card(C.green+"33"),textAlign:"center"}}>
            <div style={{fontSize:26,fontWeight:900,color:C.green}}>{fixed.length}</div>
            <div style={{fontSize:11,color:C.green,marginTop:2}}>✓ NC résolues</div>
          </div>
          <div style={{...S.card(C.red+"33"),textAlign:"center"}}>
            <div style={{fontSize:26,fontWeight:900,color:C.red}}>{newNC.length}</div>
            <div style={{fontSize:11,color:C.red,marginTop:2}}>✗ Nouvelles NC</div>
          </div>
        </div>
        {fixed.length>0&&(
          <div style={{margin:"12px 14px 0",...S.card(C.green+"22")}}>
            <div style={{fontSize:13,fontWeight:800,color:C.green,marginBottom:8}}>✓ NC résolues depuis N-1</div>
            {fixed.map(function(it,i){return <div key={i} style={{fontSize:12,padding:"6px 0",borderBottom:"1px solid "+C.border,color:C.muted,textDecoration:"line-through"}}>{it.l}</div>;})}
          </div>
        )}
        {newNC.length>0&&(
          <div style={{margin:"12px 14px 0",...S.card(C.red+"22")}}>
            <div style={{fontSize:13,fontWeight:800,color:C.red,marginBottom:8}}>✗ Nouvelles NC</div>

    );

  return (
    <div style={{paddingBottom:88}}>
      <div style={{padding:"20px 16px 12px",display:"flex",gap:10,alignItems:"center"}}>
        <button onClick={onBack} style={{background:C.surface,border:"1px solid "+C.cyan+"44",borderRadius:10,padding:"8px 14px",color:C.cyan,cursor:"pointer",fontSize:13,fontWeight:700}}>← Retour</button>

          <div style={{fontSize:20,fontWeight:900}}>📊 N vs N-1</div>

        })}

      <div style={{padding:"0 14px 10px",display:"flex",gap:6,overflowX:"auto"}}>

                <div style={{textAlign:"center",flexShrink:0}}>
                  <div style={{fontSize:9,color:C.muted}}>N-1</div>
                  <div style={{fontSize:18,fontWeight:900,color:scoreColor(pair.previous.score),opacity:.7}}>{pair.previous.score}</div>
                </div>
                <div style={{flex:1,height:4,background:C.dim,borderRadius:99,overflow:"hidden"}}>
                  <div style={{width:pair.current.score+"%",height:"100%",background:col,borderRadius:99}}/>
                </div>
                <div style={{textAlign:"center",flexShrink:0}}>
                  <div style={{fontSize:9,color:C.muted}}>Actuel</div>
                  <div style={{fontSize:18,fontWeight:900,color:scoreColor(pair.current.score)}}>{pair.current.score}</div>
                </div>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted,marginTop:8}}>

                <span>{fmt(pair.current.date)}</span>
              </div>
            </div>
          );
        })}
      </div>
    </div>

// ── helpers section-level (global, used by both Detail & New) ──
function secNC(items,sec){ return items.filter(i=>i.s===sec&&!i.ok); }
function secPen(items,sec){ return secNC(items,sec).reduce((s,i)=>s+(PENALITE[i.poids||i.p]||0),0); }
function secScore(items,sec){ return calcScore(items.filter(i=>i.s===sec)); }

// ── Photo capture per question ──────────────────────────────────
function compressImage(dataUrl,maxW,quality,cb){
  maxW=maxW||800;quality=quality||0.6;
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    var canvas=document.createElement("canvas");
    canvas.width=w;canvas.height=h;
    var ctx=canvas.getContext("2d");
    ctx.drawImage(img,0,0,w,h);
    cb(canvas.toDataURL("image/jpeg",quality));
  };
  img.onerror=function(){cb(dataUrl);};
  img.src=dataUrl;
}

function PhotoBtn({photos=[], onAdd, onRemove}){
  const ref = React.useRef();
  const handleFile = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      compressImage(ev.target.result,800,0.6,function(compressed){onAdd(compressed);});
    };
    reader.readAsDataURL(file);
    e.target.value="";
  };
  return (
    <div style={{marginTop:8}}>
      {photos.length>0&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
          {photos.map((src,i)=>(
            <div key={i} style={{position:"relative",width:58,height:58}}>
              <img src={src} alt="" style={{width:58,height:58,borderRadius:8,objectFit:"cover",border:`1px solid ${C.border}`}}/>
              <button onClick={e=>{e.stopPropagation();onRemove(i);}} style={{position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:99,background:C.red,border:"none",color:"#fff",fontSize:9,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900}}>×</button>
            </div>
          ))}
        </div>
      )}
      <button onClick={e=>{e.stopPropagation();ref.current.click();}} style={{display:"flex",alignItems:"center",gap:5,background:`${C.cyan}12`,border:`1px dashed ${C.cyan}55`,borderRadius:8,padding:"5px 10px",color:C.cyan,fontSize:10,fontWeight:700,cursor:"pointer"}}>
        📷 {photos.length>0?`+ photo (${photos.length})`:"Ajouter une photo"}
      </button>
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}} onChange={handleFile}/>
    </div>
  );
}

      </div>
    </div>
  );
}

function QuickVisitScreen({user, onSave, onBack, sitesState}){
  const cats=CATEGORIES;
  const siteOpts=(sitesState&&sitesState.length>0)?sitesState:SITES;
  const [form,setForm]=useState({site:siteOpts[0]||SITES[0],cat:cats[0]});
  const critItems=CHECKLISTS[form.cat]?CHECKLISTS[form.cat].filter(function(q){return q.p==="critique";}):[];
  const [idx,setIdx]=useState(0);
  const [answers,setAnswers]=useState({});

  const answer=function(val){
    var newA={...answers};
    newA[critItems[idx].id]=val;
    setAnswers(newA);
    if(idx<critItems.length-1){ setIdx(idx+1); return; }
    var allItems=CHECKLISTS[form.cat].map(function(q){
      var ans=newA[q.id];
      var isNA=ans==="na";
      var isOk=isNA?true:(ans!==undefined?ans:true);
      return {...q,poids:q.p,ok:isOk,na:isNA,comment:isNA?"N/A":"",photos:[]};
    });
    var score=calcScore(allItems);
    var ins={
      id:Date.now(),titre:"Visite rapide — "+form.cat,site:form.site,
      categorie:form.cat,inspecteur:user.nom,
      date:new Date().toISOString().split("T")[0],
      statut:"En cours",items:allItems,notes:"",
      score:score,nc:allItems.filter(function(i){return !i.ok&&!i.na;}).length,
    };
    onSave(ins);
  };

  if(idx<critItems.length){
    const q=critItems[idx];
    return (
      <div style={{paddingBottom:80}}>
        <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
          <button onClick={onBack} style={{background:C.surface,border:"1px solid "+C.cyan+"44",borderRadius:10,padding:"8px 14px",color:C.cyan,cursor:"pointer",fontSize:13,fontWeight:700}}>← Retour</button>
          <div style={{flex:1}}><div style={{fontSize:18,fontWeight:900}}>⚡ Visite rapide</div><div style={{fontSize:11,color:C.muted}}>{form.cat} · question {idx+1}/{critItems.length}</div></div>
        </div>
        <div style={{margin:"14px 14px 0",background:C.surface,borderRadius:12,overflow:"hidden"}}>
          <div style={{height:4,background:C.dim}}><div style={{height:"100%",width:(((idx)/critItems.length)*100)+"%",background:C.cyan,transition:"width .3s"}}/></div>
        </div>
        <div style={{margin:"14px 14px 0",...S.card(),padding:24}}>
          <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:8}}>POINT CRITIQUE · {q.s}</div>
          <div style={{fontSize:16,fontWeight:700,lineHeight:1.5,marginBottom:24}}>{q.l}</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={function(){answer(true);}} style={{...S.btn(C.green),flex:1,fontSize:15,padding:"12px 6px"}}>✅ Conforme</button>
            <button onClick={function(){answer(false);}} style={{...S.btn(C.red,true),flex:1,fontSize:15,padding:"12px 6px"}}>❌ NC</button>
            <button onClick={function(){answer("na");}} style={{...S.btn(C.muted,true),flex:1,fontSize:15,padding:"12px 6px",opacity:0.8}}>➖ N/A</button>
          </div>
        </div>
        <div style={{margin:"12px 14px 0",...S.card(),padding:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:10,color:C.muted,letterSpacing:1}}>SITE</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {siteOpts.map(function(s){return (
              <button key={s} onClick={function(){setForm({...form,site:s});}} style={{padding:"10px 14px",borderRadius:10,border:"1px solid",borderColor:form.site===s?C.cyan:C.border,background:form.site===s?C.cyan+"18":"transparent",color:form.site===s?C.cyan:C.text,fontSize:13,fontWeight:form.site===s?800:400,cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                {form.site===s&&<span style={{color:C.cyan,fontSize:12}}>✓</span>}
                {s}
              </button>
            );})}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{padding:"40px 20px",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Visite terminée !</div>
      <div style={{fontSize:13,color:C.muted}}>Sauvegarde en cours...</div>
    </div>
  );
}

function NewInspectionScreen({user,onSave,onBack,resps,sitesState,customTemplates,onSaveTemplate,siteAddresses}){
  const respList=(resps&&resps.length?resps:RESPONSABLES).map(function(r){return typeof r==="object"?r.nom:r;});
  const siteOpts=(sitesState&&sitesState.length>0)?sitesState:SITES;
  const [step,setStep]=useState(1);
  const [form,setForm]=useState({titre:"",site:siteOpts[0]||SITES[0],categorie:CATEGORIES[0],notes:"",accompagnateurs:[],adresse:(siteAddresses&&siteAddresses[siteOpts[0]])||"",date:new Date().toISOString().split("T")[0],sitePhoto:null});
  const [items,setItems]=useState([]);
  const [openSec,setOpenSec]=useState(null);

  const next=()=>{
    if(step===1){
      var tpl=(customTemplates&&customTemplates[form.categorie])||CHECKLISTS[form.categorie]||[];
      setItems(tpl.map(function(q){return {...q,poids:q.p||q.poids||'mineur',ok:true,comment:"",photos:[]};}));
      setOpenSec(null); setStep(2);
    } else setStep(3);
  };
  const toggle=(id)=>setItems(p=>p.map(i=>i.id===id?{...i,ok:!i.ok}:i));
  const setComment=(id,v)=>setItems(p=>p.map(i=>i.id===id?{...i,comment:v}:i));
  const addPhoto=(id,src)=>setItems(p=>p.map(i=>i.id===id?{...i,photos:[...(i.photos||[]),src]}:i));
  const removePhoto=(id,idx)=>setItems(p=>p.map(i=>i.id===id?{...i,photos:(i.photos||[]).filter((_,j)=>j!==idx)}:i));

  const score=calcScore(items);
  const ncItems=items.filter(i=>!i.ok);
  const penTotal=ncItems.reduce((s,i)=>s+(PENALITE[i.poids||i.p]||0),0);
  const sections=[...new Set(items.map(i=>i.s))];
  const totalPhotos=items.reduce((s,i)=>s+((i.photos&&i.photos.length)||0),0);

  const save=()=>{
    const d=new Date(); const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    onSave({id:Date.now(),...form,score,nc:ncItems.length,statut:"En cours",date:form.date||ds,inspecteur:user.nom,items,accompagnateurs:form.accompagnateurs||[]});
  };

  const qCrit=(CHECKLISTS[form.categorie]&&CHECKLISTS[form.categorie].filter(q=>q.p==="critique").length)||0||0;
  const qElev=(CHECKLISTS[form.categorie]&&CHECKLISTS[form.categorie].filter(q=>q.p==="eleve").length)||0||0;
  const qMin=(CHECKLISTS[form.categorie]&&CHECKLISTS[form.categorie].filter(q=>q.p==="mineur").length)||0||0;
  const maxPen=qCrit*PENALITE.critique+qElev*PENALITE.eleve+qMin*PENALITE.mineur;

  const StepDot=({n})=><div style={{width:28,height:28,borderRadius:99,background:step>=n?C.cyan:C.dim,color:step>=n?"#000":C.muted,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900}}>{n}</div>;

  return (
    <div style={{paddingBottom:100}}>
      <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
        <button onClick={onBack} style={{background:C.surface,border:`1px solid ${C.cyan}44`,borderRadius:10,padding:"8px 14px",color:C.cyan,cursor:"pointer",flexShrink:0,fontSize:13,fontWeight:700}}>← Retour</button>
        <div style={{fontSize:16,fontWeight:800}}>Nouvelle inspection</div>
      </div>
      <div style={{padding:"14px 20px 0",display:"flex",alignItems:"center"}}><StepDot n={1}/><div style={{flex:1,height:2,background:step>=2?C.cyan:C.dim}}/><StepDot n={2}/><div style={{flex:1,height:2,background:step>=3?C.cyan:C.dim}}/><StepDot n={3}/></div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"5px 14px 14px",fontSize:10,color:C.muted}}><span>Informations</span><span>Checklist</span><span>Résumé</span></div>

      {step===1&&(
        <div style={{padding:"0 14px"}}>
          <div style={{...S.card(),marginBottom:14}}>
            <label style={S.label}>Titre</label>
            <input style={{...S.input,marginBottom:14}} placeholder="Ex : Audit incendie — Bloc B" value={form.titre} onChange={e=>setForm({...form,titre:e.target.value})}/>
            <label style={S.label}>Date</label>
            <input type="date" style={{...S.input,marginBottom:14}} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
            <label style={S.label}>Site</label>
            <select style={{...S.input,marginBottom:14}} value={form.site} onChange={function(e){setForm({...form,site:e.target.value,adresse:(siteAddresses&&siteAddresses[e.target.value])||""});}}>{siteOpts.map(function(s){return <option key={s} value={s}>{s}</option>;})}</select>
            <label style={S.label}>Adresse</label>
            <div style={{...S.input,marginBottom:14,background:C.surface,color:C.muted,fontSize:12,padding:"10px 14px",minHeight:36}}>
              {(siteAddresses&&siteAddresses[form.site])||<span style={{color:C.border,fontStyle:"italic"}}>Aucune adresse configurée pour ce site</span>}
            </div>
            <label style={S.label}>Catégorie</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
              {CATEGORIES.map(function(c){
                var m=CAT_META[c];
                var active=form.categorie===c;
                return (
                  <button key={c} onClick={function(){setForm({...form,categorie:c});}} style={{padding:"10px 8px",borderRadius:12,border:"1px solid",borderColor:active?C.cyan:C.border,background:active?C.cyan+"18":"transparent",color:active?C.cyan:C.muted,fontSize:12,fontWeight:active?800:500,cursor:"pointer",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>

            </div>

            <label style={S.label}>Accompagnateurs</label>

              {["SEPP","CPMT","Délégation syndicale","Responsable","Direction"].map(function(a){

            <label style={S.label}>Notes préliminaires</label>

            <label style={S.label}>Photo du site</label>
            <div style={{marginBottom:14}}>
              {form.sitePhoto?(
                <div style={{position:"relative",borderRadius:12,overflow:"hidden",border:"1px solid "+C.border}}>
                  <img src={form.sitePhoto} style={{width:"100%",maxHeight:200,objectFit:"cover",display:"block"}}/>
                  <button onClick={function(){setForm({...form,sitePhoto:null});}} style={{position:"absolute",top:8,right:8,width:28,height:28,borderRadius:99,background:"rgba(0,0,0,0.7)",border:"none",color:"#fff",cursor:"pointer",fontSize:14,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>

// RAPPELS SCREEN
// ═══════════════════════════════════════════════════════════════════════
function RappelsScreen({actions,resps,config,onConfigUpdate,onBack}){
  var delai=(config&&config.rappelDelai)||7;
  const [editDelai,setEditDelai]=useState(false);
  const [tempDelai,setTempDelai]=useState(delai);
  const [dismissed,setDismissed]=useState(function(){try{var d=localStorage.getItem("secura_rappels_sent");return d?JSON.parse(d):{};}catch(e){return {};}});
  function saveDismissed(newD){setDismissed(newD);try{localStorage.setItem("secura_rappels_sent",JSON.stringify(newD));}catch(e){}}
  function getEmail(nom){var r=(resps||[]).find(function(r){return typeof r==="object"&&r.nom===nom;});return r&&r.email?r.email:"";}
  function parseDateLocal(d){if(!d)return new Date();var p=d.split("-");var dt=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));dt.setHours(0,0,0,0);return dt;}  var today=new Date();today.setHours(0,0,0,0);
  var activeIds=actions.filter(function(a){return a.statut!=="Clôturée";}).map(function(a){return String(a.id);});
  var cleanDismissed={};Object.keys(dismissed).forEach(function(k){if(activeIds.indexOf(k)!==-1)cleanDismissed[k]=true;});
  var alertes=actions.filter(function(a){
    if(a.statut==="Clôturée"||!a.resp||!a.echeance)return false;
    if(cleanDismissed[String(a.id)])return false;
    return Math.ceil((parseDateLocal(a.echeance)-today)/86400000)<=delai;
  });
  var sansResp=actions.filter(function(a){
    if(a.statut==="Clôturée")return false;
    if(!a.resp||a.resp===""||a.resp==="Assigner un responsable")return true;
    return false;
  });
  var sansEcheance=actions.filter(function(a){
    return a.statut!=="Clôturée"&&a.resp&&a.resp!==""&&!a.echeance;
  });
  var byResp={};
  alertes.forEach(function(a){if(!byResp[a.resp])byResp[a.resp]={resp:a.resp,email:getEmail(a.resp),actions:[]};byResp[a.resp].actions.push(a);});
  var groups=Object.values(byResp).sort(function(a,b){return a.resp.localeCompare(b.resp);});
  function buildMailto(group){
    var d=new Date().toLocaleDateString("fr-BE",{day:"2-digit",month:"2-digit",year:"numeric"});
    var subject="SECURA - Rappel actions correctives - "+d;
    var lines=["Bonjour "+group.resp.split(" ")[0]+",","","Rappel des actions correctives qui vous sont attribuées :",""];
    group.actions.forEach(function(a,i){
      var dl=Math.ceil((parseDateLocal(a.echeance)-today)/86400000);
      var st=dl<0?"EN RETARD DE "+Math.abs(dl)+" JOUR(S)":dl===0?"AUJOURD'HUI":"Dans "+dl+" jour(s) ("+a.echeance+")";
      lines.push((i+1)+". "+a.label);lines.push("   Site: "+a.site+" | Priorité: "+a.prio+" | "+st);lines.push("");
    });
    lines.push("Merci de traiter ces actions dans les délais impartis.");lines.push("");lines.push("Cordialement,");lines.push("L'équipe Prévention & Sécurité [SECURA]");
    return "mailto:"+group.email+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(lines.join(String.fromCharCode(10)));
  }
  function send(group){
    var newD=Object.assign({},cleanDismissed);
    group.actions.forEach(function(a){newD[String(a.id)]=true;});
    saveDismissed(newD);
    setTimeout(function(){window.open(buildMailto(group),"_self");},300);
  }
  function dismissOne(a){var newD=Object.assign({},cleanDismissed);newD[String(a.id)]=true;saveDismissed(newD);}
  return (
    <div style={{paddingBottom:88}}>
      <div style={{padding:"20px 16px 12px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={onBack} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"8px 12px",color:C.cyan,cursor:"pointer",fontSize:13,fontWeight:700}}>← Retour</button>
        <div style={{flex:1}}><div style={{fontSize:18,fontWeight:900}}>📧 Rappels</div><div style={{fontSize:11,color:C.muted}}>Envoi aux responsables par email</div></div>
        {Object.keys(dismissed).length>0&&<button onClick={function(){saveDismissed({});}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:10,padding:"6px 10px",color:C.muted,cursor:"pointer",fontSize:10,fontWeight:700}}>🔄 Reset</button>}
      </div>
      <div style={{margin:"0 14px 14px",...S.card(C.cyan+"22")}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontSize:13,fontWeight:700}}>⏰ Délai de rappel</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>Actions dont l&#39;échéance est dans ≤ {delai} jour(s)</div></div>
          {!editDelai?(
            <button onClick={function(){setEditDelai(true);setTempDelai(delai);}} style={{...S.btn(C.cyan,true),width:"auto",padding:"6px 14px",fontSize:12}}>{delai}j ✏️</button>
          ):(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="number" min="1" max="90" value={tempDelai} onChange={function(e){setTempDelai(parseInt(e.target.value)||1);}} style={{...S.input,width:60,textAlign:"center",padding:"6px 8px",fontSize:14,fontWeight:800}}/>
              <button onClick={function(){onConfigUpdate&&onConfigUpdate(Object.assign({},config,{rappelDelai:tempDelai}));setEditDelai(false);}} style={{...S.btn(C.green),width:"auto",padding:"6px 14px",fontSize:12}}>✓</button>
              <button onClick={function(){setEditDelai(false);}} style={{...S.btn(C.muted,true),width:"auto",padding:"6px 10px",fontSize:12}}>✕</button>
            </div>
          )}
        </div>
      </div>
      {sansResp.length>0&&(
        <div style={{margin:"0 14px 10px",padding:"10px 14px",background:C.orange+"12",border:"1px solid "+C.orange+"33",borderRadius:12,display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:18}}>⚠️</span>
          <div><div style={{fontSize:12,fontWeight:700,color:C.orange}}>{sansResp.length} action(s) sans responsable</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>Assignez un responsable dans Actions pour les inclure dans les rappels</div></div>
        </div>
      )}
      {groups.length===0&&<div style={{textAlign:"center",padding:"50px 20px",color:C.muted}}><div style={{fontSize:36,marginBottom:12}}>✅</div><div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Aucun rappel nécessaire</div><div style={{fontSize:12,marginBottom:16}}>Aucune action n&#39;arrive à échéance dans les {delai} prochains jours.</div>{Object.keys(dismissed).length>0&&<button onClick={function(){saveDismissed({});}} style={{...S.btn(C.muted,true),width:"auto",padding:"8px 16px",fontSize:11,margin:"0 auto"}}>🔄 Réafficher les rappels envoyés</button>}</div>}
      <div style={{padding:"0 14px"}}>
        {groups.map(function(group,gi){
          var hasEmail=!!group.email;
          var retard=group.actions.filter(function(a){return Math.ceil((parseDateLocal(a.echeance)-today)/86400000)<0;}).length;
          var critique=group.actions.filter(function(a){return a.prio==="CRITIQUE";}).length;
          var initials=(group.resp||"?").split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase();
          return (
            <div key={gi} style={{...S.card(),marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,paddingBottom:12,borderBottom:"1px solid "+C.border}}>
                <div style={{width:44,height:44,borderRadius:13,background:C.cyan+"18",border:"1px solid "+C.cyan+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:C.cyan,flexShrink:0}}>{initials}</div>
                <div style={{flex:1,minWidth:0}}><div style={{fontSize:14,fontWeight:800}}>{group.resp}</div><div style={{fontSize:11,color:hasEmail?C.muted:C.red,marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{hasEmail?group.email:"⚠ Email manquant — configurer dans Paramètres"}</div></div>
                <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:20,fontWeight:900,color:C.cyan}}>{group.actions.length}</div><div style={{fontSize:9,color:C.muted}}>action(s)</div></div>
              </div>
              {(retard>0||critique>0)&&<div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                {retard>0&&<span style={{fontSize:10,padding:"3px 9px",borderRadius:6,background:C.red+"18",color:C.red,fontWeight:700}}>⚠ {retard} en retard</span>}
                {critique>0&&<span style={{fontSize:10,padding:"3px 9px",borderRadius:6,background:C.orange+"18",color:C.orange,fontWeight:700}}>🔴 {critique} critique{critique>1?"s":""}</span>}
              </div>}
              {group.actions.map(function(a,ai){
                var col=a.prio==="CRITIQUE"?C.red:a.prio==="ÉLEVÉE"?C.orange:C.amber;
                var dl=Math.ceil((parseDateLocal(a.echeance)-today)/86400000);
                var dlCol=dl<0?C.red:dl<=3?C.orange:C.muted;
                var dlTxt=dl<0?"⚠ "+Math.abs(dl)+"j retard":dl===0?"Aujourd'hui":"+"+dl+"j";
                return (<div key={ai} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:ai<group.actions.length-1?"1px solid "+C.dim:"none",alignItems:"flex-start"}}>
                  <div style={{width:6,height:6,borderRadius:99,background:col,marginTop:5,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:600,lineHeight:1.3,marginBottom:3}}>{a.label}</div>
                    <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                      <span style={{fontSize:9,padding:"1px 6px",borderRadius:5,background:col+"18",color:col,fontWeight:800}}>{a.prio}</span>
                      <span style={{fontSize:10,color:C.muted}}>📍 {a.site}</span>
                      <span style={{fontSize:10,color:dlCol,fontWeight:dl<0?800:400}}>{dlTxt}</span>
                    </div>
                  </div>
                  <button onClick={function(){dismissOne(a);}} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:8,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:C.muted,fontSize:13,flexShrink:0}}>✕</button>
                </div>);
              })}
              <button onClick={function(){send(group);}} disabled={!hasEmail}
                style={{marginTop:14,width:"100%",padding:"13px",borderRadius:12,background:hasEmail?"linear-gradient(135deg,"+C.cyan+","+C.cyan+"BB)":C.dim,border:"none",color:hasEmail?"#000":C.muted,fontWeight:800,fontSize:13,cursor:hasEmail?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                <span>📧</span>Envoyer rappel à {group.resp.split(" ")[0]}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function PermissionsScreen({config,onConfigUpdate,onBack}){
  var perms=config&&config.permissions?config.permissions:{
    Inspecteur:{dashboard:true,inspections:true,actions:true,rapports:false,rappels:false,settings:false,ia:false,accidents:false},
    Responsable:{dashboard:true,inspections:false,actions:true,rapports:false,rappels:false,settings:false,ia:false,accidents:false}
  };
  var features=[{k:"dashboard",l:"Tableau de bord",icon:"🏠"},{k:"inspections",l:"Audits",icon:"📋"},{k:"actions",l:"Actions",icon:"⚡"},{k:"rapports",l:"Rapports",icon:"📄"},{k:"rappels",l:"Rappels email",icon:"📧"},{k:"ia",l:"Assistant IA",icon:"🤖"},{k:"accidents",l:"Accidentologie",icon:"🩹"},{k:"settings",l:"Profil & Paramètres",icon:"👤"}];
  var roles=["Inspecteur","Responsable"];
  function toggle(role,feature){var newP=JSON.parse(JSON.stringify(perms));if(!newP[role])newP[role]={};newP[role][feature]=!newP[role][feature];onConfigUpdate(Object.assign({},config,{permissions:newP}));}
  return (

        <div style={{fontSize:15,fontWeight:800,marginBottom:4}}>🔐 Permissions par rôle</div>
        <div style={{fontSize:11,color:C.muted}}>L&#39;Admin a toujours accès à tout</div>
      </div>
      {roles.map(function(role,ri){
        var rolePerms=perms[role]||{};
        var roleCol=role==="Inspecteur"?C.cyan:C.purple;
        return (
          <div key={ri} style={{...S.card(),marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,paddingBottom:12,borderBottom:"1px solid "+C.border}}>
              <div style={{width:38,height:38,borderRadius:11,background:roleCol+"18",border:"1px solid "+roleCol+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{role==="Inspecteur"?"🔍":"👤"}</div>

            </div>
            {features.map(function(f,fi){
              var active=!!rolePerms[f.k];
              return (
                <div key={fi} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:fi<features.length-1?"1px solid "+C.dim:"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:16,width:24,textAlign:"center"}}>{f.icon}</span>
                    <span style={{fontSize:13,fontWeight:active?700:400,color:active?C.text:C.muted}}>{f.l}</span>
                  </div>
                  <button onClick={function(){toggle(role,f.k);}} style={{width:46,height:26,borderRadius:99,background:active?roleCol:C.border,border:"none",cursor:"pointer",transition:"background .2s",position:"relative",flexShrink:0}}>
                    <div style={{position:"absolute",top:3,left:active?22:3,width:20,height:20,borderRadius:99,background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.3)"}}/>
                  </button>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}
function ActionsScreen({actions,onUpdate,resps,config,onConfigUpdate,user}){
  const respList=(resps&&resps.length?resps:RESPONSABLES).map(function(r){return typeof r==="object"?r.nom:r;});
  const [editRespId,setEditRespId]=useState(null);
  const [showRappels,setShowRappels]=useState(false);
  const [siteFilter,setSiteFilter]=useState("Tous");
  if(showRappels) return <RappelsScreen actions={actions} resps={resps} config={config} onConfigUpdate={onConfigUpdate} onBack={function(){setShowRappels(false);}} />;
  var siteList=[];actions.forEach(function(a){if(a.site&&siteList.indexOf(a.site)===-1)siteList.push(a.site);});
  const sorted=[...actions].filter(function(a){return a.statut==="En cours";}).sort((a,b)=>{
    if(a.echeance&&b.echeance) return a.echeance.localeCompare(b.echeance);
    if(a.echeance) return -1; if(b.echeance) return 1; return 0;
  });
  const filtered=siteFilter==="Tous"?sorted:sorted.filter(function(a){return a.site===siteFilter;});
  const cycle=(a)=>{ onUpdate({...a,statut:a.statut==="Clôturée"?"En cours":"Clôturée"}); };
  const colPrio=(p)=>p==="CRITIQUE"?C.red:p==="ÉLEVÉE"?C.orange:C.amber;
  const daysLeft=(echeance)=>{
    if(!echeance) return null;
    const diff=Math.ceil((new Date(echeance)-new Date())/(1000*60*60*24));
    return isNaN(diff)?null:diff;
  };
  return (
    <div style={{paddingBottom:88}}>
      <div style={{padding:"20px 16px 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:20,fontWeight:900}}>Actions urgentes</div><div style={{fontSize:12,color:C.muted,marginTop:2}}>{actions.filter(a=>a.statut!=="Clôturée").length} en cours</div></div>
        {hasAccess(user,config,"rappels")&&<button onClick={function(){setShowRappels(true);}} style={{background:"linear-gradient(135deg,"+C.cyan+",#007799)",border:"none",borderRadius:14,padding:"10px 16px",color:"#000",fontWeight:900,fontSize:13,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",gap:7,boxShadow:"0 0 16px "+C.cyan+"55"}}><span style={{fontSize:18}}>📧</span><span>Rappels</span></button>}
      </div>
      <div style={{padding:"0 14px 12px",display:"flex",gap:8,alignItems:"center"}}>
        <span style={{fontSize:11,color:C.muted,flexShrink:0}}>📍 Site :</span>
        <select value={siteFilter} onChange={function(e){setSiteFilter(e.target.value);}} style={{...S.input,flex:1,padding:"7px 12px",fontSize:12,borderRadius:10}}>
          <option value="Tous">Tous les sites</option>
          {siteList.map(function(s){return <option key={s} value={s}>{s}</option>;})}
        </select>
      </div>
      <div style={{padding:"0 14px"}}>
        {filtered.map((a,i)=>{
          const col=colPrio(a.prio);
          const dl=daysLeft(a.echeance);
          const urgency=dl===null?"ok":dl<0?"retard":dl<=3?"urgent":dl<=14?"proche":"ok";
          const urgCol={retard:C.red,urgent:C.red,proche:C.amber,ok:C.green}[urgency];
          return (
            <div key={a.id} style={{...S.card(urgency==="retard"?C.red+"33":urgency==="urgent"?C.red+"22":C.border),marginBottom:10}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                <div style={{width:30,height:30,borderRadius:8,background:col+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900,color:col,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700}}>{a.label}</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>📍 {a.site}</div>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                    {editRespId===a.id?(
                      <select
                        value={a.resp||""}
                        onChange={e=>{onUpdate({...a,resp:e.target.value});setEditRespId(null);}}
                        style={{...S.input,fontSize:11,padding:"4px 8px",flex:1}}
                        onBlur={()=>setEditRespId(null)}
                        autoFocus
                      >
                        <option value="">— Non assigné —</option>
                        {respList.map(function(r,i){var n=typeof r==="object"?r.nom:r; return <option key={i} value={n}>{n}</option>;})}
                      </select>
                    ):(
                      <button onClick={()=>setEditRespId(a.id)} style={{background:"transparent",border:"1px dashed "+C.border,borderRadius:6,padding:"3px 8px",color:a.resp?C.cyan:C.muted,fontSize:11,cursor:"pointer"}}>
                        👤 {a.resp||"Assigner un responsable"}
                      </button>
                    )}
                  </div>
                </div>
                {dl!==null&&(
                  <div style={{textAlign:"center",padding:"4px 8px",borderRadius:8,background:urgCol+"18",border:"1px solid "+urgCol+"44",flexShrink:0}}>
                    <div style={{fontSize:15,fontWeight:900,color:urgCol,lineHeight:1}}>{dl<0?Math.abs(dl)+"j":dl===0?"Auj":dl+"j"}</div>
                    <div style={{fontSize:9,color:urgCol}}>{dl<0?"retard":dl===0?"auj.":"restants"}</div>
                  </div>
                )}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <Tag label={a.prio} color={col}/>
                  <span style={{fontSize:10,color:C.muted}}>{fmt(a.echeance)}</span>
                </div>
                <button onClick={()=>cycle(a)} style={{...S.btn(a.statut==="Clôturée"?C.green:C.cyan,true),width:"auto",padding:"5px 12px",fontSize:11}}>
                  {a.statut==="Clôturée"?"✓ Clôturée":"→ Clôturer"}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SignaturePad({onSave, label}){
  const ref=useRef(null);
  const drawingRef=useRef(false);
  const [hasLine,setHasLine]=useState(false);

  const getPos=(e,canvas)=>{
    const r=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    const zoom=r.width/canvas.offsetWidth;
    const x=((src.clientX-r.left)/zoom)*(canvas.width/canvas.offsetWidth);
    const y=((src.clientY-r.top)/zoom)*(canvas.height/canvas.offsetHeight);
    return {x:x,y:y};
  };

  // Use useEffect to attach NON-PASSIVE touch listeners directly on the canvas
  // This is the only reliable way to call preventDefault() on iOS Safari
  React.useEffect(()=>{
    const canvas=ref.current;
    if(!canvas) return;

    const onTouchStart=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const ctx=canvas.getContext("2d");
      const p=getPos(e,canvas);
      ctx.beginPath(); ctx.moveTo(p.x,p.y);
      drawingRef.current=true;
      setHasLine(true);
    };
    const onTouchMove=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      if(!drawingRef.current) return;
      const ctx=canvas.getContext("2d");
      const p=getPos(e,canvas);
      ctx.lineTo(p.x,p.y);
      ctx.strokeStyle="#00E5FF"; ctx.lineWidth=2.5; ctx.lineCap="round";
      ctx.stroke();
    };
    const onTouchEnd=(e)=>{
      e.preventDefault();
      drawingRef.current=false;
    };

    canvas.addEventListener("touchstart", onTouchStart, {passive:false});
    canvas.addEventListener("touchmove",  onTouchMove,  {passive:false});
    canvas.addEventListener("touchend",   onTouchEnd,   {passive:false});
    return ()=>{
      canvas.removeEventListener("touchstart", onTouchStart);
      canvas.removeEventListener("touchmove",  onTouchMove);
      canvas.removeEventListener("touchend",   onTouchEnd);
    };
  },[]);

  // Mouse handlers for desktop
  const mouseStart=(e)=>{
    const c=ref.current; const ctx=c.getContext("2d");
    const p=getPos(e,c);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    drawingRef.current=true; setHasLine(true);
  };
  const mouseMove=(e)=>{
    if(!drawingRef.current) return;
    const c=ref.current; const ctx=c.getContext("2d");
    const p=getPos(e,c);
    ctx.lineTo(p.x,p.y);
    ctx.strokeStyle="#00E5FF"; ctx.lineWidth=2.5; ctx.lineCap="round";
    ctx.stroke();
  };
  const mouseEnd=()=>{ drawingRef.current=false; };

  const clear=()=>{
    const c=ref.current; const ctx=c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height); setHasLine(false);
  };
  const save=()=>{
    if(!hasLine) return;
    onSave(ref.current.toDataURL());
  };

  return (
    <div style={{marginBottom:16}}>
      <div style={{fontSize:11,color:C.muted,letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>{label}</div>
      <div style={{background:C.surface,borderRadius:10,border:"2px dashed "+C.border,overflow:"hidden"}}>
        <canvas ref={ref} width={340} height={140}
          style={{display:"block",width:"100%",touchAction:"none",cursor:"crosshair"}}
          onMouseDown={mouseStart}
          onMouseMove={mouseMove}
          onMouseUp={mouseEnd}
          onMouseLeave={mouseEnd}
        />
      </div>
      {!hasLine&&<div style={{fontSize:10,color:C.muted,textAlign:"center",marginTop:4}}>✍️ Signez dans le cadre ci-dessus</div>}
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <button onClick={clear} style={{...S.btn(C.muted,true),flex:1,padding:"8px",fontSize:12}}>Effacer</button>
        <button onClick={save} disabled={!hasLine} style={{...S.btn(C.cyan),flex:2,padding:"8px",fontSize:12,opacity:hasLine?1:.4}}>✓ Confirmer</button>
      </div>
    </div>
  );
}

          var actRows=actItems.map(function(it,idx){
            var p=it.poids||it.p||"mineur";
            var col=p==="critique"?"#FF1744":p==="eleve"?"#FF6D00":"#FFB300";
            var resp=it.resp||"Non assigné";
            var echeance=it.comment||"—";
            return "<tr><td>"+(idx+1)+"</td><td>"+it.l+"</td><td style='color:"+col+";font-weight:700'>"+poidsLabel(p)+"</td><td style='font-weight:700'>"+resp+"</td><td>"+echeance+"</td></tr>";
          }).join("");
          return "<h2 class='actions'>Recapitulatif des actions correctives ("+actItems.length+")</h2><table class='act-table'><tr><th>#</th><th>Action</th><th>Criticite</th><th>Responsable</th><th>Remarques</th></tr>"+actRows+"</table>";
        })()
        +"<div class='footer'><div class='footer-left'><div class='footer-brand'>"+appName+"</div><div>Rapport genere le "+new Date().toLocaleDateString("fr-BE",{day:"2-digit",month:"long",year:"numeric"})+"</div></div><div class='footer-right'><div>Document confidentiel</div><div>"+refNum+"</div></div></div>"

  return (

              w.document.close();

        <div style={{fontSize:20,fontWeight:900}}>Rapports</div>
