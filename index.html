const supa = {
  async get(table, opts){
    let url = SUPA_URL+"/rest/v1/"+table+"?select=*";
    if(opts&&opts.eq) url += "&"+opts.eq.col+"=eq."+opts.eq.val;
    if(opts&&opts.order) url += "&order="+opts.order;
    const r = await fetch(url,{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}});
    return r.json();
  },
  async upsert(table, data){
    const r = await fetch(SUPA_URL+"/rest/v1/"+table,{
      method:"POST",
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify(data)
    });
    return r.ok;
  },
  async del(table, id){
    const r = await fetch(SUPA_URL+"/rest/v1/"+table+"?id=eq."+String(id),{
      method:"DELETE",
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"}
    });
    if(!r.ok){ console.error("DEL failed",table,id,r.status); }
    return r.ok;
  },
  async patch(table, id, data){
    const r = await fetch(SUPA_URL+"/rest/v1/"+table+"?id=eq."+id,{
      method:"PATCH",
      headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify(data)
    });
    return r.ok;
  }
};

const LS = {
  save: function(key, data){
    try{ localStorage.setItem("secura_"+key, JSON.stringify(data)); }catch(e){}
  },
  load: function(key){
    try{ var d=localStorage.getItem("secura_"+key); return d?JSON.parse(d):null; }catch(e){ return null; }
  },
  addPending: function(type, data){
    try{
      var pending=LS.load("pending")||[];
      pending.push({type:type,data:data,ts:Date.now()});
      LS.save("pending", pending);
    }catch(e){}
  },
  getPending: function(){ return LS.load("pending")||[]; },
  clearPending: function(){ try{ localStorage.removeItem("secura_pending"); }catch(e){} }
};

// SCORING SYSTEM — Pénalités
// Départ : 100 pts
// NC Critique  → −10 pts
// NC Élevé     → −5  pts
// NC Mineur    → −1  pt
// Score final = max(0, 100 − Σ pénalités NC)
// ═══════════════════════════════════════════════════════════════════════
let PENALITE = { critique:5, eleve:3, mineur:1 };
let DELAIS    = { critique:0, eleve:60, mineur:120 };
function deadlineFromNow(poids){
  const days=DELAIS[poids]||120;
  if(days===0) return new Date().toISOString().split("T")[0]; // immédiat
  const d=new Date(); d.setDate(d.getDate()+days);
  return d.toISOString().split("T")[0];
}
function delaiLabel(poids){
  return poids==="critique"?"Sans délai (immédiat)":poids==="eleve"?"≤ 2 mois":"≤ 4 mois";
}

function calcScore(items){
  if(!items||!items.length) return 100;
  const pen = items.filter(i=>!i.ok).reduce((s,i)=>s+(PENALITE[i.poids||i.p]||0),0);
  return Math.max(0, 100 - pen);
}
function scoreColor(s){ if(s===null||s===undefined||isNaN(s)) return C.muted; return s>=80?C.green:s>=55?C.amber:C.red; }
function poidsColor(p){ if(!p) return C.muted; return p==="critique"?C.red:p==="eleve"?C.orange:C.amber; }
function poidsLabel(p){ return p==="critique"?"CRITIQUE":p==="eleve"?"ÉLEVÉ":"MINEUR"; }
function poidsPen(p){ const v=PENALITE[p]||0; return `-${v}pt${v>1?"s":""}`; }
function fmt(d){ if(!d)return""; const p=d.split("-"); return `${p[2]}/${p[1]}/${p[0]}`; }

function Bar({v,col,h=5}){
  return <div style={{background:C.dim,borderRadius:99,height:h,overflow:"hidden"}}>
    <div style={{width:`${Math.max(0,Math.min(100,v))}%`,height:"100%",background:col,borderRadius:99,boxShadow:`0 0 4px ${col}55`,transition:"width .7s ease"}}/>
  </div>;
}
function Tag({label,color,small}){
  return <span style={{fontSize:small?9:10,padding:small?"2px 6px":"3px 9px",borderRadius:6,background:`${color}20`,color,fontWeight:800}}>{label}</span>;
}
function StatutBadge({s}){
  const M={"À valider":{bg:C.amber,text:"#000"},"En cours":{bg:`${C.cyan}25`,text:C.cyan,border:C.cyan},"Brouillon":{bg:`${C.muted}20`,text:C.muted,border:C.muted},"Validée":{bg:`${C.green}20`,text:C.green,border:C.green}};
  const sc=M[s]||{bg:C.dim,text:C.muted};
  return <span style={{fontSize:10,padding:"3px 9px",borderRadius:6,background:sc.bg,color:sc.text,fontWeight:800,border:`1px solid ${sc.border||"transparent"}`}}>{s}</span>;
}
function ScoreRing({score,size=64}){
  if(score===null||score===undefined||isNaN(score)) score=0;
  const col=scoreColor(score); const r=(size/2)-5; const circ=2*Math.PI*r; const dash=(score/100)*circ;
  return <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.dim} strokeWidth={6}/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={6}
      strokeDasharray={`${dash} ${circ}`} strokeLinecap="round"
      transform={`rotate(-90 ${size/2} ${size/2})`}
      style={{filter:`drop-shadow(0 0 4px ${col})`}}/>
    <text x={size/2} y={size/2+4} textAnchor="middle" fill={col} fontSize={size>50?13:10} fontWeight={900}>{score}</text>
  </svg>;
}

// ═══════════════════════════════════════════════════════════════════════
function hasAccess(user,config,feature){
  if(!user) return false;
  if(user.role==="Admin") return true;
  var perms=config&&config.permissions&&config.permissions[user.role];
  if(!perms) return feature==="dashboard"||feature==="actions";
  return !!perms[feature];
}

// ── N vs N-1 helpers ─────────────────────────────────────────────────
function getPairs(inspections){
  var groups={};
  (inspections||[]).forEach(function(ins){
    var key=ins.site+"||"+ins.categorie;
    if(!groups[key]) groups[key]=[];
    groups[key].push(ins);
  });
  var pairs=[];
  Object.values(groups).forEach(function(g){
    var sorted=g.slice().sort(function(a,b){return b.date.localeCompare(a.date);});
    if(sorted.length>=2) pairs.push({current:sorted[0],previous:sorted[1]});
  });
  return pairs.sort(function(a,b){
    return Math.abs(b.current.score-b.previous.score)-Math.abs(a.current.score-a.previous.score);
  });
}

function DeltaBadge({delta}){
  var col=delta>0?C.green:delta<0?C.red:C.amber;
  var icon=delta>0?"▲":delta<0?"▼":"→";
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:3,padding:"3px 8px",borderRadius:99,background:col+"18",border:"1px solid "+col+"33",color:col,fontWeight:800,fontSize:12}}>
      {icon} {delta>0?"+":""}{delta} pts
    </span>
  );
}

function ComparisonScreen({inspections,onBack}){

  const filtered=filter==="Tout"?pairs:pairs.filter(function(p){return p.current.site===filter;});

  const improving=pairs.filter(function(p){return p.current.score>p.previous.score;}).length;
  const degrading=pairs.filter(function(p){return p.current.score<p.previous.score;}).length;
  const stable=pairs.filter(function(p){return p.current.score===p.previous.score;}).length;

// ── helpers section-level (global, used by both Detail & New) ──
function secNC(items,sec){ return items.filter(i=>i.s===sec&&!i.ok); }
function secPen(items,sec){ return secNC(items,sec).reduce((s,i)=>s+(PENALITE[i.poids||i.p]||0),0); }
function secScore(items,sec){ return calcScore(items.filter(i=>i.s===sec)); }

// ── Photo capture per question ──────────────────────────────────
function PhotoBtn({photos=[], onAdd, onRemove}){
  const ref = React.useRef();
  const handleFile = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => onAdd(ev.target.result);
    reader.readAsDataURL(file);
    e.target.value="";
  };
  return (
    <div style={{marginTop:8}}>
      {photos.length>0&&(
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:6}}>
          {photos.map((src,i)=>(
            <div key={i} style={{position:"relative",width:58,height:58}}>
              <img src={src} alt="" style={{width:58,height:58,borderRadius:8,objectFit:"cover",border:`1px solid ${C.border}`}}/>
              <button onClick={e=>{e.stopPropagation();onRemove(i);}} style={{position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:99,background:C.red,border:"none",color:"#fff",fontSize:9,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900}}>×</button>
            </div>
          ))}
        </div>
      )}
      <button onClick={e=>{e.stopPropagation();ref.current.click();}} style={{display:"flex",alignItems:"center",gap:5,background:`${C.cyan}12`,border:`1px dashed ${C.cyan}55`,borderRadius:8,padding:"5px 10px",color:C.cyan,fontSize:10,fontWeight:700,cursor:"pointer"}}>
        📷 {photos.length>0?`+ photo (${photos.length})`:"Ajouter une photo"}
      </button>
      <input ref={ref} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handleFile}/>
    </div>
  );
}

          var p=arr[0],l=arr[1],v=arr[2];
          return <div key={p} style={{display:"flex",alignItems:"center",gap:4}}><div style={{width:8,height:8,borderRadius:2,background:poidsColor(p)}}/><span style={{fontSize:10,color:C.muted}}>{l} = -{v}pt</span></div>;

                    onComment={function(v){setComment(itemId,v);}}

                    onEditLabel={function(v){setLabelItem(itemId,v);}}
                    onPhotoRemove={function(idx){removePhoto(itemId,idx);}}

                    onSetPoids={function(p){var capturedId=itemId;setItems(function(prev){return prev.map(function(i){return i.id===capturedId?{...i,poids:p,p:p}:i;});});}}
                    resps={respList}

                <AddQuestionBtn section={sec} onAdd={(label,poids)=>{

      <div style={{margin:"10px 14px 0",...S.card()}}>

        <textarea value={notes} onChange={e=>setNotes(e.target.value)} style={{...S.input,minHeight:80,resize:"vertical"}} placeholder="Observations, contexte, mesures immédiates prises..."/>

        <div style={{margin:"12px 14px 0",...S.card()}}>

          {sigInsp&&!sigResp&&<SignaturePad label="SIGNATURE RESPONSABLE SITE" onSave={function(d){
            setSigResp(d);
          }}/>}
          {sigInsp&&sigResp&&(
            <div style={{textAlign:"center",padding:"16px 0",background:C.green+"10",borderRadius:12,border:"1px solid "+C.green+"33"}}>
              <div style={{fontSize:28,marginBottom:8}}>✅</div>
              <div style={{fontSize:14,fontWeight:800,color:C.green,marginBottom:4}}>Signatures complètes</div>
              <div style={{fontSize:12,color:C.muted}}>Appuyez sur "✓ Valider" pour finaliser l'audit</div>

          )}

      )}
      <div style={{padding:"12px 14px 0",display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <button onClick={save} style={{...S.btn(saved?C.green:C.cyan)}}>{saved?"✓ Sauvegardé":"Sauvegarder"}</button>
        <button onClick={()=>{
          setShowSig(true);
          if(sigInsp&&sigResp){
            onUpdate({...inspection,items,notes,score,nc:ncItems.length,statut:"Validée",sigInspecteur:sigInsp,sigResponsable:sigResp});
          }
        }} style={{...S.btn(C.green)}}>{sigInsp&&sigResp?"✓ Valider":"Signer & valider"}</button>
      </div>
    </div>
  );
}

function QuickVisitScreen({user, onSave, onBack, sitesState}){
  const cats=CATEGORIES;
  const siteOpts=(sitesState&&sitesState.length>0)?sitesState:SITES;
  const [form,setForm]=useState({site:siteOpts[0]||SITES[0],cat:cats[0]});
  const critItems=CHECKLISTS[form.cat]?CHECKLISTS[form.cat].filter(function(q){return q.p==="critique";}):[];
  const [idx,setIdx]=useState(0);
  const [answers,setAnswers]=useState({});

  const answer=function(val){
    var newA={...answers};
    newA[critItems[idx].id]=val;
    setAnswers(newA);
    if(idx<critItems.length-1){ setIdx(idx+1); return; }
    var allItems=CHECKLISTS[form.cat].map(function(q){
      var ans=newA[q.id];
      var isNA=ans==="na";
      var isOk=isNA?true:(ans!==undefined?ans:true);
      return {...q,poids:q.p,ok:isOk,na:isNA,comment:isNA?"N/A":"",photos:[]};
    });
    var score=calcScore(allItems);
    var ins={
      id:Date.now(),titre:"Visite rapide — "+form.cat,site:form.site,
      categorie:form.cat,inspecteur:user.nom,
      date:new Date().toISOString().split("T")[0],
      statut:"En cours",items:allItems,notes:"",
      score:score,nc:allItems.filter(function(i){return !i.ok&&!i.na;}).length,
    };
    onSave(ins);
  };

  if(idx<critItems.length){
    const q=critItems[idx];
    return (
      <div style={{paddingBottom:80}}>
        <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
          <button onClick={onBack} style={{background:C.surface,border:"1px solid "+C.cyan+"44",borderRadius:10,padding:"8px 14px",color:C.cyan,cursor:"pointer",fontSize:13,fontWeight:700}}>← Retour</button>
          <div style={{flex:1}}><div style={{fontSize:18,fontWeight:900}}>⚡ Visite rapide</div><div style={{fontSize:11,color:C.muted}}>{form.cat} · question {idx+1}/{critItems.length}</div></div>
        </div>
        <div style={{margin:"14px 14px 0",background:C.surface,borderRadius:12,overflow:"hidden"}}>
          <div style={{height:4,background:C.dim}}><div style={{height:"100%",width:(((idx)/critItems.length)*100)+"%",background:C.cyan,transition:"width .3s"}}/></div>
        </div>
        <div style={{margin:"14px 14px 0",...S.card(),padding:24}}>
          <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:8}}>POINT CRITIQUE · {q.s}</div>
          <div style={{fontSize:16,fontWeight:700,lineHeight:1.5,marginBottom:24}}>{q.l}</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={function(){answer(true);}} style={{...S.btn(C.green),flex:1,fontSize:15,padding:"12px 6px"}}>✅ Conforme</button>
            <button onClick={function(){answer(false);}} style={{...S.btn(C.red,true),flex:1,fontSize:15,padding:"12px 6px"}}>❌ NC</button>
            <button onClick={function(){answer("na");}} style={{...S.btn(C.muted,true),flex:1,fontSize:15,padding:"12px 6px",opacity:0.8}}>➖ N/A</button>
          </div>
        </div>
        <div style={{margin:"12px 14px 0",...S.card(),padding:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div style={{fontSize:10,color:C.muted,letterSpacing:1}}>SITE</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {siteOpts.map(function(s){return (
              <button key={s} onClick={function(){setForm({...form,site:s});}} style={{padding:"10px 14px",borderRadius:10,border:"1px solid",borderColor:form.site===s?C.cyan:C.border,background:form.site===s?C.cyan+"18":"transparent",color:form.site===s?C.cyan:C.text,fontSize:13,fontWeight:form.site===s?800:400,cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:8}}>
                {form.site===s&&<span style={{color:C.cyan,fontSize:12}}>✓</span>}
                {s}
              </button>
            );})}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{padding:"40px 20px",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:12}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Visite terminée !</div>
      <div style={{fontSize:13,color:C.muted}}>Sauvegarde en cours...</div>
    </div>
  );
}

// NEW INSPECTION
// ═══════════════════════════════════════════════════════════════════════
function NewInspectionScreen({user,onSave,onBack,resps,sitesState,customTemplates,onSaveTemplate,siteAddresses}){
  const respList=(resps&&resps.length?resps:RESPONSABLES).map(function(r){return typeof r==="object"?r.nom:r;});
  const siteOpts=(sitesState&&sitesState.length>0)?sitesState:SITES;
  const [step,setStep]=useState(1);
  const [form,setForm]=useState({titre:"",site:siteOpts[0]||SITES[0],categorie:CATEGORIES[0],notes:"",accompagnateurs:[],adresse:(siteAddresses&&siteAddresses[siteOpts[0]])||"",date:new Date().toISOString().split("T")[0]});
  const [items,setItems]=useState([]);
  const [openSec,setOpenSec]=useState(null);

  const next=()=>{
    if(step===1){
      var tpl=(customTemplates&&customTemplates[form.categorie])||CHECKLISTS[form.categorie]||[];
      setItems(tpl.map(function(q){return {...q,poids:q.p||q.poids||'mineur',ok:true,comment:"",photos:[]};}));
      setOpenSec(null); setStep(2);
    } else setStep(3);
  };
  const toggle=(id)=>setItems(p=>p.map(i=>i.id===id?{...i,ok:!i.ok}:i));
  const setComment=(id,v)=>setItems(p=>p.map(i=>i.id===id?{...i,comment:v}:i));
  const addPhoto=(id,src)=>setItems(p=>p.map(i=>i.id===id?{...i,photos:[...(i.photos||[]),src]}:i));
  const removePhoto=(id,idx)=>setItems(p=>p.map(i=>i.id===id?{...i,photos:(i.photos||[]).filter((_,j)=>j!==idx)}:i));

  const score=calcScore(items);
  const ncItems=items.filter(i=>!i.ok);
  const penTotal=ncItems.reduce((s,i)=>s+(PENALITE[i.poids||i.p]||0),0);
  const sections=[...new Set(items.map(i=>i.s))];
  const totalPhotos=items.reduce((s,i)=>s+((i.photos&&i.photos.length)||0),0);

  const save=()=>{
    const d=new Date(); const ds=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    onSave({id:Date.now(),...form,score,nc:ncItems.length,statut:"En cours",date:form.date||ds,inspecteur:user.nom,items,accompagnateurs:form.accompagnateurs||[]});
  };

  const qCrit=(CHECKLISTS[form.categorie]&&CHECKLISTS[form.categorie].filter(q=>q.p==="critique").length)||0||0;
  const qElev=(CHECKLISTS[form.categorie]&&CHECKLISTS[form.categorie].filter(q=>q.p==="eleve").length)||0||0;
  const qMin=(CHECKLISTS[form.categorie]&&CHECKLISTS[form.categorie].filter(q=>q.p==="mineur").length)||0||0;
  const maxPen=qCrit*10+qElev*5+qMin;

  const StepDot=({n})=><div style={{width:28,height:28,borderRadius:99,background:step>=n?C.cyan:C.dim,color:step>=n?"#000":C.muted,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900}}>{n}</div>;

  return (
    <div style={{paddingBottom:100}}>
      <div style={{padding:"16px 16px 0",display:"flex",gap:10,alignItems:"center"}}>
        <button onClick={onBack} style={{background:C.surface,border:`1px solid ${C.cyan}44`,borderRadius:10,padding:"8px 14px",color:C.cyan,cursor:"pointer",flexShrink:0,fontSize:13,fontWeight:700}}>← Retour</button>
        <div style={{fontSize:16,fontWeight:800}}>Nouvelle inspection</div>
      </div>
      <div style={{padding:"14px 20px 0",display:"flex",alignItems:"center"}}><StepDot n={1}/><div style={{flex:1,height:2,background:step>=2?C.cyan:C.dim}}/><StepDot n={2}/><div style={{flex:1,height:2,background:step>=3?C.cyan:C.dim}}/><StepDot n={3}/></div>
      <div style={{display:"flex",justifyContent:"space-between",padding:"5px 14px 14px",fontSize:10,color:C.muted}}><span>Informations</span><span>Checklist</span><span>Résumé</span></div>

      {step===1&&(
        <div style={{padding:"0 14px"}}>
          <div style={{...S.card(),marginBottom:14}}>
            <label style={S.label}>Titre</label>
            <input style={{...S.input,marginBottom:14}} placeholder="Ex : Audit incendie — Bloc B" value={form.titre} onChange={e=>setForm({...form,titre:e.target.value})}/>
            <label style={S.label}>Date</label>
            <input type="date" style={{...S.input,marginBottom:14}} value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
            <label style={S.label}>Site</label>
            <select style={{...S.input,marginBottom:14}} value={form.site} onChange={function(e){setForm({...form,site:e.target.value,adresse:(siteAddresses&&siteAddresses[e.target.value])||""});}}>{siteOpts.map(function(s){return <option key={s} value={s}>{s}</option>;})}</select>
            <label style={S.label}>Adresse</label>
            <div style={{...S.input,marginBottom:14,background:C.surface,color:C.muted,fontSize:12,padding:"10px 14px",minHeight:36}}>
              {(siteAddresses&&siteAddresses[form.site])||<span style={{color:C.border,fontStyle:"italic"}}>Aucune adresse configurée pour ce site</span>}
            </div>
            <label style={S.label}>Catégorie</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
              {CATEGORIES.map(function(c){
                var m=CAT_META[c];
                var active=form.categorie===c;
                return (
                  <button key={c} onClick={function(){setForm({...form,categorie:c});}} style={{padding:"10px 8px",borderRadius:12,border:"1px solid",borderColor:active?C.cyan:C.border,background:active?C.cyan+"18":"transparent",color:active?C.cyan:C.muted,fontSize:12,fontWeight:active?800:500,cursor:"pointer",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}>
                    <span>{(m&&m.icon)||""}</span><span>{c}</span>
                  </button>
                );
              })}
            </div>

            <label style={S.label}>Accompagnateurs</label>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:14}}>
              {["SEPP","CPMT","Délégation syndicale","Responsable","Direction"].map(function(a){
                var checked=(form.accompagnateurs||[]).indexOf(a)>=0;
                return (
                  <button key={a} onClick={function(){
                    var cur=form.accompagnateurs||[];
                    var next=checked?cur.filter(function(x){return x!==a;}):cur.concat([a]);
                    setForm({...form,accompagnateurs:next});
                  }} style={{
                    padding:"7px 14px",borderRadius:99,border:"1px solid",
                    borderColor:checked?C.cyan:C.border,
                    background:checked?C.cyan+"18":"transparent",
                    color:checked?C.cyan:C.muted,
                    fontSize:12,fontWeight:checked?800:400,cursor:"pointer",
                    display:"flex",alignItems:"center",gap:6
                  }}>
                    {checked&&<span style={{fontSize:10}}>✓</span>}
                    {a}
                  </button>
                );
              })}
            </div>
            <label style={S.label}>Notes préliminaires</label>
            <textarea style={{...S.input,minHeight:60,resize:"vertical"}} placeholder="Contexte, périmètre, objectifs..." value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})}/>
          </div>
          <button onClick={next} disabled={!form.titre} style={{...S.btn(C.cyan),opacity:form.titre?1:.45}}>Suivant → Checklist ({(CHECKLISTS[form.categorie]&&CHECKLISTS[form.categorie].length)||0} questions)</button>
        </div>
      )}

      {step===2&&(
        <div style={{padding:"0 14px"}}>
          {/* Score live */}
          <div style={{...S.card(`${scoreColor(score)}33`),marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div>
                <div style={{fontSize:9,color:C.muted,letterSpacing:1}}>SCORE EN DIRECT</div>
                <div style={{fontSize:34,fontWeight:900,color:scoreColor(score),lineHeight:1}}>{score}<span style={{fontSize:14}}>/100</span></div>
                <div style={{fontSize:11,color:penTotal>0?C.red:C.green,marginTop:2}}>Pénalité : −{penTotal}pts{totalPhotos>0?` · 📷 ${totalPhotos}`:""}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:9,color:C.muted,marginBottom:4}}>NC ACTIVES</div>
                {["critique","eleve","mineur"].map(p=>{
                  const n=ncItems.filter(i=>i.poids===p).length;
                  if(!n) return null;
                  return (
                    <div key={p} style={{fontSize:10,fontWeight:800,color:poidsColor(p),marginBottom:1}}>{n}x {poidsPen(p)}</div>
                  );
                })}
                {ncItems.length===0&&<div style={{fontSize:11,color:C.green,fontWeight:800}}>✓ 100/100</div>}
              </div>
            </div>
            <Bar v={score} col={scoreColor(score)} h={8}/>
          </div>
          {/* Sections */}
          {sections.map(sec=>{
            const secItems=items.filter(i=>i.s===sec);
            const ss=secScore(items,sec);
            const sp=secPen(items,sec);
            const sncLen=secNC(items,sec).length;
            const open=openSec===sec;
            return (
              <div key={sec} style={{...S.card(sp>0?`${C.red}22`:C.border),marginBottom:10}}>
                <div onClick={()=>setOpenSec(open?null:sec)} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{sec}</div><div style={{fontSize:10,color:C.muted,marginTop:1}}>{secItems.length} questions · {sncLen} NC · −{sp}pts</div></div>
                  <div style={{fontSize:17,fontWeight:900,color:scoreColor(ss),marginRight:4}}>{ss}</div>
                  <div style={{fontSize:12,color:C.muted}}>{open?"▲":"▼"}</div>
                </div>
                {!open&&<div style={{marginTop:8}}><Bar v={ss} col={scoreColor(ss)}/></div>}
                {open&&(
                  <div style={{marginTop:12}}>
                    {secItems.map(function(item){
                      var itemId=item.id;
                      return (
                      <ItemCard key={itemId} item={item}
                        onToggle={function(){toggle(itemId);}}
                        onComment={function(v){setComment(itemId,v);}}
                        onPhotoAdd={function(src){addPhoto(itemId,src);}}
                        onPhotoRemove={function(idx){removePhoto(itemId,idx);}}
                        onRespChange={function(v){setItems(function(p){return p.map(function(i){return i.id===itemId?{...i,resp:v}:i;});});}}
                        onPoidsChange={function(p){var id=String(itemId);setItems(function(prev){return prev.map(function(i){return String(i.id)===id?{...i,poids:p,p:p}:i;});});}}
                        onPoidsChangeDirect={function(id,p){setItems(function(prev){return prev.map(function(i){return String(i.id)===String(id)?{...i,poids:p,p:p}:i;});});}}
                        onSetPoids={function(p){var capturedId=String(itemId);setItems(function(prev){return prev.map(function(i){return String(i.id)===capturedId?{...i,poids:p,p:p}:i;});});}}
                        resps={respList}
                      />);
                    })}
                    <AddQuestionBtn section={sec} onAdd={(label,poids)=>{
                      const newItem={id:"custom_"+Date.now(),s:sec,l:label,poids:poids,p:poids,ok:true,comment:"",photos:[],custom:true};
                      setItems(prev=>[...prev,newItem]);
                    }}/>
                  </div>
                )}
              </div>
            );
          })}

            <div style={{fontSize:13,color:C.muted,marginBottom:12}}>Récapitulatif complet</div>

            {[
              ["Titre",form.titre],["Date",form.date||"—"],["Site",form.site],["Adresse",form.adresse||"—"],["Accompagnateurs",(form.accompagnateurs&&form.accompagnateurs.length>0)?form.accompagnateurs.join(", "):"—"],
              ["Catégorie", ((CAT_META[form.categorie]&&CAT_META[form.categorie].icon)||"")+" "+form.categorie],
              ["Score final", score+"/100"],["Pénalité totale", "-"+penTotal+"pts"],
              ["NC Critiques", ncItems.filter(function(i){return i.poids==="critique";}).length+" ("+ncItems.filter(function(i){return i.poids==="critique";}).length*10+"pts)"],
              ["NC Élevées", ncItems.filter(function(i){return i.poids==="eleve";}).length+" ("+ncItems.filter(function(i){return i.poids==="eleve";}).length*5+"pts)"],
              ["NC Mineures", ncItems.filter(function(i){return i.poids==="mineur";}).length+" ("+ncItems.filter(function(i){return i.poids==="mineur";}).length+"pts)"],
              ["Photos jointes",totalPhotos],["Inspecteur",user.nom]
            ].map(function(arr){
              var k=arr[0]; var v=arr[1];
              return (<div key={k} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid "+C.border}}><span style={{fontSize:12,color:C.muted}}>{k}</span><span style={{fontSize:12,fontWeight:700}}>{v}</span></div>);
            })}
          </div>
          {items.filter(function(i){return i.custom;}).length>0&&(
              <div style={{...S.card(),marginBottom:12,background:C.cyan+"10",border:"1px solid "+C.cyan+"33"}}>
                <div style={{fontSize:12,fontWeight:800,color:C.cyan,marginBottom:6}}>💡 {items.filter(function(i){return i.custom;}).length} question(s) personnalisée(s) ajoutée(s)</div>
                <div style={{fontSize:11,color:C.muted,marginBottom:10}}>Voulez-vous sauvegarder ces questions comme nouveau standard pour la catégorie "{form.categorie}" ?</div>
                <div style={{display:"flex",gap:8}}>
                  <button onClick={function(){
                    var newTpl=items.map(function(i){return {id:i.id,s:i.s,l:i.l,p:i.poids||i.p||"mineur",poids:i.poids||i.p||"mineur"};});
                    onSaveTemplate&&onSaveTemplate(form.categorie,newTpl);
                    save();
                  }} style={{...S.btn(C.cyan),flex:2,fontSize:12,padding:"8px"}}>💾 Sauvegarder comme standard</button>
                  <button onClick={save} style={{...S.btn(C.muted,true),flex:1,fontSize:12,padding:"8px"}}>Non merci</button>
                </div>
              </div>
          )}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <button onClick={()=>setStep(2)} style={{...S.btn(C.muted,true)}}>← Modifier</button>
            <button onClick={save} style={{...S.btn(C.green)}}>Créer ✓</button>
          </div>
        </div>
      )}
    </div>
  );
}

// RAPPELS SCREEN
// ═══════════════════════════════════════════════════════════════════════
function RappelsScreen({actions,resps,config,onConfigUpdate,onBack}){
  var delai=(config&&config.rappelDelai)||7;
  const [editDelai,setEditDelai]=useState(false);
  const [tempDelai,setTempDelai]=useState(delai);

  // Charger les IDs d'actions dont le rappel a été envoyé
  const [dismissed,setDismissed]=useState(function(){
    try{var d=localStorage.getItem("secura_rappels_sent");return d?JSON.parse(d):{};}catch(e){return {};}
  });

  function saveDismissed(newD){
    setDismissed(newD);
    try{localStorage.setItem("secura_rappels_sent",JSON.stringify(newD));}catch(e){}
  }

  function getEmail(nom){
    var r=(resps||[]).find(function(r){return typeof r==="object"&&r.nom===nom;});
    return r&&r.email?r.email:"";
  }

  // Nettoyer les entrées dont l'action est clôturée ou n'existe plus
  var activeIds=actions.filter(function(a){return a.statut!=="Clôturée";}).map(function(a){return String(a.id);});
  var cleanDismissed={};
  Object.keys(dismissed).forEach(function(k){if(activeIds.indexOf(k)!==-1) cleanDismissed[k]=true;});

  var today=new Date(); today.setHours(0,0,0,0);
  var alertes=actions.filter(function(a){
    if(a.statut==="Clôturée"||!a.resp||!a.echeance) return false;
    if(cleanDismissed[String(a.id)]) return false;
    return Math.ceil((new Date(a.echeance)-today)/86400000)<=delai;
  });

  var byResp={};
  alertes.forEach(function(a){
    if(!byResp[a.resp]) byResp[a.resp]={resp:a.resp,email:getEmail(a.resp),actions:[]};
    byResp[a.resp].actions.push(a);
  });
  var groups=Object.values(byResp).sort(function(a,b){return a.resp.localeCompare(b.resp);});

  function buildMailto(group){
    var d=new Date().toLocaleDateString("fr-BE",{day:"2-digit",month:"2-digit",year:"numeric"});
    var subject="SECURA - Rappel actions correctives - "+d;
    var lines=[];
    lines.push("Bonjour "+group.resp.split(" ")[0]+",");
    lines.push("");
    lines.push("Voici un rappel des actions correctives qui vous sont attribuees et dont l'echeance approche.");
    lines.push("");
    lines.push("----------------------------------");
    lines.push("VOS ACTIONS EN COURS");
    lines.push("----------------------------------");
    lines.push("");
    group.actions.forEach(function(a,i){
      var dl=Math.ceil((new Date(a.echeance)-today)/86400000);
      var st=dl<0?"EN RETARD DE "+Math.abs(dl)+" JOUR(S)":dl===0?"ECHEANCE AUJOURD'HUI":"Dans "+dl+" jour(s) ("+a.echeance+")";
      lines.push((i+1)+". "+a.label);
      lines.push("   Site : "+a.site);
      lines.push("   Priorite : "+a.prio);
      lines.push("   Statut : "+st);
      lines.push("");
    });
    lines.push("----------------------------------");
    lines.push("");
    lines.push("Merci de traiter ces actions dans les delais et de mettre a jour leur statut dans SECURA.");
    lines.push("");
    lines.push("Cordialement,");
    lines.push("L'equipe Prevention & Securite");
    var body=lines.join("\n");
    return "mailto:"+group.email+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  }

  function send(group){
    var newD=Object.assign({},cleanDismissed);
    group.actions.forEach(function(a){newD[String(a.id)]=true;});
    saveDismissed(newD);
    setTimeout(function(){window.open(buildMailto(group),"_self");},300);
  }

  return (
    <div style={{paddingBottom:88}}>
      <div style={{padding:"20px 16px 12px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={onBack} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"8px 12px",color:C.cyan,cursor:"pointer",fontSize:13,fontWeight:700}}>← Retour</button>
        <div><div style={{fontSize:18,fontWeight:900}}>📧 Rappels</div><div style={{fontSize:11,color:C.muted}}>Envoi aux responsables par email</div></div>
      </div>
      <div style={{margin:"0 14px 14px",...S.card(C.cyan+"22")}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontSize:13,fontWeight:700}}>⏰ Délai de rappel</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>Actions dont l&#39;échéance est dans ≤ {delai} jour(s)</div></div>
          {!editDelai?(
            <button onClick={function(){setEditDelai(true);setTempDelai(delai);}} style={{...S.btn(C.cyan,true),width:"auto",padding:"6px 14px",fontSize:12}}>{delai}j ✏️</button>
          ):(
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="number" min="1" max="90" value={tempDelai} onChange={function(e){setTempDelai(parseInt(e.target.value)||1);}} style={{...S.input,width:60,textAlign:"center",padding:"6px 8px",fontSize:14,fontWeight:800}}/>
              <button onClick={function(){onConfigUpdate&&onConfigUpdate(Object.assign({},config,{rappelDelai:tempDelai}));setEditDelai(false);}} style={{...S.btn(C.green),width:"auto",padding:"6px 14px",fontSize:12}}>✓</button>
              <button onClick={function(){setEditDelai(false);}} style={{...S.btn(C.muted,true),width:"auto",padding:"6px 10px",fontSize:12}}>✕</button>
            </div>
          )}
        </div>
      </div>
      {groups.length===0&&(
        <div style={{textAlign:"center",padding:"50px 20px",color:C.muted}}>
          <div style={{fontSize:36,marginBottom:12}}>✅</div>
          <div style={{fontSize:14,fontWeight:700,marginBottom:6}}>Aucun rappel nécessaire</div>
          <div style={{fontSize:12}}>Aucune action n&#39;arrive à échéance dans les {delai} prochains jours.</div>
        </div>
      )}
      <div style={{padding:"0 14px"}}>
        {groups.map(function(group,gi){
          var hasEmail=!!group.email;
                    var retard=group.actions.filter(function(a){return Math.ceil((new Date(a.echeance)-today)/86400000)<0;}).length;
          var critique=group.actions.filter(function(a){return a.prio==="CRITIQUE";}).length;
          var initials=(group.resp||"?").split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase();
          return (
            <div key={gi} style={{...S.card(),marginBottom:14}}>
              <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,paddingBottom:12,borderBottom:"1px solid "+C.border}}>
                <div style={{width:44,height:44,borderRadius:13,background:C.cyan+"18",border:"1px solid "+C.cyan+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:C.cyan,flexShrink:0}}>{initials}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:800}}>{group.resp}</div>
                  <div style={{fontSize:11,color:hasEmail?C.muted:C.red,marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{hasEmail?group.email:"⚠ Email manquant — configurer dans Paramètres"}</div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:20,fontWeight:900,color:C.cyan}}>{group.actions.length}</div><div style={{fontSize:9,color:C.muted}}>action(s)</div></div>
              </div>
              {(retard>0||critique>0)&&(
                <div style={{display:"flex",gap:6,marginBottom:10,flexWrap:"wrap"}}>
                  {retard>0&&<span style={{fontSize:10,padding:"3px 9px",borderRadius:6,background:C.red+"18",color:C.red,fontWeight:700}}>⚠ {retard} en retard</span>}
                  {critique>0&&<span style={{fontSize:10,padding:"3px 9px",borderRadius:6,background:C.orange+"18",color:C.orange,fontWeight:700}}>🔴 {critique} critique{critique>1?"s":""}</span>}
                </div>
              )}
              {group.actions.map(function(a,ai){
                var col=a.prio==="CRITIQUE"?C.red:a.prio==="ÉLEVÉE"?C.orange:C.amber;
                var dl=Math.ceil((new Date(a.echeance)-today)/86400000);
                var dlCol=dl<0?C.red:dl<=3?C.orange:C.muted;
                var dlTxt=dl<0?"⚠ "+Math.abs(dl)+"j retard":dl===0?"Aujourd'hui":"+"+dl+"j";
                function dismissOne(e){
                  e.stopPropagation();
                  var newD=Object.assign({},cleanDismissed);
                  newD[String(a.id)]=true;
                  saveDismissed(newD);
                }
                return (
                  <div key={ai} style={{display:"flex",gap:10,padding:"8px 0",borderBottom:ai<group.actions.length-1?"1px solid "+C.dim:"none",alignItems:"flex-start"}}>
                    <div style={{width:6,height:6,borderRadius:99,background:col,marginTop:5,flexShrink:0}}/>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,lineHeight:1.3,marginBottom:3}}>{a.label}</div>
                      <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
                        <span style={{fontSize:9,padding:"1px 6px",borderRadius:5,background:col+"18",color:col,fontWeight:800}}>{a.prio}</span>
                        <span style={{fontSize:10,color:C.muted}}>📍 {a.site}</span>
                        <span style={{fontSize:10,color:dlCol,fontWeight:dl<0?800:400}}>{dlTxt}</span>
                      </div>
                    </div>
                    <button onClick={dismissOne} style={{background:"transparent",border:"1px solid "+C.border,borderRadius:8,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:C.muted,fontSize:13,flexShrink:0}} title="Retirer ce rappel">✕</button>
                  </div>
                );
              })}
              <button onClick={function(){send(group);}} disabled={!hasEmail}
                style={{marginTop:14,width:"100%",padding:"13px",borderRadius:12,
                  background:hasEmail?"linear-gradient(135deg,"+C.cyan+","+C.cyan+"BB)":C.dim,
                  border:"none",color:hasEmail?"#000":C.muted,fontWeight:800,fontSize:13,
                  cursor:hasEmail?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                <span>📧</span>Envoyer rappel à {group.resp.split(" ")[0]}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ActionsScreen({actions,onUpdate,resps,config,onConfigUpdate,user}){
  const respList=(resps&&resps.length?resps:RESPONSABLES).map(function(r){return typeof r==="object"?r.nom:r;});
  const [filter,setFilter]=useState("Tout");
  const [editRespId,setEditRespId]=useState(null);
  const [showRappels,setShowRappels]=useState(false);
  if(showRappels) return <RappelsScreen actions={actions} resps={resps} config={config} onConfigUpdate={onConfigUpdate} onBack={function(){setShowRappels(false);}} />;
  const sorted=[...actions].sort((a,b)=>{
    if(a.echeance&&b.echeance) return a.echeance.localeCompare(b.echeance);
    if(a.echeance) return -1; if(b.echeance) return 1; return 0;
  });
  const filtered=filter==="Tout"?sorted:sorted.filter(a=>a.statut===filter);
  const cycle=(a)=>{ onUpdate({...a,statut:a.statut==="Clôturée"?"En cours":"Clôturée"}); };
  const colPrio=(p)=>p==="CRITIQUE"?C.red:p==="ÉLEVÉE"?C.orange:C.amber;
  const daysLeft=(echeance)=>{
    if(!echeance) return null;
    const diff=Math.ceil((new Date(echeance)-new Date())/(1000*60*60*24));
    return isNaN(diff)?null:diff;
  };
  return (
    <div style={{paddingBottom:88}}>
      <div style={{padding:"20px 16px 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:20,fontWeight:900}}>Actions urgentes</div><div style={{fontSize:12,color:C.muted,marginTop:2}}>{actions.filter(a=>a.statut!=="Clôturée").length} en cours</div></div>
        {hasAccess(user,config,"rappels")&&<button onClick={function(){setShowRappels(true);}} style={{background:"linear-gradient(135deg,"+C.cyan+",#007799)",border:"none",borderRadius:14,padding:"10px 16px",color:"#000",fontWeight:900,fontSize:13,cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",gap:7,boxShadow:"0 0 16px "+C.cyan+"55"}}><span style={{fontSize:18}}>📧</span><span>Rappels</span></button>}
      </div>
      <div style={{padding:"0 14px 12px",display:"flex",gap:6,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        {["En cours","À faire","Tout"].map(function(s){return <button key={s} onClick={function(){setFilter(s);}} style={{flexShrink:0,padding:"5px 11px",borderRadius:99,border:"1px solid",borderColor:filter===s?C.cyan:C.border,background:filter===s?C.cyan+"15":"transparent",color:filter===s?C.cyan:C.muted,fontSize:11,fontWeight:700,cursor:"pointer"}}>{s}</button>;})}
      </div>
      <div style={{padding:"0 14px"}}>
        {filtered.map((a,i)=>{
          const col=colPrio(a.prio);
          const dl=daysLeft(a.echeance);
          const urgency=dl===null?"ok":dl<0?"retard":dl<=3?"urgent":dl<=14?"proche":"ok";
          const urgCol={retard:C.red,urgent:C.red,proche:C.amber,ok:C.green}[urgency];
          return (
            <div key={a.id} style={{...S.card(urgency==="retard"?C.red+"33":urgency==="urgent"?C.red+"22":C.border),marginBottom:10}}>
              <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                <div style={{width:30,height:30,borderRadius:8,background:col+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:900,color:col,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:13,fontWeight:700}}>{a.label}</div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>📍 {a.site}</div>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                    {editRespId===a.id?(
                      <select
                        value={a.resp||""}
                        onChange={e=>{onUpdate({...a,resp:e.target.value});setEditRespId(null);}}
                        style={{...S.input,fontSize:11,padding:"4px 8px",flex:1}}
                        onBlur={()=>setEditRespId(null)}
                        autoFocus
                      >
                        <option value="">— Non assigné —</option>
                        {respList.map(function(r,i){var n=typeof r==="object"?r.nom:r; return <option key={i} value={n}>{n}</option>;})}
                      </select>
                    ):(
                      <button onClick={()=>setEditRespId(a.id)} style={{background:"transparent",border:"1px dashed "+C.border,borderRadius:6,padding:"3px 8px",color:a.resp?C.cyan:C.muted,fontSize:11,cursor:"pointer"}}>
                        👤 {a.resp||"Assigner un responsable"}
                      </button>
                    )}
                  </div>
                </div>
                {dl!==null&&(
                  <div style={{textAlign:"center",padding:"4px 8px",borderRadius:8,background:urgCol+"18",border:"1px solid "+urgCol+"44",flexShrink:0}}>
                    <div style={{fontSize:15,fontWeight:900,color:urgCol,lineHeight:1}}>{dl<0?Math.abs(dl)+"j":dl===0?"Auj":dl+"j"}</div>
                    <div style={{fontSize:9,color:urgCol}}>{dl<0?"retard":dl===0?"auj.":"restants"}</div>
                  </div>
                )}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <Tag label={a.prio} color={col}/>
                  <span style={{fontSize:10,color:C.muted}}>{fmt(a.echeance)}</span>
                </div>
                <button onClick={()=>cycle(a)} style={{...S.btn(a.statut==="Clôturée"?C.green:C.cyan,true),width:"auto",padding:"5px 12px",fontSize:11}}>
                  {a.statut==="Clôturée"?"✓ Clôturée":"→ Clôturer"}
                </button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function SignaturePad({onSave, label}){
  const ref=useRef(null);
  const drawingRef=useRef(false);
  const [hasLine,setHasLine]=useState(false);

  const getPos=(e,canvas)=>{
    const r=canvas.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return {x:(src.clientX-r.left)*(canvas.width/r.width), y:(src.clientY-r.top)*(canvas.height/r.height)};
  };

  // Use useEffect to attach NON-PASSIVE touch listeners directly on the canvas
  // This is the only reliable way to call preventDefault() on iOS Safari
  React.useEffect(()=>{
    const canvas=ref.current;
    if(!canvas) return;

    const onTouchStart=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const ctx=canvas.getContext("2d");
      const p=getPos(e,canvas);
      ctx.beginPath(); ctx.moveTo(p.x,p.y);
      drawingRef.current=true;
      setHasLine(true);
    };
    const onTouchMove=(e)=>{
      e.preventDefault();
      e.stopPropagation();
      if(!drawingRef.current) return;
      const ctx=canvas.getContext("2d");
      const p=getPos(e,canvas);
      ctx.lineTo(p.x,p.y);
      ctx.strokeStyle="#00E5FF"; ctx.lineWidth=2.5; ctx.lineCap="round";
      ctx.stroke();
    };
    const onTouchEnd=(e)=>{
      e.preventDefault();
      drawingRef.current=false;
    };

    canvas.addEventListener("touchstart", onTouchStart, {passive:false});
    canvas.addEventListener("touchmove",  onTouchMove,  {passive:false});
    canvas.addEventListener("touchend",   onTouchEnd,   {passive:false});
    return ()=>{
      canvas.removeEventListener("touchstart", onTouchStart);
      canvas.removeEventListener("touchmove",  onTouchMove);
      canvas.removeEventListener("touchend",   onTouchEnd);
    };
  },[]);

  // Mouse handlers for desktop
  const mouseStart=(e)=>{
    const c=ref.current; const ctx=c.getContext("2d");
    const p=getPos(e,c);
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
    drawingRef.current=true; setHasLine(true);
  };
  const mouseMove=(e)=>{
    if(!drawingRef.current) return;
    const c=ref.current; const ctx=c.getContext("2d");
    const p=getPos(e,c);
    ctx.lineTo(p.x,p.y);
    ctx.strokeStyle="#00E5FF"; ctx.lineWidth=2.5; ctx.lineCap="round";
    ctx.stroke();
  };
  const mouseEnd=()=>{ drawingRef.current=false; };

  const clear=()=>{
    const c=ref.current; const ctx=c.getContext("2d");
    ctx.clearRect(0,0,c.width,c.height); setHasLine(false);
  };
  const save=()=>{
    if(!hasLine) return;
    onSave(ref.current.toDataURL());
  };

  return (
    <div style={{marginBottom:16}}>
      <div style={{fontSize:11,color:C.muted,letterSpacing:1,marginBottom:6,textTransform:"uppercase"}}>{label}</div>
      <div style={{background:C.surface,borderRadius:10,border:"2px dashed "+C.border,overflow:"hidden"}}>
        <canvas ref={ref} width={340} height={140}
          style={{display:"block",width:"100%",touchAction:"none",cursor:"crosshair"}}
          onMouseDown={mouseStart}
          onMouseMove={mouseMove}
          onMouseUp={mouseEnd}
          onMouseLeave={mouseEnd}
        />
      </div>
      {!hasLine&&<div style={{fontSize:10,color:C.muted,textAlign:"center",marginTop:4}}>✍️ Signez dans le cadre ci-dessus</div>}
      <div style={{display:"flex",gap:8,marginTop:8}}>
        <button onClick={clear} style={{...S.btn(C.muted,true),flex:1,padding:"8px",fontSize:12}}>Effacer</button>
        <button onClick={save} disabled={!hasLine} style={{...S.btn(C.cyan),flex:2,padding:"8px",fontSize:12,opacity:hasLine?1:.4}}>✓ Confirmer</button>
      </div>
    </div>
  );
}

function SettingsScreen({user,onLogout,appState,onAppStateUpdate,respsState,sitesState,config,onConfigUpdate}){
  const rc={Admin:C.red,Inspecteur:C.cyan,Responsable:C.green};

  const [savedMsg,setSavedMsg]=useState(false);
  const [newSite,setNewSite]=useState("");
  const [newResp,setNewResp]=useState("");
  const [newRespEmail,setNewRespEmail]=useState("");
  const [newRespPass,setNewRespPass]=useState("");
  const [newRespRole,setNewRespRole]=useState("Inspecteur");
  const newRespRef=useRef(null);
  const newRespEmailRef=useRef(null);
  const newRespPassRef=useRef(null);
  const newSiteRef=useRef(null);

  // Read directly from dedicated state props
  const resps=respsState||RESPONSABLES_DEFAULT;
  const sites=sitesState||SITES_DEFAULT;
  const penalites=(appState&&appState.penalites)||{critique:5,eleve:3,mineur:1};
  const delais=(appState&&appState.delais)||{critique:0,eleve:60,mineur:120};

  const update=(patch)=>{
    const next={sites,resps,penalites,delais,customTemplates:appState&&appState.customTemplates||{},siteAddresses:appState&&appState.siteAddresses||{},...patch};
    SITES.length=0; next.sites.forEach(function(s){SITES.push(s);});
    RESPONSABLES.length=0; next.resps.forEach(function(r){RESPONSABLES.push(r);});
    if(onAppStateUpdate) onAppStateUpdate(next);
  };

  const addResp=()=>{
    const nom=(newRespRef.current?newRespRef.current.value:newResp).trim();
    if(!nom) return;
    const email=(newRespEmailRef.current?newRespEmailRef.current.value:newRespEmail).trim()||nom.toLowerCase().replace(/ /g,".")+"."+Date.now()+"@secura.be";
    const pass=(newRespPassRef.current?newRespPassRef.current.value:newRespPass).trim()||"1234";
    const newUser={nom,email,pass,role:newRespRole,avatar:nom.split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase()};
    update({resps:[...resps,newUser]});
    setNewResp(""); setNewRespEmail(""); setNewRespPass(""); setNewRespRole("Inspecteur");
    if(newRespRef.current) newRespRef.current.value="";
    if(newRespEmailRef.current) newRespEmailRef.current.value="";
    if(newRespPassRef.current) newRespPassRef.current.value="";
  };
  const addSite=()=>{
    const val=(newSiteRef.current?newSiteRef.current.value:newSite).trim();
    if(!val) return;
    update({sites:[...sites,val]});
    setNewSite("");
    if(newSiteRef.current) newSiteRef.current.value="";
  };
  const removeResp=(i)=>update({resps:resps.filter(function(_,j){return j!==i;})});
  const removeSite=(i)=>update({sites:sites.filter(function(_,j){return j!==i;})});
  const setPen=(k,v)=>update({penalites:{...penalites,[k]:v===""?"":parseInt(v)||0}});
  const setDel=(k,v)=>update({delais:{...delais,[k]:v===""?"":parseInt(v)||0}});

  const save=()=>{
    const pendingResp=(newRespRef.current?newRespRef.current.value:newResp).trim();
    const pendingSite=(newSiteRef.current?newSiteRef.current.value:newSite).trim();
    var finalResps=pendingResp?[...resps,pendingResp]:resps;
    var finalSites=pendingSite?[...sites,pendingSite]:sites;
    if(pendingResp){ setNewResp(""); if(newRespRef.current) newRespRef.current.value=""; }
    if(pendingSite){ setNewSite(""); if(newSiteRef.current) newSiteRef.current.value=""; }

    DELAIS.critique=delais.critique; DELAIS.eleve=delais.eleve; DELAIS.mineur=delais.mineur;
    // Save everything to Supabase via update()

            <div style={{marginTop:14,padding:12,background:C.surface,borderRadius:10,border:"1px dashed "+C.border}}>

        {tab==="systeme"&&(

              {[["critique","CRITIQUE",C.red],["eleve","ÉLEVÉ",C.orange],["mineur","MODÉRÉ",C.amber]].map(function(arr){
                var k=arr[0],l=arr[1],col=arr[2];
                return (
                  <div key={k} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>

        {tab==="apparence"&&(
          <div>

            {/* Accent color */}
            <div style={{...S.card(),marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:800,marginBottom:12}}>🎨 Couleur principale</div>
              <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                {[["#00E5FF","Cyan"],["#00E676","Vert"],["#FF6D00","Orange"],["#D500F9","Violet"],["#FF1744","Rouge"],["#2979FF","Bleu"],["#FFB300","Ambre"],["#1DE9B6","Teal"]].map(function(c){
                  var active=(config&&config.accentColor)===c[0];
                  return (
                    <button key={c[0]} onClick={()=>onConfigUpdate&&onConfigUpdate({...config,accentColor:c[0]})}
                      style={{width:44,height:44,borderRadius:12,background:c[0],border:active?"3px solid #fff":"3px solid transparent",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",boxShadow:active?"0 0 0 2px "+c[0]:"none",transition:"all .2s"}}>
                      {active&&<span style={{fontSize:16,color:"#000"}}>✓</span>}

              </div>
              <div style={{fontSize:11,color:C.muted,marginTop:8}}>Couleur active : <span style={{color:(config&&config.accentColor)||C.cyan,fontWeight:800}}>{(config&&config.accentColor)||"#00E5FF"}</span></div>
            </div>
            {/* Font family */}
            <div style={{...S.card(),marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:800,marginBottom:12}}>✍️ Police de caractères</div>
              {[["DM Sans,Segoe UI,sans-serif","DM Sans"],["Georgia,serif","Georgia"],["Courier New,monospace","Courier"],["Helvetica,Arial,sans-serif","Helvetica"],["system-ui,sans-serif","Système"]].map(function(f){
                var active=(config&&config.fontFamily)===f[0];
                return (
                  <button key={f[0]} onClick={()=>onConfigUpdate&&onConfigUpdate({...config,fontFamily:f[0]})}
                    style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",padding:"10px 12px",marginBottom:6,borderRadius:10,border:"1px solid "+(active?C.cyan:C.border),background:active?C.cyan+"18":"transparent",cursor:"pointer",color:active?C.cyan:C.text}}>
                    <span style={{fontFamily:f[0],fontSize:14}}>{f[1]}</span>
                    {active&&<span style={{color:C.cyan,fontSize:14}}>✓</span>}
                  </button>
                );
              })}
            </div>
            {/* Font size */}
            <div style={{...S.card(),marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:800,marginBottom:12}}>🔡 Taille du texte</div>
              <div style={{display:"flex",gap:8}}>
                {[[13,"Petit"],[15,"Normal"],[17,"Grand"]].map(function(s){
                  var active=(config&&config.fontSize)===s[0];
                  return (
                    <button key={s[0]} onClick={()=>onConfigUpdate&&onConfigUpdate({...config,fontSize:s[0]})}
                      style={{flex:1,padding:"10px",borderRadius:10,border:"1px solid "+(active?C.cyan:C.border),background:active?C.cyan+"18":"transparent",color:active?C.cyan:C.muted,cursor:"pointer",fontSize:s[0],fontWeight:active?800:400}}>
                      {s[1]}

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>

                    {active&&<span style={{color:ac,fontSize:14,fontWeight:900}}>✓</span>}

                );
              })}

        )}
        {tab==="systeme"&&(
          <div>
          <div style={{...S.card(),marginBottom:12}}>
            <div style={{fontSize:13,fontWeight:800,marginBottom:10}}>📋 Templates personnalisés</div>
            {Object.keys(appState&&appState.customTemplates||{}).length===0?(
              <div style={{fontSize:12,color:C.muted}}>Aucun template modifié — checklists d'origine utilisées</div>
            ):(
              <div>
                {Object.keys(appState.customTemplates||{}).map(function(cat){
                  var tpl=appState.customTemplates[cat];
                  var orig=CHECKLISTS[cat]||[];
                  var added=(tpl||[]).filter(function(q){return (q.id||"").startsWith("custom_");}).length;
                  return (
                    <div key={cat} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+C.border}}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:700}}>{cat}</div>
                        <div style={{fontSize:10,color:C.muted}}>{(tpl||[]).length} questions ({added} ajoutée(s))</div>
                      </div>
                      <button onClick={function(){
                        var newTpls={...(appState.customTemplates||{})};
                        delete newTpls[cat];
                        update({customTemplates:newTpls});
                      }} style={{background:"transparent",border:"1px solid "+C.red+"44",borderRadius:8,color:C.red,padding:"4px 10px",fontSize:11,cursor:"pointer"}}>

          <div style={{...S.card(),marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:13,fontWeight:800}}>🔔 Notifications push</div>

              </div>
              <button onClick={function(){
                var enabled=!(config&&config.notificationsEnabled);
                if(enabled){
                  if(!("Notification" in window)){
                    alert("Notifications non supportées sur cet appareil.");
                    return;
                  }
                  Notification.requestPermission().then(function(perm){
                    if(perm==="granted"){
                      onConfigUpdate&&onConfigUpdate({...config,notificationsEnabled:true});
                      // Show test notification
                      setTimeout(function(){
                        new Notification("🛡️ SECURA",{body:"Notifications activées ! Vous serez alerté des échéances.",icon:"/icon-192.png"});

                      alert("Permission refusée. Activez les notifications dans les réglages iPhone → Safari.");

                  });

              }} style={{width:48,height:28,borderRadius:99,background:(config&&config.notificationsEnabled)?ac:C.border,border:"none",cursor:"pointer",transition:"background .2s",position:"relative",flexShrink:0}}>
                <div style={{position:"absolute",top:3,left:(config&&config.notificationsEnabled)?22:3,width:22,height:22,borderRadius:99,background:"#fff",transition:"left .2s"}}/>
              </button>
            </div>
            {config&&config.notificationsEnabled&&(
              <div style={{marginTop:10,fontSize:11,color:C.green,padding:"6px 10px",background:C.green+"15",borderRadius:8}}>
                ✅ Notifications actives — alertes J-3, J-1 et le jour J

            )}
          </div>
          </div>
        )}
        {savedMsg&&(
          <div style={{background:C.green+"18",border:"1px solid "+C.green+"44",borderRadius:10,padding:"10px 14px",marginBottom:10,textAlign:"center",color:C.green,fontWeight:700,fontSize:13}}>
            ✓ Paramètres sauvegardés !
          </div>
        )}
        <button onClick={save} style={{...S.btn(savedMsg?C.green:C.cyan),marginBottom:10}}>
          {savedMsg?"✓ Sauvegardé":"💾 Sauvegarder pénalités & délais"}
        </button>
        <button onClick={onLogout} style={{...S.btn(C.red,true)}}>Déconnexion</button>

  return icons[name]||null;

function BottomNav({active,onChange,badge,user,config}){
  var allTabs=[
    {k:"dashboard",  l:"Accueil",  f:"dashboard"},
    {k:"inspections",l:"Audits",   f:"inspections"},
    {k:"actions",    l:"Actions",  f:"actions",badge:badge},
    {k:"rapports",   l:"Rapports", f:"rapports"},
    {k:"settings",   l:"Profil",   f:"settings"},
  ];
  var tabs=allTabs.filter(function(t){return hasAccess(user,config,t.f);});
  return (
    <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:430,background:"rgba(10,12,19,.96)",backdropFilter:"blur(20px)",borderTop:"1px solid "+C.border,display:"flex",justifyContent:"space-around",padding:"8px 0 20px",zIndex:100}}>
      {tabs.map(function(t){
        const isActive=active===t.k;
        const col=isActive?C.cyan:C.muted;
        return (
          <button key={t.k} onClick={()=>onChange(t.k)} style={{background:"none",border:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:4,cursor:"pointer",position:"relative",minWidth:52,padding:0}}>
            <div style={{width:42,height:32,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",background:isActive?C.cyan+"18":"transparent",transition:"all .2s",color:col}}>
              <NavIcon name={t.k} col={col} size={20}/>
              {t.badge>0&&(
                <div style={{position:"absolute",top:0,right:6,minWidth:16,height:16,borderRadius:99,background:C.red,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:900,color:"#fff",border:"2px solid #0A0C13",padding:"0 3px"}}>
                  {t.badge>9?"9+":t.badge}
                </div>
              )}
            </div>
            <span style={{fontSize:9,fontWeight:isActive?800:400,color:col,letterSpacing:.3}}>{t.l}</span>
          </button>
        );
      })}
    </div>
  );
}
