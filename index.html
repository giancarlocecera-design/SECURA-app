const supa = {
  async get(table, opts) {
    let url = SUPA_URL + "/rest/v1/" + table + "?select=*";
    if (opts && opts.eq) url += "&" + opts.eq.col + "=eq." + opts.eq.val;
    if (opts && opts.order) url += "&order=" + opts.order;
    const r = await fetch(url, {
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY
      }
    });
    return r.json();
  },
  async upsert(table, data) {
    const r = await fetch(SUPA_URL + "/rest/v1/" + table, {
      method: "POST",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY,
        "Content-Type": "application/json",
        "Prefer": "resolution=merge-duplicates,return=minimal"
      },
      body: JSON.stringify(data)
    });
    return r.ok;
  },
  async del(table, id) {
    const r = await fetch(SUPA_URL + "/rest/v1/" + table + "?id=eq." + id, {
      method: "DELETE",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY
      }
    });
    return r.ok;
  },
  async patch(table, id, data) {
    const r = await fetch(SUPA_URL + "/rest/v1/" + table + "?id=eq." + id, {
      method: "PATCH",
      headers: {
        "apikey": SUPA_KEY,
        "Authorization": "Bearer " + SUPA_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(data)
    });
    return r.ok;
  }
};

// ═══════════════════════════════════════════════════════════════════════
// SCORING SYSTEM — Pénalités
// Départ : 100 pts
// NC Critique  → −10 pts
// NC Élevé     → −5  pts
// NC Mineur    → −1  pt
// Score final = max(0, 100 − Σ pénalités NC)
// ═══════════════════════════════════════════════════════════════════════
let PENALITE = {
  critique: 10,
  eleve: 5,
  mineur: 1
};
let DELAIS = {
  critique: 0,
  eleve: 60,
  mineur: 120
};
function deadlineFromNow(poids) {
  const days = DELAIS[poids] || 120;
  if (days === 0) return new Date().toISOString().split("T")[0]; // immédiat
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().split("T")[0];
}
function delaiLabel(poids) {
  return poids === "critique" ? "Sans délai (immédiat)" : poids === "eleve" ? "≤ 2 mois" : "≤ 4 mois";
}
function calcScore(items) {
  if (!items || !items.length) return 100;
  const pen = items.filter(i => !i.ok).reduce((s, i) => s + (PENALITE[i.poids || i.p] || 0), 0);
  return Math.max(0, 100 - pen);
}
function scoreColor(s) {
  if (s === null || s === undefined || isNaN(s)) return C.muted;
  return s >= 80 ? C.green : s >= 55 ? C.amber : C.red;
}
function poidsColor(p) {
  if (!p) return C.muted;
  return p === "critique" ? C.red : p === "eleve" ? C.orange : C.amber;
}
function poidsLabel(p) {
  return p === "critique" ? "CRITIQUE" : p === "eleve" ? "ÉLEVÉ" : "MINEUR";
}
function poidsPen(p) {
  const v = PENALITE[p] || 0;
  return `-${v}pt${v > 1 ? "s" : ""}`;
}
function fmt(d) {
  if (!d) return "";
  const p = d.split("-");
  return `${p[2]}/${p[1]}/${p[0]}`;
}
