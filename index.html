      <div style={{padding:"0 14px 14px",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
        {[{l:"Score moyen",v:avg+"/100",c:scoreColor(avg)},{l:"Total NC",v:totalNC,c:C.red},{l:"Validées",v:validated.length,c:C.green}].map(function(s,i){

                    <button onClick={function(){
                      var url=window.location.origin+"/rapport.html?site="+encodeURIComponent(ins.site);
                      var qrUrl="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="+encodeURIComponent(url)+"&ecc=H&margin=10";

                  </div>

                </div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{padding:"14px 14px 0"}}>
        <div style={{...S.card(C.purple+"33")}}>
          <div style={{fontSize:14,fontWeight:800,marginBottom:4}}>📊 Tableau global</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Toutes inspections · scores pénalisés</div>
          <button onClick={function(){
            try{
              var bySite={};
              validated.forEach(function(ins){
                if(!bySite[ins.site]) bySite[ins.site]=[];
                bySite[ins.site].push(ins);

              var sites=Object.keys(bySite).sort();
              var appName=(config&&config.appName)||"SECURA";
              var tableRows="";

                var siteIns=bySite[site].sort(function(a,b){return b.date.localeCompare(a.date);});
                var siteAvg=Math.round(siteIns.reduce(function(s,i){return s+i.score;},0)/siteIns.length);
                var siteCol=scoreColor(siteAvg);
                tableRows+="<tr class='site-header'><td colspan='12'><div class='site-name'>📍 "+site+"</div><div class='site-stats'>"+siteIns.length+" audit(s) · Score moyen : <span style='color:"+siteCol+";font-weight:900'>"+siteAvg+"/100</span></div></td></tr>";
                siteIns.forEach(function(ins){
                  num++;
                  var ncC=(ins.items||[]).filter(function(x){return !x.ok&&(x.poids||x.p)==="critique";}).length;
                  var ncE=(ins.items||[]).filter(function(x){return !x.ok&&(x.poids||x.p)==="eleve";}).length;
                  var ncM=(ins.items||[]).filter(function(x){return !x.ok&&(x.poids||x.p)==="mineur";}).length;
                  var pen=ncC*(PENALITE.critique||5)+ncE*(PENALITE.eleve||3)+ncM*(PENALITE.mineur||1);
                  tableRows+="<tr><td>"+num+"</td><td>"+ins.titre+"</td><td>"+ins.site+"</td><td>"+ins.categorie+"</td><td>"+ins.inspecteur+"</td><td>"+fmt(ins.date)+"</td><td style='font-weight:900;color:"+scoreColor(ins.score)+"'>"+ins.score+"/100</td><td style='color:#FF1744'>-"+pen+"pts</td><td>"+ncC+"</td><td>"+ncE+"</td><td>"+ncM+"</td><td>"+ins.statut+"</td></tr>";
                });
                // Détail NC du site
                var siteNCs=[];
                siteIns.forEach(function(ins){
                  (ins.items||[]).forEach(function(it){
                    if(!it.ok){
                      var p=it.poids||it.p||"mineur";
                      siteNCs.push({label:it.l,poids:p,resp:it.resp||"—",comment:it.comment||"",categorie:ins.categorie,date:ins.date});
                    }
                  });
                });
                if(siteNCs.length>0){
                  tableRows+="<tr><td colspan='12' style='padding:0'><table style='width:100%;border-collapse:collapse;margin:0'><tr><th style='background:#1a0a0a;color:#FF5555;padding:6px 8px;font-size:9px;text-align:left'>NC</th><th style='background:#1a0a0a;color:#FF5555;padding:6px 8px;font-size:9px;text-align:left'>Criticité</th><th style='background:#1a0a0a;color:#FF5555;padding:6px 8px;font-size:9px;text-align:left'>Catégorie</th><th style='background:#1a0a0a;color:#FF5555;padding:6px 8px;font-size:9px;text-align:left'>Responsable</th><th style='background:#1a0a0a;color:#FF5555;padding:6px 8px;font-size:9px;text-align:left'>Remarques</th></tr>";
                  siteNCs.forEach(function(nc){
                    var col=nc.poids==="critique"?"#FF1744":nc.poids==="eleve"?"#FF6D00":"#FFB300";
                    tableRows+="<tr><td style='padding:5px 8px;font-size:10px;border-bottom:1px solid #f0f0f0'>"+nc.label+"</td><td style='padding:5px 8px;font-size:10px;border-bottom:1px solid #f0f0f0;color:"+col+";font-weight:700'>"+poidsLabel(nc.poids)+"</td><td style='padding:5px 8px;font-size:10px;border-bottom:1px solid #f0f0f0;color:#888'>"+nc.categorie+"</td><td style='padding:5px 8px;font-size:10px;border-bottom:1px solid #f0f0f0;font-weight:600'>"+nc.resp+"</td><td style='padding:5px 8px;font-size:10px;border-bottom:1px solid #f0f0f0;color:#666;font-style:italic'>"+(nc.comment||"—")+"</td></tr>";
                  });
                  tableRows+="</table></td></tr>";
                }
              });
              var html="<!DOCTYPE html><html><head><meta charset='utf-8'><title>"+appName+" - Rapport Global</title><style>"
                +"body{font-family:Segoe UI,sans-serif;padding:32px;max-width:1100px;margin:0 auto;font-size:12px}"
                +".header{background:linear-gradient(135deg,#07090F,#0D1825);color:#fff;padding:20px 24px;border-radius:8px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}"
                +".header h1{font-size:20px;letter-spacing:4px;color:#00E5FF;margin:0}"
                +".header .sub{font-size:11px;color:#8899aa;margin-top:3px}"
                +".header .date{font-size:11px;color:#aab}"
                +".stats{display:flex;gap:16px;margin-bottom:20px}"
                +".stat-box{flex:1;background:#f5f8fc;border:1px solid #e0e8f0;border-radius:8px;padding:12px;text-align:center}"
                +".stat-val{font-size:24px;font-weight:900}"
                +".stat-label{font-size:10px;color:#888;margin-top:4px}"
                +"table{width:100%;border-collapse:collapse;margin-top:8px}"
                +"th{background:#0D1825;color:#00E5FF;padding:9px 8px;text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase}"
                +"td{padding:7px 8px;border-bottom:1px solid #eee;font-size:11px}"
                +"tr:hover{background:#f8fafc}"
                +".site-header td{background:linear-gradient(135deg,#f0f4fa,#e8eef6);padding:12px;border-bottom:2px solid #00E5FF}"
                +".site-name{font-size:14px;font-weight:800;color:#07090F}"
                +".site-stats{font-size:11px;color:#666;margin-top:2px}"
                +".footer{margin-top:24px;padding-top:10px;border-top:2px solid #07090F;font-size:10px;color:#888;display:flex;justify-content:space-between}"
                +"@media print{.header{-webkit-print-color-adjust:exact;print-color-adjust:exact}th,.site-header td{-webkit-print-color-adjust:exact;print-color-adjust:exact}}"
                +"</style></head><body>"
                +"<div class='header'><div><h1>"+appName+"</h1><div class='sub'>RAPPORT GLOBAL - TOUS LES AUDITS</div></div><div class='date'>"+new Date().toLocaleDateString("fr-BE",{day:"2-digit",month:"long",year:"numeric"})+"</div></div>"
                +"<div class='stats'><div class='stat-box'><div class='stat-val' style='color:"+scoreColor(avg)+"'>"+avg+"/100</div><div class='stat-label'>Score moyen</div></div><div class='stat-box'><div class='stat-val' style='color:#FF1744'>"+totalNC+"</div><div class='stat-label'>Total NC</div></div><div class='stat-box'><div class='stat-val' style='color:#00C853'>"+validated.length+"</div><div class='stat-label'>Audits valides</div></div><div class='stat-box'><div class='stat-val'>"+sites.length+"</div><div class='stat-label'>Sites</div></div></div>"
                +"<table><tr><th>#</th><th>Titre</th><th>Site</th><th>Categ.</th><th>Inspecteur</th><th>Date</th><th>Score</th><th>Penalite</th><th>NC C.</th><th>NC E.</th><th>NC M.</th><th>Statut</th></tr>"+tableRows+"</table>"
                +"<div class='footer'><div><strong>"+appName+"</strong> · Rapport genere le "+new Date().toLocaleDateString("fr-BE",{day:"2-digit",month:"long",year:"numeric"})+"</div><div>Document confidentiel</div></div>"
                +"</body></html>";
              setReportHTML(html);

}


function SettingsScreen({user,onLogout,appState,onAppStateUpdate,respsState,sitesState,config,onConfigUpdate}){
  const rc={Admin:C.red,Inspecteur:C.cyan,Responsable:C.green};
  const [tab,setTab]=useState("equipe");
  const [savedMsg,setSavedMsg]=useState(false);
  const [newSite,setNewSite]=useState("");
  const [newResp,setNewResp]=useState("");
  const [newRespEmail,setNewRespEmail]=useState("");
  const [newRespPass,setNewRespPass]=useState("");
  const [newRespRole,setNewRespRole]=useState("Inspecteur");
  const newRespRef=useRef(null);
  const newRespEmailRef=useRef(null);
  const newRespPassRef=useRef(null);
  const newSiteRef=useRef(null);

  // Read directly from dedicated state props
  const resps=respsState||RESPONSABLES_DEFAULT;
  const sites=sitesState||SITES_DEFAULT;
  const penalites=(appState&&appState.penalites)||{critique:5,eleve:3,mineur:1};
  const delais=(appState&&appState.delais)||{critique:0,eleve:60,mineur:120};

  const update=(patch)=>{
    const next={sites,resps,penalites,delais,customTemplates:appState&&appState.customTemplates||{},siteAddresses:appState&&appState.siteAddresses||{},...patch};
    SITES.length=0; next.sites.forEach(function(s){SITES.push(s);});
    RESPONSABLES.length=0; next.resps.forEach(function(r){RESPONSABLES.push(r);});
    if(onAppStateUpdate) onAppStateUpdate(next);
  };

  const addResp=()=>{
    const nom=(newRespRef.current?newRespRef.current.value:newResp).trim();
    if(!nom) return;
    const email=(newRespEmailRef.current?newRespEmailRef.current.value:newRespEmail).trim()||nom.toLowerCase().replace(/ /g,".")+"."+Date.now()+"@secura.be";
    const pass=(newRespPassRef.current?newRespPassRef.current.value:newRespPass).trim()||"1234";
    const newUser={nom,email,pass,role:newRespRole,avatar:nom.split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase()};
    update({resps:[...resps,newUser]});
    setNewResp(""); setNewRespEmail(""); setNewRespPass(""); setNewRespRole("Inspecteur");
    if(newRespRef.current) newRespRef.current.value="";
    if(newRespEmailRef.current) newRespEmailRef.current.value="";
    if(newRespPassRef.current) newRespPassRef.current.value="";
  };
  const addSite=()=>{
    const val=(newSiteRef.current?newSiteRef.current.value:newSite).trim();
    if(!val) return;
    update({sites:[...sites,val]});
    setNewSite("");
    if(newSiteRef.current) newSiteRef.current.value="";
  };
  const removeResp=(i)=>{
    var nom=resps[i]&&resps[i].nom?resps[i].nom:"cet utilisateur";
    if(!confirm("Supprimer "+nom+" de l'équipe ?\n\nCette action est irréversible.")) return;
    update({resps:resps.filter(function(_,j){return j!==i;})});
  };
  const removeSite=(i)=>{
    var site=sites[i]||"ce site";
    if(!confirm("Supprimer le site \""+site+"\" ?\n\nCette action est irréversible.")) return;
    update({sites:sites.filter(function(_,j){return j!==i;})});
  };
  const setPen=(k,v)=>update({penalites:{...penalites,[k]:v===""?"":parseInt(v)||0}});
  const setDel=(k,v)=>update({delais:{...delais,[k]:v===""?"":parseInt(v)||0}});

  const save=()=>{
    const pendingResp=(newRespRef.current?newRespRef.current.value:newResp).trim();
    const pendingSite=(newSiteRef.current?newSiteRef.current.value:newSite).trim();
    var finalResps=pendingResp?[...resps,pendingResp]:resps;
    var finalSites=pendingSite?[...sites,pendingSite]:sites;
    if(pendingResp){ setNewResp(""); if(newRespRef.current) newRespRef.current.value=""; }
    if(pendingSite){ setNewSite(""); if(newSiteRef.current) newSiteRef.current.value=""; }
    PENALITE.critique=penalites.critique; PENALITE.eleve=penalites.eleve; PENALITE.mineur=penalites.mineur;
    DELAIS.critique=delais.critique; DELAIS.eleve=delais.eleve; DELAIS.mineur=delais.mineur;
    // Save everything to Supabase via update()
    update({sites:finalSites, resps:finalResps, penalites:penalites, delais:delais});
    setSavedMsg(true);
    setTimeout(function(){setSavedMsg(false);},2500);
  };

  const ac=(config&&config.accentColor)||C.cyan;
  const tabStyle=(t)=>({padding:"8px 16px",borderRadius:10,border:"none",cursor:"pointer",fontSize:12,fontWeight:tab===t?800:500,background:tab===t?ac+"18":"transparent",color:tab===t?ac:C.muted});

  return (
    <div style={{paddingBottom:88}}>
      <div style={{padding:"20px 16px 10px"}}>
        <div style={{fontSize:20,fontWeight:900}}>Profil & Paramètres</div>
      </div>
      <div style={{margin:"0 14px 14px",...S.card(),textAlign:"center",padding:20}}>
        <div style={{width:56,height:56,borderRadius:99,background:C.cyan+"18",border:"2px solid "+C.cyan+"44",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,fontWeight:900,color:C.cyan,margin:"0 auto 8px"}}>{user.avatar}</div>
        <div style={{fontSize:16,fontWeight:900}}>{user.nom}</div>
        <div style={{fontSize:11,color:C.muted,marginTop:2}}>{user.email}</div>
        <div style={{marginTop:6}}><Tag label={user.role} color={rc[user.role]||C.muted}/></div>
      </div>
      <div style={{padding:"0 14px 12px",display:"flex",gap:6,overflowX:"auto"}}>
        <button style={tabStyle("equipe")} onClick={()=>setTab("equipe")}>👥 Équipe</button>
        <button style={tabStyle("sites")} onClick={()=>setTab("sites")}>📍 Sites</button>
        <button style={tabStyle("systeme")} onClick={()=>setTab("systeme")}>⚙️ Système</button>
        <button style={tabStyle("apparence")} onClick={()=>setTab("apparence")}>🎨 Style</button>
        {user.role==="Admin"&&<button style={tabStyle("permissions")} onClick={()=>setTab("permissions")}>🔐 Accès</button>}
      </div>
      <div style={{padding:"0 14px"}}>
        {tab==="permissions"&&user.role==="Admin"&&<PermissionsScreen config={config} onConfigUpdate={onConfigUpdate} onBack={function(){setTab("equipe");}}/>}
        {tab==="equipe"&&(
          <div style={{...S.card(),marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:13,fontWeight:800}}>Équipe</div>
              <div style={{fontSize:10,color:C.cyan,background:C.cyan+"18",padding:"2px 8px",borderRadius:99}}>{resps.length} membres</div>
            </div>
            {resps.map(function(r,i){
              var nom=typeof r==="object"?r.nom:r;
              var email=typeof r==="object"?r.email:"";
              var role=typeof r==="object"?(r.role||"Inspecteur"):"Inspecteur";
              var initials=nom.split(" ").map(function(n){return n[0];}).join("").slice(0,2).toUpperCase();
              return (
                <div key={i} style={{padding:"8px 0",borderBottom:"1px solid "+C.border}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{width:28,height:28,borderRadius:99,background:C.cyan+"15",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:900,color:C.cyan,flexShrink:0}}>{initials}</div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:700}}>{nom}</div>
                      {email&&<div style={{fontSize:10,color:C.muted}}>{email}</div>}
                    </div>
                    <div style={{fontSize:10,color:C.muted,marginRight:8}}>{role}</div>
                    <button onClick={()=>removeResp(i)} style={{background:"transparent",border:"none",color:C.red,cursor:"pointer",fontSize:16,padding:"0 4px"}}>×</button>
                  </div>
                </div>
              );
            })}
            <div style={{marginTop:14,padding:12,background:C.surface,borderRadius:10,border:"1px dashed "+C.border}}>

var ACC_CAUSES=["Chute de hauteur","Chute de plain-pied","Manutention manuelle","Machine/Outil","Contact chimique","Projection","Choc/Coincement","Électrique","Brûlure","Circulation","Agression","Autre"];
var ACC_STATUTS=["Enseignement","Ouvriers","Employés","Techniciennes de surface","Puéricultrices","Aides-familiales","Autre"];
var ACC_PARTIES=["Tête","Yeux","Oreilles","Visage","Cou","Épaule gauche","Épaule droite","Bras gauche","Bras droit","Coude gauche","Coude droit","Avant-bras gauche","Avant-bras droit","Poignet gauche","Poignet droit","Main gauche","Main droite","Doigt(s) main gauche","Doigt(s) main droite","Thorax","Abdomen","Dos (lombaires)","Dos (dorsales)","Dos (cervicales)","Bassin","Hanche gauche","Hanche droite","Cuisse gauche","Cuisse droite","Genou gauche","Genou droit","Jambe gauche","Jambe droite","Cheville gauche","Cheville droite","Pied gauche","Pied droit","Orteil(s)","Organes internes","Lésions multiples","Corps entier","Autre"];

function AccidentScreen({appState,onAppStateUpdate,sitesState,config}){
  var accidents=appState&&appState.accidents||[];
  var siteList=(sitesState&&sitesState.length>0)?sitesState:SITES;
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({date:new Date().toISOString().split("T")[0],dateReception:"",site:siteList[0]||"",type:ACC_TYPES[0],cause:ACC_CAUSES[0],statut:ACC_STATUTS[0],partieCorps:ACC_PARTIES[0],victime:"",joursArret:0,description:"",actionsPrises:"",gravite:"mineur"});
  const [tab,setTab]=useState("kpi");
  const [siteFilter,setSiteFilter]=useState("Tous");
  const [reportHTML,setReportHTML]=useState(null);
  var appName=(config&&config.appName)||"SECURA";

  function exportFiche(a){
    var col=a.gravite==="critique"?"#FF1744":a.gravite==="eleve"?"#FF6D00":"#FFB300";
    var gravLabel=a.gravite==="critique"?"GRAVE":a.gravite==="eleve"?"ÉLEVÉ":"MINEUR";
    var html="<!DOCTYPE html><html><head><meta charset='utf-8'><title>Fiche Accident</title><style>"
      +"body{font-family:Segoe UI,Arial,sans-serif;padding:0;font-size:12px;color:#1a1a2e}"
      +".page{max-width:700px;margin:0 auto;padding:24px 32px}"
      +".hdr{background:linear-gradient(135deg,#07090F,#1a0508);color:#fff;padding:20px 32px;display:flex;justify-content:space-between;align-items:center}"
      +".hdr h1{font-size:18px;letter-spacing:3px;color:#FF1744;margin:0}.hdr .sub{font-size:11px;color:#aa8888;margin-top:3px}"
      +".hdr .ref{font-size:10px;color:#aab;text-align:right}"
      +".meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#f5f8fc;padding:18px;border-radius:10px;margin:20px 0;border:1px solid #e0e8f0}"
      +".meta .item .label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:#888;margin-bottom:3px}"
      +".meta .item .value{font-size:13px;font-weight:700}"
      +".grav-box{text-align:center;margin:20px 0}"
      +".grav{display:inline-block;padding:8px 24px;border-radius:10px;font-size:16px;font-weight:900}"
      +".section{margin:20px 0}"
      +".section h2{font-size:13px;font-weight:800;padding:8px 14px;border-radius:6px;margin-bottom:8px}"
      +".section h2.desc{border-left:4px solid #00E5FF;background:#f0f8ff;color:#003366}"
      +".section h2.actions{border-left:4px solid #00C853;background:#f0fff4;color:#006622}"
      +".section .content{padding:12px 16px;background:#fafbfc;border:1px solid #e0e8f0;border-radius:8px;line-height:1.7;font-size:12px;min-height:50px}"
      +".footer{margin-top:30px;padding:14px 0;border-top:2px solid #07090F;display:flex;justify-content:space-between;font-size:10px;color:#888}"
      +"@media print{.hdr,.grav{-webkit-print-color-adjust:exact;print-color-adjust:exact}}"
      +"</style></head><body>"
      +"<div class='hdr'><div><h1>"+appName+"</h1><div class='sub'>FICHE D'ACCIDENT DU TRAVAIL</div></div><div class='ref'>REF : ACC-"+String(a.id).slice(-6)+"<br/>"+new Date().toLocaleDateString("fr-BE",{day:"2-digit",month:"long",year:"numeric"})+"</div></div>"
      +"<div class='page'>"
      +"<div class='meta'>"
      +"<div class='item'><div class='label'>Date de l'accident</div><div class='value'>"+fmt(a.date)+"</div></div>"
      +"<div class='item'><div class='label'>Date de reception</div><div class='value'>"+(a.dateReception?fmt(a.dateReception):"—")+"</div></div>"
      +"<div class='item'><div class='label'>Site</div><div class='value'>"+(a.site||"—")+"</div></div>"
      +"<div class='item'><div class='label'>Victime</div><div class='value'>"+(a.victime||"—")+"</div></div>"
      +"<div class='item'><div class='label'>Fonction / Statut</div><div class='value'>"+(a.statut||"—")+"</div></div>"
      +"<div class='item'><div class='label'>Type d'accident</div><div class='value'>"+a.type+"</div></div>"
      +"<div class='item'><div class='label'>Cause</div><div class='value'>"+a.cause+"</div></div>"
      +"<div class='item'><div class='label'>Partie du corps touchee</div><div class='value'>"+(a.partieCorps||"—")+"</div></div>"
      +"<div class='item'><div class='label'>Jours d'arret</div><div class='value' style='color:#FF1744;font-size:16px'>"+(a.joursArret||0)+" jour(s)</div></div>"
      +"<div class='item'><div class='label'>Gravite</div><div class='value' style='color:"+col+";font-size:16px'>"+gravLabel+"</div></div>"
      +"</div>"
      +"<div class='grav-box'><span class='grav' style='background:"+col+"18;color:"+col+";border:2px solid "+col+"'>"+gravLabel+" — "+(a.joursArret||0)+" jour(s) d'arret</span></div>"
      +"<div class='section'><h2 class='desc'>Description de l'accident</h2><div class='content'>"+(a.description||"Aucune description renseignee.")+"</div></div>"
      +"<div class='section'><h2 class='actions'>Actions correctives prises</h2><div class='content'>"+(a.actionsPrises||"Aucune action renseignee.")+"</div></div>"
      +"<div class='footer'><div><strong>"+appName+"</strong> · Fiche generee le "+new Date().toLocaleDateString("fr-BE",{day:"2-digit",month:"long",year:"numeric"})+"</div><div>Document confidentiel</div></div>"
      +"</div></body></html>";
    setReportHTML(html);
  }

  function resetForm(){setForm({date:new Date().toISOString().split("T")[0],dateReception:"",site:siteList[0]||"",type:ACC_TYPES[0],cause:ACC_CAUSES[0],statut:ACC_STATUTS[0],partieCorps:ACC_PARTIES[0],victime:"",joursArret:0,description:"",actionsPrises:"",gravite:"mineur"});setEditId(null);}

  function saveAcc(){
    var acc={...form,id:editId||Date.now(),joursArret:parseInt(form.joursArret)||0};
    var next;
    if(editId){next=accidents.map(function(a){return a.id===editId?acc:a;});}
    else{next=[acc].concat(accidents);}
    onAppStateUpdate({...appState,accidents:next});
    resetForm();setShowForm(false);
  }

  function deleteAcc(id){
    if(!confirm("Supprimer cet accident ?\n\nCette action est irréversible.")) return;
    onAppStateUpdate({...appState,accidents:accidents.filter(function(a){return a.id!==id;})});
  }

  function editAcc(a){setForm({...a});setEditId(a.id);setShowForm(true);}

  // Filtrage
  var fAccidents=siteFilter==="Tous"?accidents:accidents.filter(function(a){return a.site===siteFilter;});
  var sorted=[].concat(fAccidents).sort(function(a,b){return b.date.localeCompare(a.date);});

  // KPIs
  var today=new Date();today.setHours(0,0,0,0);
  var totalAT=fAccidents.filter(function(a){return a.type==="AT avec arrêt"||a.type==="AT sans arrêt";}).length;
  var totalATArret=fAccidents.filter(function(a){return a.type==="AT avec arrêt";}).length;
  var totalJours=fAccidents.reduce(function(s,a){return s+(parseInt(a.joursArret)||0);},0);
  var totalPresque=fAccidents.filter(function(a){return a.type==="Presqu'accident";}).length;

  // Jours sans accident par site
  var joursSansAcc=siteList.map(function(site){
    var siteAcc=accidents.filter(function(a){return a.site===site&&(a.type==="AT avec arrêt"||a.type==="AT sans arrêt");});
    if(siteAcc.length===0) return {site:site,jours:null};
    var lastDate=siteAcc.sort(function(a,b){return b.date.localeCompare(a.date);})[0].date;
    var p=lastDate.split("-");var ld=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));ld.setHours(0,0,0,0);
    return {site:site,jours:Math.floor((today-ld)/86400000)};
  }).sort(function(a,b){if(a.jours===null) return 1;if(b.jours===null) return -1;return b.jours-a.jours;});

  // Taux de fréquence et gravité (heures globales toutes catégories)
  var heuresCat=appState&&appState.heuresPresteesParCat||{};
  var totalHeures=0;
  Object.values(heuresCat).forEach(function(h){totalHeures+=parseInt(h)||0;});
  var tf=totalHeures>0?Math.round((totalATArret*1000000/totalHeures)*100)/100:null;
  var tg=totalHeures>0?Math.round((totalJours*1000/totalHeures)*100)/100:null;

  // Répartition par cause
  var byCause={};
  fAccidents.forEach(function(a){if(!byCause[a.cause])byCause[a.cause]=0;byCause[a.cause]++;});
  var causesSorted=Object.entries(byCause).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  var maxCause=causesSorted.length>0?causesSorted[0][1]:1;

  // Évolution mensuelle (12 derniers mois)
  var months=[];
  for(var mi=11;mi>=0;mi--){
    var d=new Date(today.getFullYear(),today.getMonth()-mi,1);
    var key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    var label=d.toLocaleDateString("fr-BE",{month:"short",year:"2-digit"});
    var count=fAccidents.filter(function(a){return a.date&&a.date.substring(0,7)===key;}).length;
    months.push({key:key,label:label,count:count});
  }
  var maxMonth=Math.max.apply(null,months.map(function(m){return m.count;}))||1;

  var tabStyle=function(t){return {padding:"6px 14px",borderRadius:99,border:"1px solid",borderColor:tab===t?C.cyan:C.border,background:tab===t?C.cyan+"15":"transparent",color:tab===t?C.cyan:C.muted,fontSize:11,fontWeight:tab===t?800:500,cursor:"pointer"};};

  return (
    <div style={{paddingBottom:90}}>
      {reportHTML&&(
        <div style={{position:"fixed",inset:0,zIndex:300,background:"#fff",display:"flex",flexDirection:"column"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 14px",background:"#0A0C13",borderBottom:"1px solid #1E2433",flexShrink:0}}>
            <button onClick={function(){setReportHTML(null);}} style={{background:"transparent",border:"1px solid "+C.cyan+"44",borderRadius:10,padding:"7px 12px",color:C.cyan,cursor:"pointer",fontSize:12,fontWeight:700}}>← Fermer</button>
            <div style={{flex:1,fontSize:13,fontWeight:700,color:"#fff"}}>Fiche accident</div>
            <button onClick={function(){
              var w=window.open("","_blank");
              if(!w)return;
              w.document.write(reportHTML+"<script src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'><\/script><script>window.onload=function(){setTimeout(function(){html2pdf().set({margin:0.3,filename:'fiche-accident.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true},jsPDF:{unit:'in',format:'a4',orientation:'portrait'}}).from(document.body).save().then(function(){setTimeout(function(){window.close();},2000);});},800);}<\/script>");
              w.document.close();
            }} style={{background:"linear-gradient(135deg,"+C.cyan+",#007799)",border:"none",borderRadius:8,padding:"7px 12px",color:"#000",cursor:"pointer",fontSize:11,fontWeight:800}}>📥 PDF</button>
          </div>
          <iframe srcDoc={reportHTML} style={{flex:1,border:"none",width:"100%"}} title="Fiche accident"/>
        </div>
      )}
      <div style={{padding:"20px 16px 12px",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><div style={{fontSize:20,fontWeight:900}}>🩹 Accidentologie</div><div style={{fontSize:12,color:C.muted,marginTop:2}}>{accidents.length} accident(s) enregistré(s)</div></div>
        <button onClick={function(){resetForm();setShowForm(!showForm);}} style={{background:showForm?"transparent":"linear-gradient(135deg,"+C.cyan+",#007799)",border:showForm?"1px solid "+C.border:"none",borderRadius:12,padding:"9px 14px",color:showForm?C.muted:"#000",fontWeight:800,fontSize:12,cursor:"pointer"}}>{showForm?"✕ Annuler":"+ Déclarer"}</button>
      </div>

      {/* Filtre par site */}
      <div style={{padding:"0 14px 10px",display:"flex",gap:6,overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
        {["Tous"].concat(siteList).map(function(s){var active=siteFilter===s;return <button key={s} onClick={function(){setSiteFilter(s);}} style={{flexShrink:0,padding:"5px 12px",borderRadius:99,border:"1px solid",borderColor:active?C.cyan:C.border,background:active?C.cyan+"15":"transparent",color:active?C.cyan:C.muted,fontSize:10,fontWeight:active?800:500,cursor:"pointer"}}>{s==="Tous"?"🏢 Tous":s}</button>;})}
      </div>

      {/* Formulaire */}
      {showForm&&(
        <div style={{margin:"0 14px 14px",...S.card(C.cyan+"22")}}>
          <div style={{fontSize:14,fontWeight:800,marginBottom:12,color:C.cyan}}>{editId?"✏️ Modifier":"📝 Déclarer un accident"}</div>
          <label style={S.label}>Date de l&#39;accident</label>
          <input type="date" value={form.date} onChange={function(e){setForm({...form,date:e.target.value});}} style={{...S.input,marginBottom:10}}/>
          <label style={S.label}>Date de réception de la déclaration</label>
          <input type="date" value={form.dateReception||""} onChange={function(e){setForm({...form,dateReception:e.target.value});}} style={{...S.input,marginBottom:10}}/>
          <label style={S.label}>Nom et prénom de la victime</label>
          <input type="text" value={form.victime} onChange={function(e){setForm({...form,victime:e.target.value});}} placeholder="Ex : Dupont Jean" style={{...S.input,marginBottom:10}}/>
          <label style={S.label}>Site</label>
          <select value={form.site} onChange={function(e){setForm({...form,site:e.target.value});}} style={{...S.input,marginBottom:10}}>{siteList.map(function(s){return <option key={s} value={s}>{s}</option>;})}</select>
          <label style={S.label}>Type</label>
          <select value={form.type} onChange={function(e){setForm({...form,type:e.target.value});}} style={{...S.input,marginBottom:10}}>{ACC_TYPES.map(function(t){return <option key={t} value={t}>{t}</option>;})}</select>
          <label style={S.label}>Statut / Fonction</label>
          <select value={form.statut} onChange={function(e){setForm({...form,statut:e.target.value});}} style={{...S.input,marginBottom:10}}>{ACC_STATUTS.map(function(s){return <option key={s} value={s}>{s}</option>;})}</select>
          <label style={S.label}>Cause</label>
          <select value={form.cause} onChange={function(e){setForm({...form,cause:e.target.value});}} style={{...S.input,marginBottom:10}}>{ACC_CAUSES.map(function(c){return <option key={c} value={c}>{c}</option>;})}</select>
          <label style={S.label}>Partie du corps touchée</label>
          <select value={form.partieCorps} onChange={function(e){setForm({...form,partieCorps:e.target.value});}} style={{...S.input,marginBottom:10}}>{ACC_PARTIES.map(function(p){return <option key={p} value={p}>{p}</option>;})}</select>
          <label style={S.label}>Gravité</label>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            {[["mineur","Mineur",C.amber],["eleve","Élevé",C.orange],["critique","Grave",C.red]].map(function(g){var active=form.gravite===g[0];return <button key={g[0]} onClick={function(){setForm({...form,gravite:g[0]});}} style={{flex:1,padding:"8px",borderRadius:8,border:"1px solid "+(active?g[2]:C.border),background:active?g[2]+"18":"transparent",color:active?g[2]:C.muted,fontSize:12,fontWeight:active?800:400,cursor:"pointer"}}>{g[1]}</button>;})}
          </div>
          <label style={S.label}>Jours d&#39;arrêt</label>
          <input type="number" min="0" value={form.joursArret} onChange={function(e){setForm({...form,joursArret:e.target.value});}} style={{...S.input,marginBottom:10}}/>
          <label style={S.label}>Description</label>
          <textarea value={form.description} onChange={function(e){setForm({...form,description:e.target.value});}} placeholder="Circonstances de l'accident..." style={{...S.input,minHeight:60,resize:"vertical",marginBottom:10}}/>
          <label style={S.label}>Actions correctives prises</label>
          <textarea value={form.actionsPrises} onChange={function(e){setForm({...form,actionsPrises:e.target.value});}} placeholder="Mesures prises suite à l'accident..." style={{...S.input,minHeight:50,resize:"vertical",marginBottom:14}}/>
          <button onClick={saveAcc} style={{...S.btn(C.cyan)}}>{editId?"💾 Modifier":"+ Enregistrer l'accident"}</button>
        </div>
      )}

      {/* Tabs */}
      <div style={{padding:"0 14px 12px",display:"flex",gap:6}}>
        <button style={{...tabStyle("kpi"),flex:1,textAlign:"center"}} onClick={function(){setTab("kpi");}}>Indicateurs</button>
        <button style={{...tabStyle("liste"),flex:1,textAlign:"center"}} onClick={function(){setTab("liste");}}>Liste ({sorted.length})</button>
        <button style={{...tabStyle("evolution"),flex:1,textAlign:"center"}} onClick={function(){setTab("evolution");}}>Évolution</button>
      </div>

      {/* KPI */}
      {tab==="kpi"&&(
        <div style={{padding:"0 14px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
            <div style={{...S.card(),textAlign:"center"}}><div style={{fontSize:28,fontWeight:900,color:C.red}}>{totalAT}</div><div style={{fontSize:10,color:C.muted}}>Accidents du travail</div></div>
            <div style={{...S.card(),textAlign:"center"}}><div style={{fontSize:28,fontWeight:900,color:C.orange}}>{totalJours}</div><div style={{fontSize:10,color:C.muted}}>Jours d&#39;arrêt</div></div>
            <div style={{...S.card(),textAlign:"center"}}><div style={{fontSize:28,fontWeight:900,color:C.amber}}>{totalPresque}</div><div style={{fontSize:10,color:C.muted}}>Presqu&#39;accidents</div></div>
            <div style={{...S.card(),textAlign:"center"}}><div style={{fontSize:28,fontWeight:900,color:C.cyan}}>{tf!==null?tf:"—"}</div><div style={{fontSize:10,color:C.muted}}>Taux fréquence (Tf)</div></div>
          </div>
          {tf===null&&<div style={{padding:"8px 12px",background:C.orange+"12",border:"1px solid "+C.orange+"33",borderRadius:10,marginBottom:14,fontSize:11,color:C.orange}}>⚠️ Configurez les heures prestées par catégorie dans Profil → Système pour calculer le Tf et Tg</div>}

          {/* Jours sans accident par site */}
          <div style={{...S.card(),marginBottom:14}}>
            <div style={{fontSize:14,fontWeight:800,marginBottom:10}}>🏆 Jours sans accident</div>
            {joursSansAcc.map(function(s,i){
              var col=s.jours===null?C.green:s.jours>365?C.green:s.jours>90?C.cyan:s.jours>30?C.amber:C.red;
              return (
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<joursSansAcc.length-1?"1px solid "+C.dim:"none"}}>
                  <div style={{width:38,height:38,borderRadius:10,background:col+"15",border:"1px solid "+col+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:col,flexShrink:0}}>{s.jours===null?"∞":s.jours}</div>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:700}}>{s.site}</div><div style={{fontSize:10,color:C.muted}}>{s.jours===null?"Aucun accident enregistré":"jours sans AT"}</div></div>
                </div>
              );
            })}
          </div>

        </div>
      )}

      {/* Liste */}
      {tab==="liste"&&(
        <div style={{padding:"0 14px"}}>
          {sorted.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:C.muted}}><div style={{fontSize:36,marginBottom:12}}>✅</div><div style={{fontSize:14,fontWeight:700}}>Aucun accident enregistré</div></div>}
          {sorted.map(function(a,i){
            var col=a.gravite==="critique"?C.red:a.gravite==="eleve"?C.orange:C.amber;
            var typeIcon=a.type==="AT avec arrêt"?"🚑":a.type==="AT sans arrêt"?"🩹":a.type==="Presqu'accident"?"⚠️":"📋";
            return (
              <div key={a.id} style={{...S.card(),marginBottom:10}}>
                <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
                  <div style={{width:38,height:38,borderRadius:10,background:col+"15",border:"1px solid "+col+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{typeIcon}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                      <span style={{fontSize:13,fontWeight:800}}>{a.type}</span>
                      <span style={{fontSize:10,color:C.muted}}>{fmt(a.date)}</span>
                    </div>
                    {a.victime&&<div style={{fontSize:12,fontWeight:600,marginBottom:3,color:C.text}}>👤 {a.victime}</div>}
                    <div style={{fontSize:11,color:C.muted,marginBottom:4}}>📍 {a.site} · {a.cause}{a.partieCorps?" · 🦴 "+a.partieCorps:""}{a.statut?" · "+a.statut:""}{a.dateReception?" · 📨 Reçu le "+fmt(a.dateReception):""}</div>
                    {a.description&&<div style={{fontSize:12,lineHeight:1.4,marginBottom:4}}>{a.description}</div>}
                    <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
                      <span style={{fontSize:9,padding:"2px 7px",borderRadius:5,background:col+"18",color:col,fontWeight:800}}>{a.gravite==="critique"?"GRAVE":a.gravite==="eleve"?"ÉLEVÉ":"MINEUR"}</span>
                      {a.joursArret>0&&<span style={{fontSize:9,padding:"2px 7px",borderRadius:5,background:C.red+"18",color:C.red,fontWeight:800}}>{a.joursArret}j arrêt</span>}
                      {a.actionsPrises&&<span style={{fontSize:9,padding:"2px 7px",borderRadius:5,background:C.green+"18",color:C.green,fontWeight:800}}>Actions prises</span>}
                    </div>
                  </div>
                </div>
                <div style={{display:"flex",gap:6,marginTop:10,justifyContent:"flex-end"}}>
                  <button onClick={function(){exportFiche(a);}} style={{background:"transparent",border:"1px solid "+C.purple+"44",borderRadius:8,padding:"5px 12px",color:C.purple,cursor:"pointer",fontSize:10,fontWeight:700}}>📄 Fiche</button>

          {/* Accidents par catégorie de personnel */}
          {(function(){

            var byStatut={};
            fAccidents.forEach(function(a){
              var s=a.statut||"Non renseigné";
              if(!byStatut[s]) byStatut[s]={total:0,causes:{}};
              byStatut[s].total++;
              var c=a.cause||"Autre";
              if(!byStatut[s].causes[c]) byStatut[s].causes[c]=0;
              byStatut[s].causes[c]++;
            });
            var entries=Object.entries(byStatut).sort(function(a,b){return b[1].total-a[1].total;});
            if(entries.length===0) return null;
            var maxVal=entries[0][1].total;

                    <div key={i} style={{marginBottom:14}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>

                      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                        {causesArr.map(function(ca,j){

                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })()}

          {/* Accidents par cause */}
          {(function(){
            var causeColors={"Chute de hauteur":"#FF1744","Chute de plain-pied":"#FF5252","Manutention manuelle":"#FF6D00","Machine/Outil":"#FFB300","Contact chimique":"#7C3AFF","Projection":"#00E5FF","Choc/Coincement":"#FF4081","Électrique":"#FFEA00","Brûlure":"#FF3D00","Circulation":"#00BFA5","Agression":"#D500F9","Autre":"#78909C"};
            var byCause={};
            fAccidents.forEach(function(a){var c=a.cause||"Autre";if(!byCause[c])byCause[c]=0;byCause[c]++;});
            var entries=Object.entries(byCause).sort(function(a,b){return b[1]-a[1];});
            if(entries.length===0) return null;
            var maxVal=entries[0][1];
            return (
              <div style={{...S.card(),marginBottom:14}}>
                <div style={{fontSize:14,fontWeight:800,marginBottom:12}}>🔍 Répartition par cause</div>
                {entries.map(function(e,i){
                  var name=e[0],count=e[1];
                  var pct=Math.round(count/maxVal*100);
                  var col=causeColors[name]||"#888";
                  return (
                    <div key={i} style={{marginBottom:10}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                        <span style={{fontSize:11,fontWeight:600,flex:1}}>{name}</span>

                      <div style={{background:C.dim,borderRadius:99,height:6,overflow:"hidden"}}>
                        <div style={{width:pct+"%",height:"100%",background:col,borderRadius:99,transition:"width .6s"}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════════════
function App(){
  const [user,setUser]=useState(null);
  const [screen,setScreen]=useState("dashboard");
  const [sub,setSub]=useState(null);
  const [openIns,setOpenIns]=useState(null);
  const [inspections,setInspections]=useState(initInspections);
  const [actions,setActions]=useState(initActions);
  const [darkMode,setDarkMode]=useState(true);
  const [splash,setSplash]=useState(true);
  const [dbReady,setDbReady]=useState(false);
  const [syncMsg,setSyncMsg]=useState(null);
  const [isOnline,setIsOnline]=useState(typeof navigator!=="undefined"?navigator.onLine:true);

  // ── Online/Offline detection ─────────────────────────────────
  React.useEffect(function(){
    function goOnline(){
      setIsOnline(true);
      setSyncMsg("🔄 Synchronisation...");
      // Sync pending items
      var pending=LS.getPending();
      if(pending.length>0){
        Promise.all(pending.map(function(p){
          if(p.type==="upsert_inspection") return supa.upsert("inspections",p.data).catch(function(){});
          if(p.type==="upsert_action") return supa.upsert("actions",p.data).catch(function(){});
          if(p.type==="del_action") return supa.del("actions",p.data.id).catch(function(){});
          return Promise.resolve();
        })).then(function(){
          LS.clearPending();
          setSyncMsg("✅ Synchronisé !");
          setTimeout(function(){setSyncMsg(null);},3000);
        });
      } else {
        setSyncMsg(null);
      }
    }
    function goOffline(){ setIsOnline(false); setSyncMsg("📵 Hors-ligne — données sauvegardées localement"); }
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return function(){
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  },[]);

  // ── Supabase: load on mount ──────────────────────────────────
  React.useEffect(function(){
    async function loadFromDB(){
      try{
        // Load inspections with limit to avoid 500 errors (photos are heavy)
        var ins=await supa.get("inspections",{order:"updated_at.desc",limit:50});
        // Retry once with smaller limit if first attempt failed
        if(!ins) ins=await supa.get("inspections",{order:"updated_at.desc",limit:20});
        var acts=await supa.get("actions",{order:"echeance.asc"});
        var cfg=await supa.get("app_config",{eq:{col:"id",val:"default"}});
        // Inspections: Supabase ou localStorage
        if(ins&&ins.length){
          setInspections(ins.map(function(i){
            return {...i,
              items:i.items||[],
              sigInspecteur:i.sigInspecteur||i["sig_inspecteur"]||null,
              sigResponsable:i.sigResponsable||i["sig_responsable"]||null
            };
          }));
          LS.save("inspections", ins);
        } else {
          var localInsFb=LS.load("inspections");
          if(localInsFb&&localInsFb.length) setInspections(localInsFb.map(function(i){return {...i,items:i.items||[]};}));
        }
        var deletedIds=LS.load("deletedActionIds")||[];
        if(acts&&acts.length){
          var activeActs=acts.filter(function(a){
            return a.statut!=="Clôturée" && deletedIds.indexOf(String(a.id))===-1;
          });
          setActions(activeActs);
          LS.save("actions", activeActs);
        } else {
          var localActsFallback=LS.load("actions")||[];
          var activeLocal=localActsFallback.filter(function(a){
            return a.statut!=="Clôturée" && deletedIds.indexOf(String(a.id))===-1;
          });
          setActions(activeLocal);
        }
        if(cfg&&cfg[0]){
          var c=cfg[0];
          if(c.resps&&c.resps.length){ setRespsState(c.resps); }
          if(c.sites&&c.sites.length){ setSitesState(c.sites); }
          if(c.config&&Object.keys(c.config).length) setConfig(c.config);
          if(c.penalites){ PENALITE.critique=c.penalites.critique; PENALITE.eleve=c.penalites.eleve; PENALITE.mineur=c.penalites.mineur; }
          if(c.delais){ DELAIS.critique=c.delais.critique; DELAIS.eleve=c.delais.eleve; DELAIS.mineur=c.delais.mineur; }
          setAppState(function(prev){
            return {
              ...prev,
              resps:c.resps&&c.resps.length?c.resps:prev.resps,
              sites:c.sites&&c.sites.length?c.sites:prev.sites,
              penalites:c.penalites||prev.penalites,
              delais:c.delais||prev.delais,
              customTemplates:c["customtemplates"]||c["custom_templates"]||c.customTemplates||LS.load("customTemplates")||prev.customTemplates||{},
              siteAddresses:c["siteaddresses"]||c.siteAddresses||prev.siteAddresses||{},
              accidents:c.accidents||prev.accidents||[],
              heuresPresteesParCat:c["heuresprestees"]||prev.heuresPresteesParCat||{},
            };
          });
          LS.save("config", cfg[0]);
          LS.save("appState", c);
        } else {
          var localCfgFb=LS.load("config");
          if(localCfgFb){
            if(localCfgFb.resps&&localCfgFb.resps.length) setRespsState(localCfgFb.resps);
            if(localCfgFb.sites&&localCfgFb.sites.length) setSitesState(localCfgFb.sites);
            if(localCfgFb.config&&Object.keys(localCfgFb.config).length) setConfig(localCfgFb.config);
          }
          var localAcc=LS.load("accidents");
          var localH=LS.load("heuresPresteesParCat");
          if(localAcc||localH){setAppState(function(prev){return {...prev,accidents:localAcc||prev.accidents,heuresPresteesParCat:localH||prev.heuresPresteesParCat};});}
        }
        setDbReady(true);
      }catch(e){
        console.error("DB load error — loading from localStorage:",e);
        // Fallback to localStorage
        var localIns=LS.load("inspections");
        var localActs=LS.load("actions");
        var localCfg=LS.load("config");
        if(localIns&&localIns.length) setInspections(localIns.map(function(i){return {...i,items:i.items||[]};}));
        if(localActs&&localActs.length){
          var deletedIds2=LS.load("deletedActionIds")||[];
          var localActive=localActs.filter(function(a){
            return a.statut!=="Clôturée" && deletedIds2.indexOf(String(a.id))===-1;
          });
          setActions(localActive);
        }
        if(localCfg){
          var c=localCfg;
          if(c.resps&&c.resps.length) setRespsState(c.resps);
          if(c.sites&&c.sites.length) setSitesState(c.sites);
          if(c.config&&Object.keys(c.config).length) setConfig(c.config);
        }
        var localAccidents=LS.load("accidents");
        var localHeures=LS.load("heuresPresteesParCat");
        if(localAccidents||localHeures){
          setAppState(function(prev){return {...prev,accidents:localAccidents||prev.accidents,heuresPresteesParCat:localHeures||prev.heuresPresteesParCat};});
        }
        setDbReady(true);
        setSyncMsg("📵 Chargement local — reconnectez-vous pour synchroniser");
      }
    }
    loadFromDB();
  },[]);
  const [config,setConfig]=useState({
    appName:"SECURA",
    accentColor:"#00E5FF",
    fontFamily:"DM Sans,Segoe UI,sans-serif",
    fontSize:15,
    darkMode:true,
    cardRadius:18,
    compactMode:false,
    daltonMode:"normal",
    notificationsEnabled:false,
    rappelDelai:7,
    techMode:false,
    seuilSites:{vert:90,jaune:120,rouge:365},
    permissions:{
      Inspecteur:{dashboard:true,inspections:true,actions:true,rapports:false,rappels:false,settings:false,ia:false,accidents:false},
      Responsable:{dashboard:true,inspections:false,actions:true,rapports:false,rappels:false,settings:false,ia:false,accidents:false}
    },
  });
  const [appState,setAppState]=useState({sites:SITES_DEFAULT,resps:RESPONSABLES_DEFAULT,penalites:{critique:5,eleve:3,mineur:1},delais:{critique:0,eleve:60,mineur:120},customTemplates:{},siteAddresses:{},accidents:[],heuresPresteesParCat:{}});
  const [respsState,setRespsState]=useState([...RESPONSABLES_DEFAULT]);
  const [sitesState,setSitesState]=useState([...SITES_DEFAULT]);
  async function handleAppStateUpdate(s){
    // Always merge with current state to avoid overwriting fields
    var merged={...appState,...s};
    setAppState(merged);
    if(merged.resps) setRespsState(merged.resps);
    if(merged.sites) setSitesState(merged.sites);
    // Save everything to Supabase
    var payload={
      id:"default",
      resps:merged.resps||respsState,
      sites:merged.sites||sitesState,
      penalites:merged.penalites||appState.penalites,
      delais:merged.delais||appState.delais,
    };
    if(merged.siteAddresses) payload["siteaddresses"]=merged.siteAddresses;
    if(merged.customTemplates&&Object.keys(merged.customTemplates).length>0){
      payload["customtemplates"]=merged.customTemplates;
    }
    if(merged.accidents) payload["accidents"]=merged.accidents;
    if(merged.heuresPresteesParCat) payload["heuresprestees"]=merged.heuresPresteesParCat;
    try{ await supa.upsert("app_config",payload); }catch(e){console.error("appState save error:",e);}
    // Also save to localStorage as backup
    if(merged.accidents) LS.save("accidents",merged.accidents);
    if(merged.heuresPresteesParCat) LS.save("heuresPresteesParCat",merged.heuresPresteesParCat);
    LS.save("appState", merged);
    LS.save("customTemplates", merged.customTemplates||{});
  }

  async function saveConfig(cfg){
    setConfig(cfg);
    try{
      await supa.upsert("app_config",{id:"default",config:cfg});
    }catch(e){console.error(e);}
  };

  const isTech=!!(config&&config.techMode);
  var techBg=C.bg;
  if(config&&config.techMode==="bordeaux") techBg="linear-gradient(160deg,#0D0508 0%,#1A0A10 30%,#2D0F1A 60%,#1A0A10 100%)";
  else if(config&&config.techMode==="ocean") techBg="linear-gradient(160deg,#040810 0%,#081420 30%,#0A1A2D 60%,#081420 100%)";
  else if(config&&config.techMode==="beton") techBg="linear-gradient(160deg,#0D0D0F 0%,#161618 30%,#1E1E22 60%,#161618 100%)";
  const bg=isTech?techBg:darkMode?C.bg:"#F0F4FA";
  const daltonFilter=(config&&config.daltonMode)==="deuteranopie"?"url(#dalton-deut)"
    :(config&&config.daltonMode)==="protanopie"?"url(#dalton-prot)"
    :(config&&config.daltonMode)==="tritanopie"?"url(#dalton-trit)"
    :"none";
  const appStyle={...S.app,
    background:bg,
    color:darkMode?C.text:"#1A1E2E",
    fontFamily:(config&&config.fontFamily)||"DM Sans,Segoe UI,sans-serif",
    fontSize:(config&&config.fontSize)||15,
    zoom:(config&&config.textZoom)||1,
    filter:daltonFilter,
  };

  const nav=(dest)=>{
    if(dest==="new-inspection"){setSub("new-inspection");return;}
    if(dest==="quick-visit"){setSub("quick-visit");return;}
    if(dest==="comparison"){setSub("comparison");return;}
    setScreen(dest);setSub(null);
  };
  const openDetail=(ins)=>{setOpenIns(ins);setSub("detail");};
  async function saveNew(ins){
    setInspections(function(p){return [ins].concat(p);});
    // Always save to localStorage immediately
    LS.save("inspections",[ins].concat(inspections));
    setScreen("inspections");setSub(null);
    if(isOnline){
      try{ await supa.upsert("inspections",mapInspection(ins)); }catch(e){
        console.error(e);
        LS.addPending("upsert_inspection",ins);
      }
    } else {
      LS.addPending("upsert_inspection",ins);
      setSyncMsg("📵 Sauvegardé localement — sera synchronisé dès la reconnexion");
    }
    var ncItems=(ins.items||[]).filter(function(it){return !it.ok;});
    if(ncItems.length>0){
      var dynDel=appState&&appState.delais?appState.delais:DELAIS;
      var newActs=ncItems.map(function(nc){
        var p=nc.poids||nc.p||"mineur";
        var prio=p==="critique"?"CRITIQUE":p==="eleve"?"ÉLEVÉE":"MODÉRÉE";
        var days=dynDel[p]!=null?Number(dynDel[p]):DELAIS[p]||120;
        var d=new Date();
        if(days>0) d.setDate(d.getDate()+days);
        // Use inspectionId+ncId as unique key to prevent regeneration
        return {id:Date.now()+Math.floor(Math.random()*9999),label:nc.l,site:ins.site,prio:prio,statut:"En cours",echeance:d.toISOString().split("T")[0],retard:false,resp:nc.resp||"",inspectionId:ins.id,ncId:nc.id};
      });
      setActions(function(prev){
        // Deduplicate by inspectionId+ncId to avoid regenerating deleted actions
        var existKeys=prev.map(function(a){return (a.inspectionId||"")+"__"+(a.ncId||a.label+"__"+a.site);});
        var toAdd=newActs.filter(function(a){return existKeys.indexOf(a.inspectionId+"__"+a.ncId)===-1;});
        return prev.concat(toAdd);
      });
      newActs.forEach(function(a){
        supa.upsert("actions",mapAction(a)).catch(function(e){console.error(e);});
      });
    }
  }
  async function updateIns(ins){
    var updated=inspections.map(function(i){return i.id===ins.id?ins:i;});
    setInspections(function(){return updated;});
    LS.save("inspections",updated);
    // Mettre à jour openIns pour refléter les changements sans fermer l'écran
    setOpenIns(ins);
    // Generate actions from new NC items (that don't already have an action)
    var ncItems=(ins.items||[]).filter(function(it){return !it.ok&&!it.na;});
    if(ncItems.length>0){
      var dynDel=appState&&appState.delais?appState.delais:DELAIS;
      var deletedIds=LS.load("deletedActionIds")||[];
      setActions(function(prev){
        // Build multiple dedup keys to catch all duplicates
        var existByKey={}; 
        prev.forEach(function(a){
          // Key 1: inspectionId + ncId
          existByKey[String(a.inspectionId||"")+"__"+String(a.ncId||"")]=true;
          // Key 2: label + site (legacy)
          existByKey[(a.label||"")+"__"+(a.site||"")]=true;
        });
        var toAdd=[];
        ncItems.forEach(function(nc){
          var k1=String(ins.id)+"__"+String(nc.id);
          var k2=(nc.l||"")+"__"+(ins.site||"");
          // Skip if action already exists (any key match)
          if(existByKey[k1]) return;
          if(existByKey[k2]) return;
          // Skip if explicitly deleted
          if(deletedIds.indexOf(k1)>=0) return;
          var p=nc.poids||nc.p||"mineur";
          var prio=p==="critique"?"CRITIQUE":p==="eleve"?"ÉLEVÉE":"MODÉRÉE";
          var days=dynDel[p]!=null?Number(dynDel[p]):DELAIS[p]||120;
          var d=new Date();
          if(days>0) d.setDate(d.getDate()+days);
          var newAct={id:Date.now()+Math.floor(Math.random()*9999),label:nc.l,site:ins.site,prio:prio,statut:"En cours",echeance:d.toISOString().split("T")[0],retard:false,resp:nc.resp||"",inspectionId:ins.id,ncId:nc.id};
          toAdd.push(newAct);
          supa.upsert("actions",mapAction(newAct)).catch(function(e){console.error(e);});
        });
        if(toAdd.length===0) return prev;
        var allActs=prev.concat(toAdd);
        LS.save("actions",allActs);
        return allActs;
      });
    }
    if(isOnline){
      try{
        var patchBody={"statut":ins.statut,"score":ins.score,"nc":ins.nc,"notes":ins.notes||""};
        if(ins.sigInspecteur) patchBody["sig_inspecteur"]=ins.sigInspecteur;
        if(ins.sigResponsable) patchBody["sig_responsable"]=ins.sigResponsable;
        if(ins.items) patchBody["items"]=ins.items;
        var r=await fetch(SUPA_URL+"/rest/v1/inspections?id=eq."+String(ins.id),{
          method:"PATCH",
          headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
          body:JSON.stringify(patchBody)
        });
        if(!r.ok){
          var errText=await r.text();
          console.error("PATCH failed:",r.status,errText);
        } else {
          console.log("PATCH ok:",ins.id,"statut:",ins.statut);
        }
      }catch(e){
        console.error("updateIns error:",e);
        LS.addPending("upsert_inspection",ins);
      }
    } else {
      LS.addPending("upsert_inspection",ins);
    }
    if(ins.statut==="Validée") setSub(null);
  }
  async function updateAct(a){
    if(a.statut==="Clôturée"){
      var filtered=actions.filter(function(x){return x.id!==a.id;});
      setActions(function(){return filtered;});
      LS.save("actions",filtered);
      // Track deleted ID to prevent regeneration on reload
      var deletedIds=LS.load("deletedActionIds")||[];
      if(deletedIds.indexOf(String(a.id))===-1){ deletedIds.push(String(a.id)); }
      LS.save("deletedActionIds",deletedIds);
      if(isOnline){
        try{ await supa.del("actions",a.id); }catch(e){ LS.addPending("del_action",{id:a.id}); }
      } else {
        LS.addPending("del_action",{id:a.id});
      }
    } else {
      var updated2=actions.map(function(x){return x.id===a.id?a:x;});
      setActions(function(){return updated2;});
      LS.save("actions",updated2);
      if(isOnline){
        try{ await supa.upsert("actions",mapAction(a)); }catch(e){ LS.addPending("upsert_action",a); }
      } else {
        LS.addPending("upsert_action",a);
      }
    }
  }
  async function deleteIns(id){
    setInspections(p=>p.filter(i=>i.id!==id));
    try{ await supa.del("inspections",id); }catch(e){console.error(e);}
  };
  const pending=actions.filter(a=>a.statut!=="Clôturée").length;

  // ── Notifications - check due actions ───────────────────────
  React.useEffect(function(){
    if(!config||!config.notificationsEnabled) return undefined;
    if(!("Notification" in window)||Notification.permission!=="granted") return undefined;
    var today=new Date(); today.setHours(0,0,0,0);
    actions.filter(function(a){return a.statut!=="Clôturée"&&a.echeance;}).forEach(function(a){
      var due=new Date(a.echeance); due.setHours(0,0,0,0);
      var diff=Math.ceil((due-today)/(1000*60*60*24));
      var notifKey="secura_notif_"+a.id+"_"+a.echeance;
      if(localStorage.getItem(notifKey)) return;
      var title="",body="";
      if(diff<0){ title="🚨 Action en retard — "+a.site; body=a.label+" ("+Math.abs(diff)+"j de retard)"; }
      else if(diff===0){ title="🔴 À traiter aujourd'hui — "+a.site; body=a.label; }
      else if(diff===1){ title="⚠️ Urgente demain — "+a.site; body=a.label; }
      else if(diff<=3){ title="⏰ Dans "+diff+" jours — "+a.site; body=a.label; }
      if(title){ try{ new Notification(title,{body:body,icon:"/icon-192.png"}); localStorage.setItem(notifKey,"1"); }catch(e){} }
    });
    return undefined;
  },[actions,config]);

  // Show loading while DB loads
  if(!dbReady) return (
    <div style={{...S.app,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,background:"#07090F"}}>
      <div style={{width:48,height:48,border:"3px solid #00E5FF33",borderTop:"3px solid #00E5FF",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{color:"#00E5FF",fontSize:14,fontWeight:700}}>Connexion Supabase...</div>
    </div>
  );



  if(splash) return (
    <div style={{background:"#07090F",minHeight:"100vh"}}>
      <SplashScreen onDone={()=>setSplash(false)} appName={config.appName} accent={config.accentColor}/>
    </div>
  );
  if(!user) return <div style={appStyle}><InjectCSS/><LoginScreen onLogin={setUser} config={config} users={respsState}/></div>;

  return (
    <div style={appStyle}>
      <InjectCSS/>
      {syncMsg&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:9998,background:isOnline?C.green+"EE":C.red+"EE",color:"#fff",fontSize:12,fontWeight:700,padding:"8px 16px",textAlign:"center",letterSpacing:0.5}}>
          {syncMsg}
        </div>
      )}
      {!isOnline&&!syncMsg&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:9998,background:C.amber+"EE",color:"#000",fontSize:11,fontWeight:700,padding:"6px 16px",textAlign:"center"}}>
          📵 Hors-ligne — modifications sauvegardées localement
        </div>
      )}
      <svg style={{position:"absolute",width:0,height:0}} aria-hidden="true">
        <defs>
          <filter id="dalton-deut">
            <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
          </filter>
          <filter id="dalton-prot">
            <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
          </filter>
          <filter id="dalton-trit">
            <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/>
          </filter>
        </defs>
      </svg>
      {sub==="detail"&&openIns&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <InspectionDetailScreen inspection={openIns} onBack={()=>setSub(null)} onUpdate={updateIns} resps={respsState} sitesState={sitesState}/>
        </div>
      )}
      {sub==="new-inspection"&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <NewInspectionScreen user={user} onSave={saveNew} onBack={()=>setSub(null)} resps={respsState} sitesState={sitesState} customTemplates={appState.customTemplates||{}} siteAddresses={appState.siteAddresses||{}} onSaveTemplate={function(cat,items){handleAppStateUpdate({...appState,customTemplates:{...(appState.customTemplates||{}),[cat]:items},sites:sitesState,resps:respsState});}}/>
        </div>
      )}
      {sub==="quick-visit"&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <QuickVisitScreen user={user} onSave={saveNew} onBack={()=>setSub(null)} sitesState={sitesState}/>
        </div>
      )}
      {sub==="comparison"&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <ComparisonScreen inspections={inspections} onBack={()=>setSub(null)}/>
        </div>
      )}
      <div style={{overflowY:"auto",height:"100vh",paddingBottom:70}}>
        {screen==="dashboard"   &&<DashboardScreen user={user} inspections={inspections} actions={actions} onNav={nav} config={config} sitesState={sitesState} appState={appState}/>}
        {screen==="inspections" &&<InspectionsScreen inspections={inspections} onOpen={openDetail} onNav={nav} onDelete={deleteIns} user={user} config={config}/>}
        {screen==="actions"     &&<ActionsScreen actions={actions} onUpdate={updateAct} resps={respsState} config={config} onConfigUpdate={saveConfig} user={user}/>}
        {screen==="accidents"   &&<AccidentScreen appState={appState} onAppStateUpdate={handleAppStateUpdate} sitesState={sitesState} config={config}/>}
        {screen==="rapports"    &&<RapportsScreen inspections={inspections} onDelete={deleteIns} config={config}/>}
        {screen==="settings"    &&<SettingsScreen user={user} onLogout={()=>{setUser(null);setScreen("dashboard");}} config={config} onConfigUpdate={saveConfig} appState={appState} respsState={respsState} sitesState={sitesState} onAppStateUpdate={handleAppStateUpdate}/>}
      </div>
      <BottomNav active={screen} onChange={setScreen} badge={pending} user={user} config={config}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App, null));
  </script>
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(registrations){
        registrations.forEach(function(sw){sw.unregister();});
      });
      caches.keys().then(function(names){
        names.forEach(function(name){caches.delete(name);});
      });
    }
  </script>
</body>
</html>
