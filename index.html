// PERMISSIONS SCREEN — gestion des accès par rôle (Admin uniquement)
// ═══════════════════════════════════════════════════════════════════════
function PermissionsScreen({config,onConfigUpdate,onBack}){
  var defaultPerms={
    Inspecteur:{dashboard:true,inspections:true,actions:true,rapports:false,rappels:false,settings:false},
    Responsable:{dashboard:true,inspections:false,actions:true,rapports:false,rappels:false,settings:false}
  };
  const [perms,setPerms]=useState(config&&config.permissions?JSON.parse(JSON.stringify(config.permissions)):defaultPerms);
  const [saved,setSaved]=useState(false);

  var features=[
    {k:"dashboard",  l:"Tableau de bord",      icon:"🏠"},
    {k:"inspections",l:"Audits",                icon:"📋"},
    {k:"actions",    l:"Actions",               icon:"⚡"},
    {k:"rapports",   l:"Rapports",              icon:"📄"},
    {k:"rappels",    l:"Rappels email",         icon:"📧"},
    {k:"settings",   l:"Profil & Paramètres",  icon:"👤"},
  ];
  var roles=["Inspecteur","Responsable"];

  function toggle(role,feature){
    var newPerms=JSON.parse(JSON.stringify(perms));
    if(!newPerms[role]) newPerms[role]={};
    newPerms[role][feature]=!newPerms[role][feature];
    setPerms(newPerms);
    var newConfig=Object.assign({},config,{permissions:newPerms});
    onConfigUpdate(newConfig);
    setSaved(true);
    setTimeout(function(){setSaved(false);},2000);
  }

  return (
    <div style={{paddingBottom:88}}>
      <div style={{padding:"20px 16px 12px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={onBack} style={{background:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"8px 12px",color:C.cyan,cursor:"pointer",fontSize:13,fontWeight:700}}>← Retour</button>
        <div style={{flex:1}}><div style={{fontSize:18,fontWeight:900}}>🔐 Permissions</div><div style={{fontSize:11,color:C.muted}}>Accès par rôle — Admin a toujours tous les droits</div></div>
        {saved&&<span style={{fontSize:11,color:C.green,fontWeight:700}}>✓ Sauvegardé</span>}
      </div>
      <div style={{margin:"0 14px",padding:"10px 14px",background:C.cyan+"12",border:"1px solid "+C.cyan+"33",borderRadius:12,marginBottom:14}}>
        <div style={{fontSize:12,color:C.cyan}}>💡 Les modifications sont appliquées immédiatement à la prochaine connexion.</div>
      </div>
      {roles.map(function(role,ri){
        var rolePerms=perms[role]||{};
        var roleCol=role==="Inspecteur"?C.cyan:C.purple;
        return (
          <div key={ri} style={{...S.card(),margin:"0 14px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,paddingBottom:12,borderBottom:"1px solid "+C.border}}>
              <div style={{width:38,height:38,borderRadius:11,background:roleCol+"18",border:"1px solid "+roleCol+"33",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>{role==="Inspecteur"?"🔍":"👤"}</div>
              <div><div style={{fontSize:15,fontWeight:800}}>{role}</div><div style={{fontSize:11,color:C.muted}}>{Object.values(rolePerms).filter(Boolean).length} accès actifs</div></div>
            </div>
            {features.map(function(f,fi){
              var active=!!rolePerms[f.k];
              return (
                <div key={fi} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:fi<features.length-1?"1px solid "+C.dim:"none"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{fontSize:16,width:24,textAlign:"center"}}>{f.icon}</span>
                    <span style={{fontSize:13,fontWeight:active?700:400,color:active?C.text:C.muted}}>{f.l}</span>
                  </div>
                  <button onClick={function(){toggle(role,f.k);}}
                    style={{width:46,height:26,borderRadius:99,background:active?roleCol:C.border,border:"none",cursor:"pointer",transition:"background .2s",position:"relative",flexShrink:0}}>
                    <div style={{position:"absolute",top:3,left:active?22:3,width:20,height:20,borderRadius:99,background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.3)"}}/>
                  </button>
                </div>
              );
            })}
          </div>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════════════════
function App(){
  const [user,setUser]=useState(null);
  const [screen,setScreen]=useState("dashboard");
  const [sub,setSub]=useState(null);
  const [openIns,setOpenIns]=useState(null);
  const [inspections,setInspections]=useState(initInspections);
  const [actions,setActions]=useState(initActions);
  const [darkMode,setDarkMode]=useState(true);
  const [splash,setSplash]=useState(true);
  const [dbReady,setDbReady]=useState(false);
  const [syncMsg,setSyncMsg]=useState(null);
  const [isOnline,setIsOnline]=useState(typeof navigator!=="undefined"?navigator.onLine:true);

  // ── Online/Offline detection ─────────────────────────────────
  React.useEffect(function(){
    function goOnline(){
      setIsOnline(true);
      setSyncMsg("🔄 Synchronisation...");
      // Sync pending items
      var pending=LS.getPending();
      if(pending.length>0){
        Promise.all(pending.map(function(p){
          if(p.type==="upsert_inspection") return supa.upsert("inspections",p.data).catch(function(){});
          if(p.type==="upsert_action") return supa.upsert("actions",p.data).catch(function(){});
          if(p.type==="del_action") return supa.del("actions",p.data.id).catch(function(){});
          return Promise.resolve();
        })).then(function(){
          LS.clearPending();
          setSyncMsg("✅ Synchronisé !");
          setTimeout(function(){setSyncMsg(null);},3000);
        });
      } else {
        setSyncMsg(null);
      }
    }
    function goOffline(){ setIsOnline(false); setSyncMsg("📵 Hors-ligne — données sauvegardées localement"); }
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return function(){
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  },[]);

  // ── Supabase: load on mount ──────────────────────────────────
  React.useEffect(function(){
    async function loadFromDB(){
      try{
        // Try Supabase first
        const [ins, acts, cfg] = await Promise.all([
          supa.get("inspections",{order:"updated_at.desc"}),
          supa.get("actions",{order:"echeance.asc"}),
          supa.get("app_config",{eq:{col:"id",val:"default"}}),
        ]);
        if(ins&&ins.length){
          setInspections(ins.map(function(i){
            return {...i,
              items:i.items||[],
              sigInspecteur:i.sigInspecteur||i["sig_inspecteur"]||null,
              sigResponsable:i.sigResponsable||i["sig_responsable"]||null
            };
          }));
          LS.save("inspections", ins);
        }
        var deletedIds=LS.load("deletedActionIds")||[];
        if(acts&&acts.length){
          // Supabase has actions - use them, filter deleted ones
          var activeActs=acts.filter(function(a){
            return a.statut!=="Clôturée" && deletedIds.indexOf(String(a.id))===-1;
          });
          setActions(activeActs);
          LS.save("actions", activeActs);
        } else {
          // Supabase empty - use localStorage but still filter deleted
          var localActsFallback=LS.load("actions")||[];
          var activeLocal=localActsFallback.filter(function(a){
            return a.statut!=="Clôturée" && deletedIds.indexOf(String(a.id))===-1;
          });
          setActions(activeLocal);
        }
        if(cfg&&cfg[0]){
          var c=cfg[0];
          if(c.resps&&c.resps.length){ setRespsState(c.resps); }
          if(c.sites&&c.sites.length){ setSitesState(c.sites); }
          if(c.config&&Object.keys(c.config).length){
            setConfig(function(prev){
              return Object.assign({},prev,c.config);
            });
          }
          if(c.penalites){ PENALITE.critique=c.penalites.critique; PENALITE.eleve=c.penalites.eleve; PENALITE.mineur=c.penalites.mineur; }
          if(c.delais){ DELAIS.critique=c.delais.critique; DELAIS.eleve=c.delais.eleve; DELAIS.mineur=c.delais.mineur; }
          // Load appState with all fields
          setAppState(function(prev){
            return {
              ...prev,
              resps:c.resps&&c.resps.length?c.resps:prev.resps,
              sites:c.sites&&c.sites.length?c.sites:prev.sites,
              penalites:c.penalites||prev.penalites,
              delais:c.delais||prev.delais,
              customTemplates:c["customtemplates"]||c["custom_templates"]||c.customTemplates||LS.load("customTemplates")||prev.customTemplates||{},
              siteAddresses:c["siteaddresses"]||c.siteAddresses||prev.siteAddresses||{},
            };
          });
          LS.save("config", cfg[0]);
          LS.save("appState", c);
        }
        setDbReady(true);
      }catch(e){
        console.error("DB load error — loading from localStorage:",e);
        // Fallback to localStorage
        var localIns=LS.load("inspections");
        var localActs=LS.load("actions");
        var localCfg=LS.load("config");
        if(localIns&&localIns.length) setInspections(localIns.map(function(i){return {...i,items:i.items||[]};}));
        if(localActs&&localActs.length){
          var deletedIds2=LS.load("deletedActionIds")||[];
          var localActive=localActs.filter(function(a){
            return a.statut!=="Clôturée" && deletedIds2.indexOf(String(a.id))===-1;
          });
          setActions(localActive);
        }
        if(localCfg){
          var c=localCfg;
          if(c.resps&&c.resps.length) setRespsState(c.resps);
          if(c.sites&&c.sites.length) setSitesState(c.sites);
          if(c.config&&Object.keys(c.config).length) setConfig(c.config);
        }
        setDbReady(true);
        setSyncMsg("📵 Chargement local — reconnectez-vous pour synchroniser");
      }
    }
    loadFromDB();
  },[]);
  const [config,setConfig]=useState({
    appName:"SECURA",
    accentColor:"#00E5FF",
    fontFamily:"DM Sans,Segoe UI,sans-serif",
    fontSize:15,
    darkMode:true,
    cardRadius:18,
    compactMode:false,
    daltonMode:"normal",
    notificationsEnabled:false,
    rappelDelai:7,
    permissions:{
      Inspecteur:{dashboard:true,inspections:true,actions:true,rapports:false,rappels:false,settings:false},
      Responsable:{dashboard:true,inspections:false,actions:true,rapports:false,rappels:false,settings:false}
    },
  });
  const [appState,setAppState]=useState({sites:SITES_DEFAULT,resps:RESPONSABLES_DEFAULT,penalites:{critique:5,eleve:3,mineur:1},delais:{critique:0,eleve:60,mineur:120},customTemplates:{},siteAddresses:{}});
  const [respsState,setRespsState]=useState([...RESPONSABLES_DEFAULT]);
  const [sitesState,setSitesState]=useState([...SITES_DEFAULT]);
  async function handleAppStateUpdate(s){
    // Always merge with current state to avoid overwriting fields
    var merged={...appState,...s};
    setAppState(merged);
    if(merged.resps) setRespsState(merged.resps);
    if(merged.sites) setSitesState(merged.sites);
    // Save everything to Supabase
    var payload={
      id:"default",
      resps:merged.resps||respsState,
      sites:merged.sites||sitesState,
      penalites:merged.penalites||appState.penalites,
      delais:merged.delais||appState.delais,
    };
    if(merged.siteAddresses) payload["siteaddresses"]=merged.siteAddresses;
    if(merged.customTemplates&&Object.keys(merged.customTemplates).length>0){
      payload["customtemplates"]=merged.customTemplates;
    }
    try{ await supa.upsert("app_config",payload); }catch(e){console.error("appState save error:",e);}
    // Also save to localStorage as backup
    LS.save("appState", merged);
    LS.save("customTemplates", merged.customTemplates||{});
  }

  async function saveConfig(cfg){
    var merged=Object.assign({},config,cfg);
    setConfig(merged);
    LS.save("config",{config:merged});
    try{
      await supa.upsert("app_config",{id:"default",config:merged});
    }catch(e){console.error(e);}
  };

  const bg=darkMode?C.bg:"#F0F4FA";
  const daltonFilter=(config&&config.daltonMode)==="deuteranopie"?"url(#dalton-deut)"
    :(config&&config.daltonMode)==="protanopie"?"url(#dalton-prot)"
    :(config&&config.daltonMode)==="tritanopie"?"url(#dalton-trit)"
    :"none";
  const appStyle={...S.app,
    background:bg,
    color:darkMode?C.text:"#1A1E2E",
    fontFamily:(config&&config.fontFamily)||"DM Sans,Segoe UI,sans-serif",
    fontSize:(config&&config.fontSize)||15,
    filter:daltonFilter,
  };

  const nav=(dest)=>{
    if(dest==="new-inspection"){setSub("new-inspection");return;}
    if(dest==="quick-visit"){setSub("quick-visit");return;}
    if(dest==="comparison"){setSub("comparison");return;}
    setScreen(dest);setSub(null);
  };
  const openDetail=(ins)=>{setOpenIns(ins);setSub("detail");};
  async function saveNew(ins){
    setInspections(function(p){return [ins].concat(p);});
    // Always save to localStorage immediately
    LS.save("inspections",[ins].concat(inspections));
    setScreen("inspections");setSub(null);
    if(isOnline){
      try{ await supa.upsert("inspections",mapInspection(ins)); }catch(e){
        console.error(e);
        LS.addPending("upsert_inspection",ins);
      }
    } else {
      LS.addPending("upsert_inspection",ins);
      setSyncMsg("📵 Sauvegardé localement — sera synchronisé dès la reconnexion");
    }
    var ncItems=(ins.items||[]).filter(function(it){return !it.ok;});
    if(ncItems.length>0){
      var dynDel=appState&&appState.delais?appState.delais:DELAIS;
      var newActs=ncItems.map(function(nc){
        var p=nc.poids||nc.p||"mineur";
        var prio=p==="critique"?"CRITIQUE":p==="eleve"?"ÉLEVÉE":"MODÉRÉE";
        var days=dynDel[p]!=null?Number(dynDel[p]):DELAIS[p]||120;
        var d=new Date();
        if(days>0) d.setDate(d.getDate()+days);
        // Use inspectionId+ncId as unique key to prevent regeneration
        return {id:Date.now()+Math.floor(Math.random()*9999),label:nc.l,site:ins.site,prio:prio,statut:"En cours",echeance:d.toISOString().split("T")[0],retard:false,resp:nc.resp||"",inspectionId:ins.id,ncId:nc.id};
      });
      setActions(function(prev){
        // Deduplicate by inspectionId+ncId to avoid regenerating deleted actions
        var existKeys=prev.map(function(a){return (a.inspectionId||"")+"__"+(a.ncId||a.label+"__"+a.site);});
        var toAdd=newActs.filter(function(a){return existKeys.indexOf(a.inspectionId+"__"+a.ncId)===-1;});
        return prev.concat(toAdd);
      });
      newActs.forEach(function(a){
        supa.upsert("actions",mapAction(a)).catch(function(e){console.error(e);});
      });
    }
  }
  async function updateIns(ins){
    var updated=inspections.map(function(i){return i.id===ins.id?ins:i;});
    setInspections(function(){return updated;});
    LS.save("inspections",updated);
    // Generate actions from new NC items (that don't already have an action)
    var ncItems=(ins.items||[]).filter(function(it){return !it.ok&&!it.na;});
    if(ncItems.length>0){
      var dynDel=appState&&appState.delais?appState.delais:DELAIS;
      var deletedIds=LS.load("deletedActionIds")||[];
      setActions(function(prev){
        // Build multiple dedup keys to catch all duplicates
        var existByKey={}; 
        prev.forEach(function(a){
          // Key 1: inspectionId + ncId
          existByKey[String(a.inspectionId||"")+"__"+String(a.ncId||"")]=true;
          // Key 2: label + site (legacy)
          existByKey[(a.label||"")+"__"+(a.site||"")]=true;
        });
        var toAdd=[];
        ncItems.forEach(function(nc){
          var k1=String(ins.id)+"__"+String(nc.id);
          var k2=(nc.l||"")+"__"+(ins.site||"");
          // Skip if action already exists (any key match)
          if(existByKey[k1]) return;
          if(existByKey[k2]) return;
          // Skip if explicitly deleted
          if(deletedIds.indexOf(k1)>=0) return;
          var p=nc.poids||nc.p||"mineur";
          var prio=p==="critique"?"CRITIQUE":p==="eleve"?"ÉLEVÉE":"MODÉRÉE";
          var days=dynDel[p]!=null?Number(dynDel[p]):DELAIS[p]||120;
          var d=new Date();
          if(days>0) d.setDate(d.getDate()+days);
          var newAct={id:Date.now()+Math.floor(Math.random()*9999),label:nc.l,site:ins.site,prio:prio,statut:"En cours",echeance:d.toISOString().split("T")[0],retard:false,resp:nc.resp||"",inspectionId:ins.id,ncId:nc.id};
          toAdd.push(newAct);
          supa.upsert("actions",mapAction(newAct)).catch(function(e){console.error(e);});
        });
        if(toAdd.length===0) return prev;
        var allActs=prev.concat(toAdd);
        LS.save("actions",allActs);
        return allActs;
      });
    }
    if(isOnline){
      try{
        var patchBody={"statut":ins.statut,"score":ins.score,"nc":ins.nc,"notes":ins.notes||""};
        if(ins.sigInspecteur) patchBody["sig_inspecteur"]=ins.sigInspecteur;
        if(ins.sigResponsable) patchBody["sig_responsable"]=ins.sigResponsable;
        if(ins.items) patchBody["items"]=ins.items;
        var r=await fetch(SUPA_URL+"/rest/v1/inspections?id=eq."+String(ins.id),{
          method:"PATCH",
          headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
          body:JSON.stringify(patchBody)
        });
        if(!r.ok){
          var errText=await r.text();
          console.error("PATCH failed:",r.status,errText);
        } else {
          console.log("PATCH ok:",ins.id,"statut:",ins.statut);
        }
      }catch(e){
        console.error("updateIns error:",e);
        LS.addPending("upsert_inspection",ins);
      }
    } else {
      LS.addPending("upsert_inspection",ins);
    }
    if(ins.statut==="Validée") setSub(null);
  }
  async function updateAct(a){
    if(a.statut==="Clôturée"){
      var filtered=actions.filter(function(x){return x.id!==a.id;});
      setActions(function(){return filtered;});
      LS.save("actions",filtered);
      // Track deleted ID to prevent regeneration on reload
      var deletedIds=LS.load("deletedActionIds")||[];
      if(deletedIds.indexOf(String(a.id))===-1){ deletedIds.push(String(a.id)); }
      LS.save("deletedActionIds",deletedIds);
      if(isOnline){
        try{ await supa.del("actions",a.id); }catch(e){ LS.addPending("del_action",{id:a.id}); }
      } else {
        LS.addPending("del_action",{id:a.id});
      }
    } else {
      var updated2=actions.map(function(x){return x.id===a.id?a:x;});
      setActions(function(){return updated2;});
      LS.save("actions",updated2);
      if(isOnline){
        try{ await supa.upsert("actions",mapAction(a)); }catch(e){ LS.addPending("upsert_action",a); }
      } else {
        LS.addPending("upsert_action",a);
      }
    }
  }
  async function deleteIns(id){
    setInspections(p=>p.filter(i=>i.id!==id));
    try{ await supa.del("inspections",id); }catch(e){console.error(e);}
  };
  const pending=actions.filter(a=>a.statut!=="Clôturée").length;

  // ── Notifications - check due actions ───────────────────────
  React.useEffect(function(){
    if(!config||!config.notificationsEnabled) return undefined;
    if(!("Notification" in window)||Notification.permission!=="granted") return undefined;
    var today=new Date(); today.setHours(0,0,0,0);
    actions.filter(function(a){return a.statut!=="Clôturée"&&a.echeance;}).forEach(function(a){
      var due=new Date(a.echeance); due.setHours(0,0,0,0);
      var diff=Math.ceil((due-today)/(1000*60*60*24));
      var notifKey="secura_notif_"+a.id+"_"+a.echeance;
      if(localStorage.getItem(notifKey)) return;
      var title="",body="";
      if(diff<0){ title="🚨 Action en retard — "+a.site; body=a.label+" ("+Math.abs(diff)+"j de retard)"; }
      else if(diff===0){ title="🔴 À traiter aujourd'hui — "+a.site; body=a.label; }
      else if(diff===1){ title="⚠️ Urgente demain — "+a.site; body=a.label; }
      else if(diff<=3){ title="⏰ Dans "+diff+" jours — "+a.site; body=a.label; }
      if(title){ try{ new Notification(title,{body:body,icon:"/icon-192.png"}); localStorage.setItem(notifKey,"1"); }catch(e){} }
    });
    return undefined;
  },[actions,config]);

  // Show loading while DB loads
  if(!dbReady) return (
    <div style={{...S.app,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,background:"#07090F"}}>
      <div style={{width:48,height:48,border:"3px solid #00E5FF33",borderTop:"3px solid #00E5FF",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <div style={{color:"#00E5FF",fontSize:14,fontWeight:700}}>Connexion Supabase...</div>
    </div>
  );



  if(splash) return (
    <div style={{background:"#07090F",minHeight:"100vh"}}>
      <SplashScreen onDone={()=>setSplash(false)} appName={config.appName} accent={config.accentColor}/>
    </div>
  );
  if(!user) return <div style={appStyle}><InjectCSS/><LoginScreen onLogin={setUser} config={config} users={respsState}/></div>;

  return (
    <div style={appStyle}>
      <InjectCSS/>
      {syncMsg&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:9998,background:isOnline?C.green+"EE":C.red+"EE",color:"#fff",fontSize:12,fontWeight:700,padding:"8px 16px",textAlign:"center",letterSpacing:0.5}}>
          {syncMsg}
        </div>
      )}
      {!isOnline&&!syncMsg&&(
        <div style={{position:"fixed",top:0,left:0,right:0,zIndex:9998,background:C.amber+"EE",color:"#000",fontSize:11,fontWeight:700,padding:"6px 16px",textAlign:"center"}}>
          📵 Hors-ligne — modifications sauvegardées localement
        </div>
      )}
      <svg style={{position:"absolute",width:0,height:0}} aria-hidden="true">
        <defs>
          <filter id="dalton-deut">
            <feColorMatrix type="matrix" values="0.625 0.375 0 0 0  0.7 0.3 0 0 0  0 0.3 0.7 0 0  0 0 0 1 0"/>
          </filter>
          <filter id="dalton-prot">
            <feColorMatrix type="matrix" values="0.567 0.433 0 0 0  0.558 0.442 0 0 0  0 0.242 0.758 0 0  0 0 0 1 0"/>
          </filter>
          <filter id="dalton-trit">
            <feColorMatrix type="matrix" values="0.95 0.05 0 0 0  0 0.433 0.567 0 0  0 0.475 0.525 0 0  0 0 0 1 0"/>
          </filter>
        </defs>
      </svg>
      {sub==="detail"&&openIns&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <InspectionDetailScreen inspection={openIns} onBack={()=>setSub(null)} onUpdate={updateIns} resps={respsState} sitesState={sitesState}/>
        </div>
      )}
      {sub==="new-inspection"&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <NewInspectionScreen user={user} onSave={saveNew} onBack={()=>setSub(null)} resps={respsState} sitesState={sitesState} customTemplates={appState.customTemplates||{}} siteAddresses={appState.siteAddresses||{}} onSaveTemplate={function(cat,items){handleAppStateUpdate({...appState,customTemplates:{...(appState.customTemplates||{}),[cat]:items},sites:sitesState,resps:respsState});}}/>
        </div>
      )}
      {sub==="quick-visit"&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <QuickVisitScreen user={user} onSave={saveNew} onBack={()=>setSub(null)} sitesState={sitesState}/>
        </div>
      )}
      {sub==="comparison"&&(
        <div style={{position:"fixed",inset:0,background:bg,zIndex:200,overflowY:"auto",maxWidth:430,margin:"0 auto",WebkitOverflowScrolling:"touch"}}>
          <ComparisonScreen inspections={inspections} onBack={()=>setSub(null)}/>
        </div>
      )}
      <div style={{overflowY:"auto",height:"100vh",paddingBottom:70}}>
        {screen==="dashboard"   &&<DashboardScreen user={user} inspections={inspections} actions={actions} onNav={nav} darkMode={darkMode} onToggleDark={()=>setDarkMode(d=>!d)} config={config} sitesState={sitesState} appState={appState}/>}
        {screen==="inspections" &&<InspectionsScreen inspections={inspections} onOpen={openDetail} onNav={nav} onDelete={deleteIns} user={user} config={config}/>}
        {screen==="actions"     &&<ActionsScreen actions={actions} onUpdate={updateAct} resps={respsState} config={config} onConfigUpdate={saveConfig} user={user}/>}
        {screen==="rapports"    &&<RapportsScreen inspections={inspections} onDelete={deleteIns}/>}
        {screen==="settings"    &&<SettingsScreen user={user} onLogout={()=>{setUser(null);setScreen("dashboard");}} config={config} onConfigUpdate={saveConfig} appState={appState} respsState={respsState} sitesState={sitesState} onAppStateUpdate={handleAppStateUpdate}/>}
      </div>
      <BottomNav active={screen} onChange={setScreen} badge={pending} user={user} config={config}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App, null));
  </script>
  <script>
    if('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
